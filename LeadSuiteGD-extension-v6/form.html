<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Crear Lead — LeadSuite GD</title>
  <style>
    :root{ color-scheme: dark; }
    body{
      margin:0; font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,Arial,sans-serif;
      background: #0b0e10; color:#eafff3;
    }
    .top{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px; border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(15,20,23,.92);
    }
    .brand{ font-weight:800; letter-spacing:.06em; }
    .btn{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color:#eafff3; border-radius: 12px;
      padding:8px 10px; cursor:pointer;
    }
    .wrap{ padding:12px 14px 18px; }
    .grid{ display:grid; gap:10px; }
    label{ font-size:12px; color: rgba(234,255,243,.72); font-weight:700; }
    input, select, textarea{
      width:100%; padding:10px 12px; border-radius: 12px;
      border:1px solid rgba(255,255,255,.08);
      background:#0f1417; color:#eafff3; outline:none;
    }
    input:focus, select:focus, textarea:focus{
      border-color: rgba(39,228,139,.55);
      box-shadow: 0 0 0 3px rgba(39,228,139,.12);
    }
    .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .actions{ display:flex; gap:10px; margin-top:12px; }
    .primary{
      background: linear-gradient(180deg, rgba(39,228,139,.95), rgba(25,199,119,.92));
      color:#07110b; font-weight:900; border:none;
    }
    .muted{ font-size:12px; color: rgba(234,255,243,.62); margin-top:8px; }
    .err{ color:#ffb4b4; font-size:12px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">LeadSuite GD</div>
    <button class="btn" id="close">Cerrar</button>
  </div>

  <div class="wrap">
    <div class="muted" id="status">Conectando al CRM…</div>

    <div class="grid" style="margin-top:10px">
      <div>
        <label>Nombre cliente</label>
        <input id="nombre" placeholder="Ej: Juan Pérez">
      </div>

      <div class="row2">
        <div>
          <label>Teléfono</label>
          <input id="telefono" placeholder="+569...">
        </div>
        <div>
          <label>Email</label>
          <input id="email" placeholder="correo@dominio.cl">
        </div>
      </div>

      <div>
        <label>Dirección</label>
        <input id="direccion" placeholder="Calle / número">
      </div>

      <div class="row2">
        <div>
          <label>Comuna</label>
          <select id="comuna"></select>
        </div>
        <div>
          <label>Tipo cliente</label>
          <select id="tipo_cliente"></select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Plataforma</label>
          <select id="plataforma"></select>
        </div>
        <div>
          <label>Marca</label>
          <select id="marca"></select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Estado</label>
          <select id="estado"></select>
        </div>
        <div>
          <label>Fecha evento</label>
          <input id="fecha_evento" type="date">
        </div>
      </div>

      <div>
        <label>Notas</label>
        <textarea id="notas" rows="3" placeholder="Detalles, requerimientos…"></textarea>
      </div>

      <div class="actions">
        <button class="btn" id="saveDraft">Guardar borrador</button>
        <button class="btn primary" id="create">Crear Lead</button>
      </div>

      <div class="err" id="err"></div>
    </div>
  </div>

  <script src="form.js"></script>
</body>
</html>
