name: CRM validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Test GD Intelligence
        run: python -m unittest -q tests/test_gd_intelligence_core.py
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high
      - name: Check whitespace
        run: git diff --check

  secret-scan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: brew install gitleaks
      - name: Scan repository history
        run: gitleaks git . --redact=100 --no-banner --no-color
