<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Registro Operadores</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    html, body { height: 100%; background:#0b0e10; color:#e9ffee }
    .neumo{ background:#0f1417; border-radius:20px; box-shadow:10px 10px 30px rgba(0,0,0,.55),-8px -8px 28px rgba(255,255,255,.03),inset 0 0 0 1px rgba(255,255,255,.04) }
    .input{ background:#0e1316; border:1px solid rgba(255,255,255,.06); border-radius:12px; color:#e9ffee; padding:.75rem .9rem; width:100%; outline:0 }
    .input:focus{ border-color:rgba(39,228,139,.55); box-shadow:0 0 0 3px rgba(39,228,139,.15) }
    #field{ width:100%; height:100%; display:block; background: radial-gradient(1200px 800px at 30% 40%, rgba(39,228,139,.08), transparent 50%) }
  </style>
</head>
<body>
  <main class="h-full grid grid-cols-1 lg:grid-cols-2">
    <section class="relative overflow-hidden">
      <div class="absolute top-6 left-6 text-xs tracking-widest text-white/80 font-semibold">GREEN DIAMOND</div>
      <video autoplay muted loop playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35">
        <source src="/videos/LOGIN.mp4" type="video/mp4" />
      </video>
      <canvas id="field"></canvas>
    </section>
    <section class="flex items-center justify-center p-6 lg:p-10">
      <div class="neumo w-full max-w-md p-6 lg:p-7">
        <h1 class="text-white/90 text-xl font-semibold mb-6">Operadores / CHOP — <span class="text-white/70 font-normal">Registro</span></h1>
        <div class="text-xs text-white/65 mb-4 leading-relaxed">
          <div class="mb-1"><b>Importante:</b> aquí <b>no</b> se crea una contraseña manual.</div>
          <div>- <b>Usuario</b>: tu <b>RUT</b> (sin puntos y con guion).</div>
          <div>- <b>Contraseña inicial</b>: tu <b>teléfono</b>.</div>
        </div>
        <form id="frm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="text-sm text-white/70">Nombre</label><input id="nombre" class="input mt-1" autocomplete="given-name" /></div>
            <div><label class="text-sm text-white/70">Apellido</label><input id="apellido" class="input mt-1" autocomplete="family-name" /></div>
          </div>
          <div><label class="text-sm text-white/70">Email</label><input id="email" class="input mt-1" inputmode="email" autocomplete="email" /></div>
          <div><label class="text-sm text-white/70">RUT <span class="text-white/45">(sin puntos, con guion)</span></label><input id="rut" class="input mt-1" placeholder="Ej: 12345678-9" autocapitalize="none" /></div>
          <div><label class="text-sm text-white/70">Teléfono <span class="text-white/45">(tu contraseña inicial)</span></label><input id="telefono" class="input mt-1" inputmode="tel" autocomplete="tel" placeholder="Ej: +56912345678" /></div>
          <button class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-black font-semibold rounded-lg py-2.5">Crear cuenta</button>
          <div class="text-center text-xs mt-3 text-white/60">¿Ya tienes cuenta? <a href="./login.html" class="text-emerald-400 hover:text-emerald-300">Volver al login</a></div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const $=(q,c=document)=>c.querySelector(q);
    const API_BASE = (location.pathname.startsWith('/crm/') || location.pathname.startsWith('/web/')) ? '/crm' : '';

    (function(){
      const cv=$('#field'),ctx=cv.getContext('2d'); function fit(){cv.width=cv.clientWidth;cv.height=cv.clientHeight} addEventListener('resize',fit);fit();
      const pts=Array.from({length:90},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()*2-1)*.4,vy:(Math.random()*2-1)*.4,r:Math.random()*1.7+.6}));
      (function tick(){ctx.clearRect(0,0,cv.width,cv.height);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>cv.width)p.vx*=-1;if(p.y<0||p.y>cv.height)p.vy*=-1}
        for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){ctx.strokeStyle=`rgba(39,228,139,${(1-d/120)*.25})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
        for(const p of pts){ctx.fillStyle="rgba(39,228,139,.85)";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()} requestAnimationFrame(tick)})();
    })();

    $('#frm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const rutRaw = $('#rut').value.trim();
      const rut = rutRaw.replace(/\./g,'').replace(/\s+/g,'').replace(/[\u2010\u2011\u2012\u2013\u2014]/g,'-');
      const tel = $('#telefono').value.trim();
      const payload = {
        nombre: [$('#nombre').value.trim(), $('#apellido').value.trim()].filter(Boolean).join(' ').trim(),
        email: $('#email').value.trim(),
        rut,
        telefono: tel
      };
      if (!payload.nombre || !payload.email || !payload.rut || !payload.telefono){
        Swal.fire('Error','Completa todos los campos','error'); return;
      }
      if (!/^\d{6,9}-[\dkK]$/.test(payload.rut)){
        Swal.fire('Error','RUT inválido. Debe ir sin puntos y con guion (ej: 12345678-9)','error'); return;
      }
      try{
        const r = await fetch(`${API_BASE}/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error(await r.text());
        await Swal.fire('OK','Cuenta creada. Ahora inicia sesión.','success');
        location.href='./login.html';
      }catch(err){
        Swal.fire('Error', err.message || 'No se pudo registrar', 'error');
      }
    });
  </script>
</body>
</html>
