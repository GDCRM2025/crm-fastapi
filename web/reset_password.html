<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>CRM 2025 — Restablecer clave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{gd:{bg:"#0b0e10",panel:"#0f1417",mint:"#27e48b"}},boxShadow:{neumo:"10px 10px 30px rgba(0,0,0,.55), -8px -8px 28px rgba(255,255,255,.03), inset 0 0 0 1px rgba(255,255,255,.04)"}}}}</script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    html, body { height: 100%; background:#0b0e10; color:#e9ffee }
    .neumo{ background:#0f1417; border-radius:20px; box-shadow:var(--tw-shadow),10px 10px 30px rgba(0,0,0,.55),-8px -8px 28px rgba(255,255,255,.03),inset 0 0 0 1px rgba(255,255,255,.04) }
    .input{ background:#0e1316; border:1px solid rgba(255,255,255,.06); border-radius:12px; color:#e9ffee; padding:.75rem .9rem; width:100%; outline:0 }
    .input:focus{ border-color:rgba(39,228,139,.55); box-shadow:0 0 0 3px rgba(39,228,139,.15) }
  </style>
</head>
<body>
  <main class="h-full grid place-items-center px-6">
    <div class="neumo w-full max-w-md p-6">
      <div class="text-sm opacity-70 tracking-widest font-semibold mb-2">GREEN DIAMOND</div>
      <h1 class="text-xl font-bold mb-4">Restablecer contraseña</h1>
      <form id="frm" class="space-y-3">
        <label class="text-sm opacity-80">Nueva clave
          <input id="p1" type="password" class="input mt-1" required />
        </label>
        <label class="text-sm opacity-80">Confirmar clave
          <input id="p2" type="password" class="input mt-1" required />
        </label>
        <button class="w-full mt-2 bg-green-500/90 hover:bg-green-500 text-black font-semibold py-2 rounded-xl">Cambiar clave</button>
      </form>
      <div class="text-xs opacity-60 mt-4">Si el link expiró, solicita uno nuevo desde el login.</div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const form = document.getElementById("frm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const p1 = document.getElementById("p1").value.trim();
      const p2 = document.getElementById("p2").value.trim();
      if (!token){
        Swal.fire("Error","Token inválido o faltante.","error");
        return;
      }
      if (!p1 || !p2){
        Swal.fire("Error","Debes completar ambos campos.","error");
        return;
      }
      if (p1 !== p2){
        Swal.fire("Error","Las contraseñas no coinciden.","error");
        return;
      }
      try{
        const r = await fetch("/auth/password-reset", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ token, password: p1, password2: p2 })
        });
        if (!r.ok) throw new Error(await r.text());
        await Swal.fire("Listo","Tu clave fue actualizada.","success");
        location.href = "/web/login.html";
      }catch(err){
        Swal.fire("Error", err.message || "No se pudo actualizar la clave", "error");
      }
    });
  </script>
</body>
</html>
