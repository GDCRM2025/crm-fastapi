<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GREEN DIAMOND — CRM</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&family=Manrope:wght@400;600;800&family=Sora:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&family=Rubik:wght@400;600;800&family=Poppins:wght@400;600;800&family=Nunito:wght@400;600;800&family=Montserrat:wght@400;600;800&family=Urbanist:wght@400;600;800&family=Source+Sans+3:wght@400;600;800&family=Fraunces:wght@400;600;800&family=Playfair+Display:wght@400;600;800&family=JetBrains+Mono:wght@400;600;800&display=swap");
  </style>

	    <link rel="stylesheet" href="./styles.css?v=20260404-5" />
	    <link rel="stylesheet" href="./panel.css?v=20260404-5" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="app">
  <!-- TOPBAR -->
	  <header class="topbar gcp">
	    <div class="tb-left">
	      <button class="iconbtn" id="btnSidebar" aria-label="Menú">☰</button>
	      <button class="iconbtn" id="btnSidebarPinTop" aria-label="Fijar menú" title="Fijar menú">🔓</button>
	      <button class="brand brand-home" id="brandHome" aria-label="Dashboard">
	        <span class="brand-ico">◆</span>
	        <span>GREEN DIAMOND</span>
	      </button>
	    </div>

    <div class="tb-right">
      <button class="iconbtn" id="btnHelp" title="Ayuda y manual del CRM" aria-label="Ayuda">?</button>
      <button class="iconbtn" id="btnGpt" title="GPT">
        ✨
      </button>
      <div class="notif-wrap">
        <button class="iconbtn notif-dot" id="btnNotifs" title="Notificaciones" aria-label="Notificaciones">
          <span class="notif-dot-ring"></span>
          <span class="notif-dot-count" id="notifBadge">0</span>
        </button>
      </div>
      <button class="iconbtn" id="btnChatTop" title="Chat interno">💬</button>

      <div class="sys-wrap">
        <button class="iconbtn sys-iconbtn" id="btnSystemTop" aria-label="Sistema" title="Sistema">🛡️</button>
        <div class="sys-menu" id="systemMenuTop" aria-hidden="true">
          <button class="sys-item" id="sysBackup" style="display:none;">Backup</button>
          <button class="sys-item" id="sysRefresh">Actualizar sistema</button>
          <button class="sys-item danger" id="sysLogout">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
	    <aside class="sidebar collapsed" id="sidebar">
		      <div class="sidebar-inner">
		        <div class="sidebar-tools" id="sidebarTools">
		          <div class="sb-search">
		            <input id="sideSearch" placeholder="Buscar en el menú…" autocomplete="off" />
		          </div>
		          <div class="sb-results" id="sideSearchResults" aria-hidden="true"></div>
		        </div>
		        <nav class="side-nav" id="sideMenu"></nav>

	        <!-- Bottom: Sistema (perfil + personalización + avatar) -->
	        <div class="sidebar-bottom">
	          <button class="user-btn sidebar-user-btn" id="btnUserMenu" aria-label="Sistema">
	            <span class="user-avatar" id="userAvatar">GD</span>
	          </button>

	          <div class="user-menu" id="userMenu" aria-hidden="true">
	            <!-- Tabs -->
	            <div class="um-tabs" role="tablist" aria-label="Perfil">
	              <button class="um-tab active" data-um-tab-btn="perfil" role="tab" aria-selected="true">Perfil</button>
	              <button class="um-tab" data-um-tab-btn="personalizacion" role="tab" aria-selected="false">Personalización</button>
	            </div>

	            <div class="um-tab-panels">
	              <div class="um-sec um-tabsec active" data-um-tab="perfil" role="tabpanel">
	                <div class="um-title">Perfil</div>
	                <div class="um-row">
	                  <label>Nombre</label>
	                  <input id="prefName" placeholder="Nombre" />
	                </div>
	                <div class="um-row">
	                  <label>Email</label>
	                  <input id="prefEmail" placeholder="email@empresa.cl" />
	                </div>
	                <div class="um-row">
	                  <label>Teléfono</label>
	                  <input id="prefPhone" placeholder="+56..." />
	                </div>
	                <div class="um-row">
	                  <label>Foto</label>
	                  <button class="um-btn ghost" id="prefPhotoBtn">Cambiar foto</button>
	                </div>
	                <div class="um-actions" style="margin-top:10px;">
	                  <button class="um-btn" id="prefSave">Guardar perfil</button>
	                </div>
	              </div>

	              <div class="um-sec um-tabsec" data-um-tab="personalizacion" role="tabpanel">
	                <div class="um-title">Personalización</div>
	                <div class="um-row">
	                  <label>Tema</label>
		                  <label class="theme-switch mini" title="Tema: Noche / Día">
		                    <span class="ts-ico" title="Noche">🌙</span>
		                    <input id="themeToggle" type="checkbox" />
		                    <span class="ts-track"></span>
		                    <span class="ts-ico" title="Día">☀️</span>
		                  </label>
	                </div>
	                <div class="um-row">
	                  <label>Fuente</label>
	                  <select id="fontSelect">
	                    <option value="system" style="font-family:system-ui;">Sistema</option>
	                    <option value="rounded" style="font-family:'Rounded Mplus 1c','Nunito',system-ui;">Redondeada</option>
	                    <option value="manrope" style="font-family:'Manrope','Segoe UI',system-ui;">Manrope</option>
	                    <option value="sora" style="font-family:'Sora','Segoe UI',system-ui;">Sora</option>
	                    <option value="jakarta" style="font-family:'Plus Jakarta Sans','Segoe UI',system-ui;">Jakarta</option>
	                    <option value="rubik" style="font-family:'Rubik','Segoe UI',system-ui;">Rubik</option>
	                    <option value="dmsans" style="font-family:'DM Sans','Segoe UI',system-ui;">DM Sans</option>
	                    <option value="poppins" style="font-family:'Poppins','Segoe UI',system-ui;">Poppins</option>
	                    <option value="nunito" style="font-family:'Nunito','Segoe UI',system-ui;">Nunito</option>
	                    <option value="montserrat" style="font-family:'Montserrat','Segoe UI',system-ui;">Montserrat</option>
	                    <option value="urbanist" style="font-family:'Urbanist','Segoe UI',system-ui;">Urbanist</option>
	                    <option value="sourcesans" style="font-family:'Source Sans 3','Segoe UI',system-ui;">Source Sans</option>
	                    <option value="serif" style="font-family:'Fraunces','Times New Roman',serif;">Serif moderna</option>
	                    <option value="playfair" style="font-family:'Playfair Display','Times New Roman',serif;">Playfair</option>
	                    <option value="mono" style="font-family:'JetBrains Mono','Menlo',monospace;">Mono</option>
	                  </select>
	                </div>
	                <div class="um-row">
	                  <label>Tamaño</label>
	                  <select id="fontSize">
	                    <option value="12">Pequeña</option>
	                    <option value="13" selected>Normal</option>
	                    <option value="14">Grande</option>
	                    <option value="15">Extra</option>
	                  </select>
	                </div>
	                <div class="um-row">
	                  <label>Color principal (botones y destacados)</label>
	                  <input id="accentPick" type="color" value="#19c37d" />
	                </div>
	                <div class="um-row">
	                  <label>Color de texto general</label>
	                  <input id="textPick" type="color" value="#e2e8f0" />
	                </div>
	                <button class="um-btn ghost" data-open="set_el">Colores de estados</button>
	              </div>
	            </div>
	          </div>
	        </div>
	      </div>
	    </aside>

    <main class="main">
      <iframe id="mainFrame" class="frame" title="Contenido" allow="geolocation"></iframe>
    </main>
  </div>

  <!-- NOTIFICATION MENU -->
  <div class="notif-menu" id="notifMenu" aria-hidden="true"></div>

  <!-- USER PHOTO MODAL -->
  <div class="gd-modal" id="photoModal" aria-hidden="true">
    <div class="gd-modal-bg" id="photoModalBg"></div>
    <div class="gd-modal-card">
      <div class="gd-modal-title">Foto de perfil</div>
      <div class="gd-modal-row">
        <input id="prefPhoto" placeholder="URL de la foto (opcional)" />
        <button class="um-btn" id="photoApply">Aplicar</button>
      </div>
      <div class="gd-modal-row" style="margin-top:8px;">
        <input id="photoFile" type="file" accept="image/*" />
      </div>
      <div class="gd-modal-text">También puedes seleccionar una imagen local (se guarda solo en este navegador).</div>
      <div class="gd-modal-preview" id="photoPreview">Sin foto</div>
      <div class="gd-modal-actions">
        <button class="um-btn ghost" id="photoCancel">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- PREF PREVIEW MODAL -->
  <div class="gd-modal" id="prefModal" aria-hidden="true">
    <div class="gd-modal-bg" id="prefModalBg"></div>
    <div class="gd-modal-card">
      <div class="gd-modal-title">Previsualización</div>
      <div class="gd-modal-text">¿Aplicar estos cambios solo para tu usuario?</div>
      <div class="pref-preview" id="prefPreviewModal">
        <div class="pp-title">Vista previa</div>
        <div class="pp-row">
          <button class="pp-btn">Botón principal</button>
          <button class="pp-btn ghost">Botón secundario</button>
        </div>
        <div class="pp-text" id="fontPreviewModal">Texto de ejemplo — 012345</div>
      </div>
      <div class="gd-modal-actions">
        <button class="um-btn ghost" id="prefCancel">Cancelar</button>
        <button class="um-btn" id="prefApply">Aplicar</button>
      </div>
    </div>
  </div>

  <!-- CHAT MODAL -->
  <div class="gd-modal" id="chatModal" aria-hidden="true">
    <div class="gd-modal-bg" id="chatModalBg"></div>
    <div class="gd-modal-card" style="width:min(900px,95vw);">
      <div class="gd-modal-title">Chat interno</div>
      <iframe id="chatFrame" src="./views/chat.html?v=20260326-1" style="width:100%;height:70vh;border:0;border-radius:12px;"></iframe>
      <div class="gd-modal-actions">
        <button class="um-btn ghost" id="chatClose">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- WEATHER MODAL -->
  <div class="wx-modal" id="wxModal" aria-hidden="true">
    <div class="wx-backdrop" id="wxModalBg"></div>

    <section class="wx-card" role="dialog" aria-modal="true" aria-label="Clima">
      <button class="wx-close" id="wxClose" aria-label="Cerrar">✕</button>

      <header class="wx-head">
        <div class="wx-loc" id="wxModalCity">—</div>

        <div class="wx-main">
          <div class="wx-big-temp" id="wxModalTemp">—°</div>
          <div class="wx-big-ico" id="wxModalIco">☀️</div>
        </div>

        <div class="wx-cond" id="wxModalNow">—</div>
        <div class="wx-sub" id="wxSummary">—</div>
      </header>

      <div class="wx-block">
        <div class="wx-block-title">AHORA</div>
        <div class="wx-hours" id="wxHours"></div>
      </div>

      <div class="wx-block">
        <div class="wx-block-title">PREVISIÓN (7 DÍAS)</div>
        <div class="wx-days" id="wxDays"></div>
      </div>
    </section>
  </div>

  <script type="module" src="./js/panel.js?v=20260808-gdi-health-v1"></script>
  <script type="module" src="./js/weather.js?v=20260206-1"></script>
</body>
</html>
