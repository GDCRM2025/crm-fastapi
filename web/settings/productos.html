<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Productos</title>

  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="./_base.js"></script>
</head>

<body>

<div class="toolbar">
  <button id="btnNew" class="btn">Crear</button>
  <input id="q" class="input" placeholder="Buscar producto...">
  <div class="spacer"></div>
  <label>Ver <select id="per" class="input"><option>20</option><option>50</option><option>100</option></select></label>
</div>

<h2 id="title">Productos</h2>

<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Producto</th>
      <th>Ingredientes</th>
      <th>Marca</th>
      <th>Costo</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="pager">
  <button id="prev" class="btn ghost">Anterior</button>
  <span id="info"></span>
  <button id="next" class="btn ghost">Siguiente</button>
</div>

<script type="module">
  import { initCrud } from "./_base.js";

  initCrud({
    title:'Productos',
    base:'/productos',
    id:'id_producto',
    columns:[
      {key:'producto',label:'Producto',required:true},
      {key:'ingredientes',label:'Ingredientes'},
      {key:'marca',label:'Marca',required:true},
      {key:'costo',label:'Costo',type:'money'}
    ],
    searchKeys:['producto','ingredientes','marca']
  });
</script>

</body>
</html>
