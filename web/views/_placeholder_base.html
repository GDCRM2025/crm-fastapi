<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/web/styles.css" />
  <link rel="stylesheet" href="/web/ui_overrides.css" />
  <title>CRM</title>
</head>
<body style="padding:18px">
  <section class="card" style="max-width: 980px">
    <h2 id="t" style="margin:0 0 8px 0">—</h2>
    <p id="d" style="opacity:.85; margin:0">—</p>
  </section>

  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById("t").textContent = p.get("t") || "Módulo";
    document.getElementById("d").textContent =
      p.get("d") || "Placeholder funcional. Aquí aterrizamos el desarrollo con datos reales.";
    window.addEventListener("message", (ev) => {
      if (ev.data?.type === "theme") {
        document.documentElement.classList.toggle("light", ev.data.mode === "light");
      }
    });
  </script>
</body>
</html>
