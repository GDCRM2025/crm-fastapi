<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checklist de eventos</title>
  <link rel="stylesheet" href="/web/styles.css?v=20260323-1" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .wrap{ padding: 16px; }
    .top{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between; margin-bottom:12px; }
    .title{ font-weight: 1100; font-size: 20px; }
    .controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .inp{ border:1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 12px; padding: 10px 12px; font-weight: 900; }
    .btn{ border:1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; padding: 10px 12px; font-weight: 1000; cursor:pointer; }
    .btn.ok{ background: rgba(25,195,125,.14); border-color: rgba(25,195,125,.28); }
    .btn:hover{ background: var(--hover-surface); }
    .pill{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border); background: var(--surface); padding: 6px 10px; border-radius: 999px; font-weight: 1000; }
    .sheetWrap{overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);}
    .tbl{ width:100%; min-width:1260px; border-collapse: collapse; }
    .tbl th{position:sticky;top:0;background:#0b7f43;color:#fff;padding:10px 8px;text-align:center;font-size:12px;letter-spacing:.03em;z-index:1;}
    .tbl td{ padding: 9px 8px; vertical-align:middle; border-bottom:1px solid var(--border); text-align:center; font-weight:900; }
    .tbl tr.okRow{background:rgba(25,195,125,.08);}
    .tbl tr.warnRow{background:rgba(245,158,11,.08);}
    .muted{ color: var(--muted); font-weight: 900; }
    .name{ font-weight: 1100; }
    .mini{ font-size: 12px; }
    .checks{ display:grid; grid-template-columns: repeat(3, minmax(86px, 1fr)); gap: 6px; }
    .chk{
      display:flex; align-items:center; gap:8px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-weight: 1000;
      user-select:none;
    }
    .chk.miss{ border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.06); }
    .chk input{ width:18px; height:18px; }
    .actions{ display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .actions .btn{ padding: 9px 11px; }
    .grid2{ display:grid; grid-template-columns: 1fr; gap: 10px; }
    .notes{ width:100%; min-height: 42px; resize: vertical; min-width:220px; }
    .equiposCell{max-width:260px;text-align:left!important;white-space:pre-wrap;}
    .dayBand{margin:0 0 8px 0;padding:10px 12px;background:rgba(11,127,67,.14);border:1px solid rgba(11,127,67,.28);border-radius:8px;font-weight:1100;}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
    .metric{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px;}
    .metric .n{font-size:25px;font-weight:1100;}
    .metric.warn .n{color:#d97706}.metric.ok .n{color:#0b7f43}
    @media (max-width: 980px){
      .checks{ grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      .actions{ justify-content:flex-start; }
      .metrics{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">Checklist de eventos (día)</div>
        <div class="muted mini">Ejecutivos: confirmen que no falta nada antes de Operaciones.</div>
      </div>
      <div class="controls">
        <span class="pill"><span class="muted">Día</span> <input class="inp" type="date" id="day" /></span>
        <button class="btn" id="btnReload">Actualizar</button>
        <button class="btn ok" id="btnHelp">¿Cómo se usa?</button>
      </div>
    </div>

    <div class="dayBand" id="meta"></div>
    <section class="metrics">
      <div class="metric"><div class="n" id="mTotal">0</div><div class="muted">Eventos confirmados</div></div>
      <div class="metric ok"><div class="n" id="mReady">0</div><div class="muted">Checklist 100%</div></div>
      <div class="metric warn"><div class="n" id="mPending">0</div><div class="muted">Pendientes de revisión</div></div>
      <div class="metric warn"><div class="n" id="mData">0</div><div class="muted">Con datos faltantes</div></div>
    </section>

    <div class="sheetWrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre cliente</th>
            <th>Comuna</th>
            <th>Marca</th>
            <th>Equipos</th>
            <th>Salida</th>
            <th>Comienzo</th>
            <th>Término</th>
            <th>Duración</th>
            <th>OPS #</th>
            <th>Despacha</th>
            <th>Retira</th>
            <th>Operadores</th>
            <th>Check</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    const qs=(s,el=document)=>el.querySelector(s);
    const esc=(s)=>String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[m]||m));
    const API_BASE = (() => {
      try { const h=String(location.hostname||"").toLowerCase(); return (h==="localhost"||h==="127.0.0.1") ? "" : "/crm"; }
      catch(_){ return ""; }
    })();
    function getToken(){ return localStorage.getItem("token")||sessionStorage.getItem("token")||""; }
    function authHeaders(extra={}){ const t=getToken(); return t?{...extra,Authorization:`Bearer ${t}`} : extra; }
    function apiURL(u){
      const s=String(u||"");
      if(!s) return s;
      if(/^https?:\/\//i.test(s)) return s;
      if(s.startsWith("/")) return API_BASE + s;
      return API_BASE + "/" + s;
    }
    async function apiJSON(url, init={}){
      const r = await fetch(apiURL(url), { ...init, headers: authHeaders(init.headers || {}) });
      const text = await r.text();
      let j=null; try{ j = text?JSON.parse(text):null; }catch(_){}
      if(!r.ok) throw new Error(String((j&&(j.detail||j.error))||(text||r.status)));
      return j;
    }

    window.addEventListener("message",(ev)=>{
      if(ev.data?.type==="theme") document.documentElement.classList.toggle("light", ev.data.mode==="light");
    });

    const KEYS = [
      ["cliente","Cliente"],
      ["contacto","Contacto"],
      ["direccion","Dirección"],
      ["comuna","Comuna"],
      ["marca","Marca"],
      ["equipos","Equipos"],
      ["salida","Salida"],
      ["inicio","Inicio"],
      ["fin","Término"],
      ["ops","OPS"],
      ["operadores","Operadores"],
    ];

    function fmtTime(iso){
      const s=String(iso||"");
      if(!s) return "";
      // "2026-03-20T11:00:00" o "2026-03-20 11:00:00"
      const m = s.match(/(\d{2}:\d{2})/);
      return m ? m[1] : s.slice(11,16);
    }
    function duration(start,end){
      const a=fmtTime(start), b=fmtTime(end);
      if(!a||!b) return "";
      const [ah,am]=a.split(":").map(Number), [bh,bm]=b.split(":").map(Number);
      let m=(bh*60+bm)-(ah*60+am);
      if(m<0) m+=24*60;
      return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
    }

    function progress(items){
      const ks = Object.keys(items||{});
      if(!ks.length) return { pct:0, a:0, b:0 };
      const a = ks.filter(k => !!items[k]).length;
      return { pct: Math.round((a/ks.length)*100), a, b: ks.length };
    }

    async function openLead(id){
      const lid = Number(id||0);
      if(!lid) return;
      const url = apiURL(`/web/views/leads.html?v=20260326-leads2&embed=1&open_lead=${lid}&from=checklist`);
      await Swal.fire({
        title: `Lead #${lid}`,
        html: `<iframe src="${url}" style="width:100%;height:72vh;border:0;border-radius:16px;background:transparent" allow="clipboard-read; clipboard-write"></iframe>`,
        width: 980,
        showConfirmButton: false,
        showCloseButton: true,
        customClass: { popup: "gdModal" },
      });
    }

    async function saveRow(lid, day, items, notes){
      return apiJSON(`/checklist/events/${lid}/confirm`, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ day, items, notes }),
      });
    }

    function rowHTML(it){
      const lid = it.id_lead;
      const miss = it.missing || {};
      const saved = it.checklist || { items:{}, notes:"", updated_at:"" };
      const items = saved.items || {};
      // Defaults: si no hay guardado, marcar como "true" cuando el campo existe (asistencia al usuario)
      const initial = {};
      for(const [k] of KEYS){
        if (items && Object.prototype.hasOwnProperty.call(items,k)) initial[k] = !!items[k];
        else initial[k] = !miss[k]; // si está completo en data, lo propone como OK
      }
      const pr = progress(initial);

      return `
        <tr class="row ${pr.pct===100 ? "okRow" : "warnRow"}" data-lead="${lid}">
          <td>${esc(it._n||"")}</td>
          <td style="text-align:left"><div class="name">${esc(it.cliente||"—")}</div><div class="muted mini">Lead #${esc(lid)}</div></td>
          <td>${esc(it.comuna||"—")}</td>
          <td>${esc(it.marca||"—")}</td>
          <td class="equiposCell">${esc(it.equipos||it.productos_text||it.montaje_text||"—")}</td>
          <td>${esc(it.salida||"")}</td>
          <td>${esc(fmtTime(it.start_at)||"—")}</td>
          <td>${esc(fmtTime(it.end_at)||"—")}</td>
          <td>${esc(duration(it.start_at,it.end_at)||"—")}</td>
          <td>${esc(it.ops||0)}</td>
          <td>${esc(it.despacha||"")}</td>
          <td>${esc(it.retira||"")}</td>
          <td>${esc(it.operadores||"")}</td>
          <td>
            <div class="checks">
              ${KEYS.map(([k,label])=>`
                <label class="chk ${miss[k] ? "miss":""}">
                  <input type="checkbox" data-k="${esc(k)}" ${initial[k] ? "checked":""} />
                  <span>${esc(label)}</span>
                </label>
              `).join("")}
            </div>
            <div class="grid2" style="margin-top:8px">
              <textarea class="inp notes" data-notes placeholder="Notas (opcional, queda en historial)">${esc(saved.notes||"")}</textarea>
            </div>
          </td>
          <td>
            <div class="actions">
              <button class="btn" data-open>Ver lead</button>
              <button class="btn ok" data-save>Guardar</button>
              <span class="muted mini" data-stamp>${saved.updated_at ? (`Guardado por ${esc(saved.username||"usuario")}: ` + esc(String(saved.updated_at).replace("T"," ").slice(0,16))) : `${pr.pct}%`}</span>
            </div>
          </td>
        </tr>
      `;
    }

    async function load(){
      const day = qs("#day").value;
      qs("#meta").textContent = "Cargando…";
      try{
        const out = await apiJSON(`/checklist/events?day=${encodeURIComponent(day)}`);
        const items = Array.isArray(out?.items) ? out.items : [];
        const calculated = items.map(it=>{
          const saved=it.checklist?.items||{};
          const values={};
          for(const [k] of KEYS){
            values[k]=Object.prototype.hasOwnProperty.call(saved,k)?!!saved[k]:!it.missing?.[k];
          }
          return progress(values).pct;
        });
        const ready=calculated.filter(x=>x===100).length;
        qs("#mTotal").textContent=String(items.length);
        qs("#mReady").textContent=String(ready);
        qs("#mPending").textContent=String(Math.max(0,items.length-ready));
        qs("#mData").textContent=String(out?.summary?.data_incomplete||0);
        const err = String(out?.error || "").trim();
        qs("#meta").textContent = err
          ? `Sin datos (backend): ${err}`
          : (items.length ? `Eventos confirmados del día: ${items.length}` : "Sin eventos confirmados para este día.");
        const tb = qs("#tb");
        tb.innerHTML = items.map((it,i)=>({...it,_n:i+1})).map(rowHTML).join("") || `<tr><td colspan="15" class="muted">Sin eventos para revisar.</td></tr>`;

        tb.querySelectorAll("tr.row").forEach(tr=>{
          const lid = Number(tr.getAttribute("data-lead")||0);
          tr.querySelector("[data-open]")?.addEventListener("click", ()=>openLead(lid));
          tr.querySelector("[data-save]")?.addEventListener("click", async ()=>{
            const items = {};
            tr.querySelectorAll("input[type=checkbox][data-k]").forEach(ch=>{
              items[ch.getAttribute("data-k")] = !!ch.checked;
            });
            const notes = String(tr.querySelector("[data-notes]")?.value || "").trim();
            try{
              await saveRow(lid, day, items, notes);
              const pr = progress(items);
              tr.classList.toggle("okRow", pr.pct===100);
              tr.classList.toggle("warnRow", pr.pct!==100);
              const stamp = tr.querySelector("[data-stamp]");
              if (stamp) stamp.textContent = "Guardado.";
              const rows=[...tb.querySelectorAll("tr.row")];
              const readyNow=rows.filter(row=>row.classList.contains("okRow")).length;
              qs("#mReady").textContent=String(readyNow);
              qs("#mPending").textContent=String(Math.max(0,rows.length-readyNow));
              Swal.fire({ toast:true, position:"top-end", timer:1800, showConfirmButton:false, icon:"success", title:"Checklist guardado" });
            }catch(e){
              Swal.fire({ icon:"error", title:"No pude guardar", text:String(e.message||e).slice(0,200) });
            }
          });
        });
      }catch(e){
        qs("#tb").innerHTML = "";
        qs("#meta").textContent = `Error cargando checklist: ${String(e?.message||e).slice(0,220)}`;
      }
    }

    // init
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth()+1).padStart(2,"0");
    const d = String(today.getDate()).padStart(2,"0");
    qs("#day").value = `${y}-${m}-${d}`;
    qs("#btnReload").onclick = load;
    qs("#day").addEventListener("change", load);
    qs("#btnHelp").onclick = ()=>Swal.fire({
      title:"Checklist (día)",
      html:`<div style="text-align:left">
        <div class="muted">Objetivo: confirmar que Operaciones reciba info completa.</div>
        <ul style="margin:10px 0 0 18px">
          <li>Marca/Comuna/Cliente correctos</li>
          <li>Equipos (montaje + productos) revisados</li>
          <li>Inicio/Término y OPS definidos</li>
        </ul>
        <div class="muted" style="margin-top:10px">Al guardar, queda registro en el historial del lead.</div>
      </div>`,
      confirmButtonText:"Entendido",
      customClass:{ popup:"gdModal" }
    });

    load();
  </script>
</body>
</html>
