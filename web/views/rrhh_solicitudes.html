<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RRHH · Solicitudes</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <style>
    body{ margin:0; padding:18px; color:inherit; }
    .card{ border-radius:18px; padding:14px; border:1px solid rgba(255,255,255,.12); background:rgba(7,12,16,.45); }
    :root.light .card{ background:rgba(255,255,255,.75); border-color:rgba(0,0,0,.1); color:#0f172a; }
    .title{ font-weight:1000; font-size:18px; }
    .muted{ opacity:.7; font-size:12px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .inp{ height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:transparent; color:inherit; padding:0 10px; font-weight:800; min-width:180px; }
    .btn{ height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:transparent; color:inherit; padding:0 12px; cursor:pointer; font-weight:900; }
    table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
    th,td{ padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; white-space:nowrap; }
    th{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; }
    .table-wrap{ overflow:auto; max-height:70vh; border:1px solid rgba(255,255,255,.12); border-radius:12px; margin-top:10px; }
  </style>
</head>
<body>
  <section class="card">
    <div class="row" style="justify-content:space-between;">
      <div>
        <div class="title">Recursos Humanos</div>
        <div class="muted">Solicitudes de colaboradores</div>
      </div>
    </div>

    <div style="margin-top:12px;">
      <div class="row">
        <input class="inp" id="solColab" placeholder="Colaborador" />
        <select class="inp" id="solTipo">
          <option value="">Tipo</option>
          <option value="adelanto">Adelanto</option>
          <option value="vacaciones">Vacaciones</option>
          <option value="permiso">Permiso</option>
          <option value="documento">Documento</option>
        </select>
        <input class="inp" id="solIni" type="date" />
        <input class="inp" id="solFin" type="date" />
        <input class="inp" id="solDias" placeholder="Días" />
        <input class="inp" id="solMonto" placeholder="Monto" />
        <input class="inp" id="solMotivo" placeholder="Motivo" style="flex:1;min-width:220px;" />
        <button class="btn" id="solCrear">Enviar solicitud</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <select class="inp" id="fEstado">
          <option value="">Estado (todos)</option>
          <option value="pendiente">Pendiente</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
        </select>
        <button class="btn" id="solReload">Actualizar</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Colaborador</th>
              <th>Tipo</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Días</th>
              <th>Monto</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="solRows">
            <tr><td class="muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    const qs = (s, el=document) => el.querySelector(s);
    function token(){ return localStorage.getItem("token") || sessionStorage.getItem("token") || ""; }
    function headers(){ return token() ? { Authorization: "Bearer " + token() } : {}; }
    function fmt(n){
      if (n == null || n === "") return "—";
      const v = Number(n);
      if (Number.isFinite(v)) return v.toLocaleString("es-CL");
      return n;
    }
    function toast(msg){
      const t = document.createElement("div");
      t.textContent = msg;
      Object.assign(t.style,{position:"fixed",right:"16px",bottom:"16px",background:"rgba(0,0,0,.8)",color:"#fff",padding:"10px 14px",borderRadius:"10px",zIndex:99,fontWeight:"900"});
      document.body.appendChild(t);
      setTimeout(()=> t.remove(), 2400);
    }

    async function load(){
      const estado = qs("#fEstado").value;
      const r = await fetch(`/rrhh/solicitudes${estado ? "?estado="+estado : ""}`, { headers: headers() });
      if (!r.ok){
        const t = await r.text().catch(()=> "");
        qs("#solRows").innerHTML = `<tr><td class="muted">No se pudo cargar: ${t || r.status}</td></tr>`;
        return;
      }
      const data = await r.json();
      if (data.ok === false){
        qs("#solRows").innerHTML = `<tr><td class="muted">No se pudo cargar: ${data.detail || "Error"}</td></tr>`;
        return;
      }
      const items = data.items || [];
      qs("#solRows").innerHTML = items.map(i => `
        <tr>
          <td><strong>${i.colaborador || "—"}</strong></td>
          <td>${i.tipo || "—"}</td>
          <td>${i.fecha_inicio ? String(i.fecha_inicio).slice(0,10) : "—"}</td>
          <td>${i.fecha_fin ? String(i.fecha_fin).slice(0,10) : "—"}</td>
          <td>${fmt(i.dias)}</td>
          <td>${fmt(i.monto)}</td>
          <td>${i.estado || "—"}</td>
          <td>
            <button class="btn" data-ap="${i.id_solicitud}">Aprobar</button>
            <button class="btn" data-rj="${i.id_solicitud}">Rechazar</button>
            <button class="btn" data-pdf="${i.id_solicitud}">PDF</button>
          </td>
        </tr>
      `).join("") || `<tr><td class="muted">Sin datos.</td></tr>`;

      qs("#solRows").querySelectorAll("[data-ap]").forEach(b => {
        const id = Number(b.dataset.ap || 0);
        b.addEventListener("click", async () => {
          const r = await fetch(`/rrhh/solicitudes/${id}`, { method:"PUT", headers:{ "Content-Type":"application/json", ...headers() }, body: JSON.stringify({ estado: "aprobado" }) });
          if (!r.ok){ const t = await r.text().catch(()=> ""); toast("No se pudo aprobar: "+(t||r.status)); return; }
          toast("Solicitud aprobada");
          await load();
        });
      });
      qs("#solRows").querySelectorAll("[data-rj]").forEach(b => {
        const id = Number(b.dataset.rj || 0);
        b.addEventListener("click", async () => {
          const r = await fetch(`/rrhh/solicitudes/${id}`, { method:"PUT", headers:{ "Content-Type":"application/json", ...headers() }, body: JSON.stringify({ estado: "rechazado" }) });
          if (!r.ok){ const t = await r.text().catch(()=> ""); toast("No se pudo rechazar: "+(t||r.status)); return; }
          toast("Solicitud rechazada");
          await load();
        });
      });
      qs("#solRows").querySelectorAll("[data-pdf]").forEach(b => {
        const id = Number(b.dataset.pdf || 0);
        b.addEventListener("click", () => {
          window.open(`/rrhh/solicitudes/${id}/pdf`, "_blank");
        });
      });
    }

    qs("#solCrear").addEventListener("click", async () => {
      const payload = {
        colaborador: qs("#solColab").value,
        tipo: qs("#solTipo").value,
        fecha_inicio: qs("#solIni").value || null,
        fecha_fin: qs("#solFin").value || null,
        dias: Number(qs("#solDias").value || 0) || null,
        monto: Number(qs("#solMonto").value || 0) || null,
        motivo: qs("#solMotivo").value || "",
      };
      if (!payload.colaborador || !payload.tipo){ toast("Colaborador y tipo requeridos"); return; }
      const r = await fetch("/rrhh/solicitudes", { method:"POST", headers:{ "Content-Type":"application/json", ...headers() }, body: JSON.stringify(payload) });
      if (!r.ok){ const t = await r.text().catch(()=> ""); toast("No se pudo enviar: "+(t||r.status)); return; }
      toast("Solicitud enviada");
      qs("#solMotivo").value = "";
      qs("#solDias").value = "";
      qs("#solMonto").value = "";
      await load();
    });
    qs("#solReload").addEventListener("click", () => load());
    qs("#fEstado").addEventListener("change", () => load());
    load();
  </script>
</body>
</html>
