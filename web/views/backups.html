<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Puntos de restauración</title>
  <link rel="stylesheet" href="/web/styles.css?v=20260226-2" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{
      --bg: #07131F;
      --glass: rgba(2,6,23,.42);
      --glass2: rgba(2,6,23,.26);
      --border: rgba(148,163,184,.18);
      --muted2: rgba(226,232,240,.68);
      --good: rgba(25,195,125,.9);
      --warn: rgba(250,204,21,.95);
      --bad: rgba(239,68,68,.95);
    }
    html,body{height:100%;}
    body{
      margin:0;
      padding:14px;
      background:
        radial-gradient(1100px 700px at 20% 10%, rgba(25,195,125,.10), transparent 50%),
        radial-gradient(900px 700px at 90% 30%, rgba(59,130,246,.10), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--font, ui-sans-serif, system-ui);
      box-sizing:border-box;
    }
    .shell{
      height:calc(100vh - 28px);
      border:1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .top{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background: rgba(2,6,23,.30);
      backdrop-filter: blur(12px);
    }
    .tTitle{
      display:flex;
      align-items:baseline;
      gap:10px;
      min-width:0;
    }
    .tTitle h1{
      margin:0;
      font-size:16px;
      font-weight:1100;
      letter-spacing:.2px;
      white-space:nowrap;
    }
    .tTitle .sub{
      font-size:12px;
      color: var(--muted2);
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:52vw;
    }
    .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .btn{
      border:1px solid rgba(148,163,184,.22);
      background: rgba(2,6,23,.22);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 1100;
      cursor:pointer;
    }
    .btn:hover{ filter:brightness(1.06); }
    .btn.primary{
      background: color-mix(in srgb, var(--accent) 26%, transparent);
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .btn.danger{
      border-color: color-mix(in srgb, var(--bad) 55%, transparent);
      background: color-mix(in srgb, var(--bad) 10%, transparent);
      color: #fecaca;
    }
    .pill{
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.18);
      border-radius: 999px;
      padding: 7px 10px;
      font-weight: 1000;
      color: var(--muted2);
      font-size:12px;
      white-space:nowrap;
    }
    .grid{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns: 460px 1fr;
    }
    .jobStrip{
      display:none;
      padding:10px 16px;
      border-bottom:1px solid var(--border);
      background: rgba(2,6,23,.22);
      backdrop-filter: blur(10px);
    }
    .jobStrip.on{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .jobStage{ font-weight:1100; }
    .jobMeta{ font-size:12px; color: var(--muted2); font-weight:900; }
    .bar{
      flex:1;
      min-width: 260px;
      height:10px;
      border-radius: 999px;
      background: rgba(148,163,184,.16);
      overflow:hidden;
      border:1px solid rgba(148,163,184,.16);
    }
    .fill{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(25,195,125,.95), rgba(59,130,246,.90));
      border-radius: 999px;
      transition: width .35s ease;
    }
    .left,.right{min-height:0;}
    .left{
      border-right:1px solid var(--border);
      background: rgba(2,6,23,.22);
    }
    .leftHead{
      padding:12px 12px 10px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .leftHead .hint{
      font-size:12px;
      color: var(--muted2);
      font-weight:850;
    }
    .list{
      padding:8px;
      overflow:auto;
      height:100%;
      box-sizing:border-box;
    }
    /* Windows-ish restore point row */
    .rp{
      display:flex;
      gap:10px;
      padding:12px 12px;
      border-radius: 14px;
      border:1px solid transparent;
      cursor:pointer;
      align-items:flex-start;
    }
    .rp:hover{ background: rgba(255,255,255,.03); border-color: rgba(148,163,184,.14); }
    .rp.active{
      background: rgba(25,195,125,.10);
      border-color: rgba(25,195,125,.22);
    }
    .dot{
      width:11px;height:11px;border-radius:999px;
      margin-top:4px;
      background: rgba(148,163,184,.55);
      box-shadow: 0 0 0 4px rgba(148,163,184,.10);
      flex:0 0 auto;
    }
    .rp.active .dot{ background: rgba(25,195,125,.95); box-shadow: 0 0 0 4px rgba(25,195,125,.16); }
    .rpMain{min-width:0; flex:1;}
    .rpId{
      font-weight:1100;
      letter-spacing:.2px;
      margin-bottom:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .rpMeta{
      font-size:12px;
      color: var(--muted2);
      font-weight:850;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .rpType{
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.14);
      border-radius:999px;
      padding:2px 8px;
      font-size:11px;
      font-weight:1100;
      color: rgba(226,232,240,.82);
    }
    .rpSize{margin-left:auto; color: rgba(226,232,240,.78); font-weight:1000;}
    .right{
      padding:14px;
      overflow:auto;
      background:
        radial-gradient(900px 450px at 70% 0%, rgba(25,195,125,.10), transparent 58%),
        rgba(2,6,23,.16);
    }
    .card{
      border:1px solid var(--border);
      border-radius: 16px;
      background: rgba(2,6,23,.28);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      padding:14px;
    }
    .k{font-size:12px;color:var(--muted2);font-weight:900;}
    .v{font-weight:1100;}
    .rows{display:grid;grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;}
    .row{border:1px solid rgba(148,163,184,.14); background: rgba(2,6,23,.18); border-radius: 14px; padding:10px;}
    .row.full{grid-column: 1 / -1;}
    .warn{
      margin-top:12px;
      border:1px solid rgba(250,204,21,.25);
      background: rgba(250,204,21,.08);
      border-radius: 14px;
      padding:10px;
      color: rgba(254,249,195,.92);
      font-weight:900;
      font-size:12px;
      line-height:1.25;
    }
    .rightActions{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
    code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }
    .empty{
      color: var(--muted2);
      font-weight: 950;
      font-size: 13px;
      padding: 12px;
    }
    @media (max-width: 1040px){
      .grid{grid-template-columns: 1fr;}
      .left{border-right:none; border-bottom:1px solid var(--border);}
      .tTitle .sub{max-width:70vw;}
      .rows{grid-template-columns: 1fr;}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="tTitle">
        <h1>Puntos de restauración</h1>
        <div class="sub">Snapshot full: BD + <code>crm</code> + <code>public_html</code></div>
      </div>
      <div class="actions">
        <span class="pill" id="status">—</span>
        <button class="btn primary" id="btnRun" type="button">Crear punto</button>
        <button class="btn" id="btnReload" type="button">Recargar</button>
      </div>
    </header>
    <div class="jobStrip" id="jobStrip">
      <div>
        <div class="jobStage" id="jobStage">Creando backup…</div>
        <div class="jobMeta" id="jobMeta">Esto corre en segundo plano; puedes irte a otras vistas.</div>
      </div>
      <div class="bar" aria-hidden="true"><div class="fill" id="jobFill"></div></div>
      <div class="pill" id="jobPct">0%</div>
    </div>

    <section class="grid">
      <aside class="left">
        <div class="leftHead">
          <div class="hint">Selecciona un punto para ver detalles (estilo “Restaurar sistema”).</div>
        </div>
        <div class="list" id="list"></div>
      </aside>

      <main class="right">
        <div class="card" id="detail">
          <div class="empty">Selecciona un punto de restauración a la izquierda.</div>
        </div>
      </main>
    </section>
  </div>

  <script>
    const qs=(s,el=document)=>el.querySelector(s);
    function token(){ return localStorage.getItem("token") || localStorage.getItem("gd_token") || sessionStorage.getItem("token") || sessionStorage.getItem("gd_token") || ""; }
    function headers(extra={}){
      try{
        const GD = window.parent && window.parent.GD;
        if (GD && typeof GD.authHeaders === "function") return GD.authHeaders(extra);
      }catch(_){}
      const t=token();
      return t ? { ...extra, Authorization: "Bearer " + t } : extra;
    }
    const API_BASE = (() => {
      try{ const host = String(location.hostname||"").toLowerCase(); const isLocal = (host==="127.0.0.1" || host==="localhost"); return isLocal ? "" : "/crm"; }catch(_){ return ""; }
    })();
    function apiURL(u){
      const s = String(u||"");
      if (!s) return s;
      if (s.startsWith("/crm/")) return s;
      if (s.startsWith("/")) return API_BASE + s;
      return API_BASE + "/" + s;
    }
    function setStatus(t){ qs("#status").textContent = t || "—"; }
    function esc(s){ return String(s??"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    async function api(url, opt={}){
      const r = await fetch(apiURL(url), { ...opt, headers: headers(opt.headers||{}) });
      const ct = (r.headers.get("content-type")||"").toLowerCase();
      const txt = await r.text();
      let j=null;
      try{ j = txt ? JSON.parse(txt) : null; }catch(_){ j = { raw: txt, ct, status:r.status }; }
      if (!r.ok){
        const msg = j?.detail || j?.error || j?.raw || ("HTTP "+r.status);
        throw new Error(msg);
      }
      return j;
    }

    function fmtBytes(n){
      n = Number(n||0);
      if (!n) return "—";
      const u=["B","KB","MB","GB","TB"]; let i=0;
      while(n>=1024 && i<u.length-1){ n/=1024; i++; }
      return n.toFixed(i?1:0)+" "+u[i];
    }
    function fmtAt(s){
      const t = String(s||"");
      return t.replace("T"," ").slice(0,19);
    }

    let CACHE = [];
    let SELECTED = null;
    let JOB_ID = "";
    let jobTimer = null;

    function stageLabel(s){
      const k = String(s||"").toUpperCase();
      if (k === "QUEUED" || k === "PREP") return "Preparando…";
      if (k === "DB_DUMP") return "Respaldando base de datos…";
      if (k === "ARCHIVE") return "Empaquetando sistema (crm + public_html)…";
      if (k === "UPLOAD_DRIVE") return "Subiendo a Google Drive…";
      if (k === "PRUNE_LOCAL") return "Liberando espacio local…";
      if (k === "META") return "Finalizando…";
      if (k === "DONE") return "Backup listo";
      if (k === "ERROR") return "Error creando backup";
      return k || "—";
    }

    function setJobUI(on){
      const el = qs("#jobStrip");
      if (!el) return;
      el.classList.toggle("on", !!on);
      el.style.display = on ? "flex" : "none";
    }

    function renderJob(j){
      const job = j?.job || j || {};
      if (!job || !job.status) { setJobUI(false); return; }
      const running = (job.status === "running");
      const done = (job.status === "done");
      const err = (job.status === "error");
      setJobUI(running || done || err);

      const pct = Math.max(0, Math.min(100, Number(job.percent||0)));
      const fill = qs("#jobFill");
      if (fill) fill.style.width = `${pct}%`;
      qs("#jobPct").textContent = `${pct}%`;
      qs("#jobStage").textContent = stageLabel(job.stage);
      const since = job.started_at || job.created_at || "";
      const extra = job.label ? `· ${job.label}` : "";
      let meta = since ? `Desde ${fmtAt(since)}` : "—";
      if (extra) meta += " " + extra;
      if (err && job.error) meta = "Error: " + String(job.error).slice(0,160);
      qs("#jobMeta").textContent = meta;

      const btnRun = qs("#btnRun");
      if (btnRun){
        btnRun.disabled = running;
        btnRun.textContent = running ? "Creando…" : "Crear punto";
      }
    }

    async function pollJob(){
      if (!JOB_ID) return;
      try{
        const j = await api(`/backups/jobs/${JOB_ID}`);
        renderJob(j);
        const st = j?.job?.status;
        if (st === "done"){
          const bid = j?.job?.backup_id || JOB_ID;
          try{ localStorage.removeItem("gd_backup_job_id"); }catch(_){}
          JOB_ID = "";
          if (jobTimer){ clearInterval(jobTimer); jobTimer = null; }
          await load(true);
          SELECTED = CACHE.find(x => String(x.id||"") === String(bid)) || CACHE[0] || null;
          renderList(); renderDetail();
          Swal.fire("OK", "Backup creado.", "success");
          setJobUI(false);
        } else if (st === "error"){
          try{ localStorage.removeItem("gd_backup_job_id"); }catch(_){}
          JOB_ID = "";
          if (jobTimer){ clearInterval(jobTimer); jobTimer = null; }
          Swal.fire("Error", String(j?.job?.error || "No pude crear el backup."), "error");
        }
      }catch(e){
        // si el job desapareció, limpiamos
        setJobUI(false);
        if (jobTimer){ clearInterval(jobTimer); jobTimer = null; }
      }
    }

    function renderList(){
      const list = qs("#list");
      if (!CACHE.length){
        list.innerHTML = `<div class="empty">Sin backups aún.</div>`;
        return;
      }
      list.innerHTML = CACHE.map(it => {
        const id = it.id || "";
        const label = it.label || "";
        const by = it.created_by || "—";
        const at = fmtAt(it.created_at || "");
        const size = fmtBytes(it.size_bytes);
        const includes = (it.includes||[]).join(", ");
        const active = (SELECTED && SELECTED.id === id) ? "active" : "";
        return `
          <div class="rp ${active}" data-id="${esc(id)}" title="${esc(id)}">
            <div class="dot"></div>
            <div class="rpMain">
              <div class="rpId">${esc(label || id)}</div>
              <div class="rpMeta">
                <span class="rpType">Manual</span>
                <span>${esc(at)}</span>
                <span>· ${esc(by)}</span>
                <span class="rpSize">${esc(size)}</span>
              </div>
              <div class="rpMeta" style="margin-top:6px">
                <span>Incluye: ${esc(includes || "—")}</span>
              </div>
              ${label ? `<div class="rpMeta" style="margin-top:6px"><span style="opacity:.85">ID: ${esc(id)}</span></div>` : ``}
            </div>
          </div>
        `;
      }).join("");
      list.querySelectorAll("[data-id]").forEach(el=>{
        el.addEventListener("click", ()=>{
          const id = el.getAttribute("data-id");
          const it = CACHE.find(x => String(x.id||"") === String(id));
          if (!it) return;
          SELECTED = it;
          renderList();
          renderDetail();
        });
      });
    }

    function renderDetail(){
      const d = qs("#detail");
      if (!SELECTED){
        d.innerHTML = `<div class="empty">Selecciona un punto de restauración a la izquierda.</div>`;
        return;
      }
      const it = SELECTED;
      const id = it.id || "";
      const size = fmtBytes(it.size_bytes);
      const by = it.created_by || "—";
      const at = fmtAt(it.created_at || "");
      const includes = (it.includes||[]).join(", ") || "—";
      const drive = it.drive || null;
      const driveLink = drive && (drive.webViewLink || drive.webContentLink) ? (drive.webContentLink || drive.webViewLink) : "";
      const driveName = drive && (drive.name || drive.file_id) ? (drive.name || drive.file_id) : "";
      const inDrive = !!(drive && drive.file_id);
      const localOk = !!it.has_archive;

      const fileLine = localOk
        ? `<code>${esc(it.archive || "")}</code> <span class="muted">· local</span>`
        : (inDrive
          ? `<code>${esc(it.archive || (id + ".tar.gz"))}</code> <span class="muted">· en Drive</span>`
          : `<code>${esc(it.archive || "")}</code>`);

      d.innerHTML = `
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div>
            <div class="k">Punto seleccionado</div>
            <div class="v" style="font-size:18px;letter-spacing:.2px">${esc(id)}</div>
          </div>
          <div class="pill">Tamaño: ${esc(size)}</div>
        </div>

        <div class="rows">
          <div class="row"><div class="k">Creado</div><div class="v">${esc(at)}</div></div>
          <div class="row"><div class="k">Usuario</div><div class="v">${esc(by)}</div></div>
          <div class="row full"><div class="k">Incluye</div><div class="v">${esc(includes)}</div></div>
          <div class="row full"><div class="k">Archivo</div><div class="v">${fileLine}</div></div>
          ${
            inDrive ? `
              <div class="row full">
                <div class="k">Drive</div>
                <div class="v" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                  <span>${esc(driveName)}</span>
                  ${driveLink ? `<a class="btn" style="padding:6px 10px;border-radius:999px" href="${esc(driveLink)}" target="_blank" rel="noopener">Abrir en Drive</a>` : ``}
                </div>
              </div>
            ` : ``
          }
        </div>

        <div class="warn">
          Restaurar sobrescribe <b>archivos</b> y <b>base de datos completa</b>.<br>
          Para confirmar se te pedirá escribir: <code>RESTORE ${esc(id)}</code>
          <div style="margin-top:8px;opacity:.9">
            Tip: si está habilitado Drive, al crear un backup se sube a Drive y el sistema deja solo 1 archivo local para no llenar la cuota.
          </div>
        </div>

        <div class="rightActions">
          <button class="btn" id="btnDl">${localOk ? "Descargar" : (inDrive ? "Abrir Drive" : "Descargar")}</button>
          <button class="btn danger" id="btnDel">Eliminar</button>
          <button class="btn danger" id="btnRestore">Restaurar</button>
        </div>
      `;

      qs("#btnDl").onclick = ()=>{
        if (localOk) return window.open(apiURL(`/backups/${id}/download`), "_blank", "noopener");
        if (inDrive && driveLink) return window.open(driveLink, "_blank", "noopener");
        // fallback: intenta igual
        return window.open(apiURL(`/backups/${id}/download`), "_blank", "noopener");
      };
      qs("#btnDel").onclick = async ()=>{
        const res = await Swal.fire({ title:"Eliminar punto", text:`¿Eliminar ${id}?`, icon:"warning", showCancelButton:true, confirmButtonText:"Eliminar", cancelButtonText:"Cancelar" });
        if (!res.isConfirmed) return;
        await api(`/backups/${id}`, { method:"DELETE" });
        await load(true);
      };
      qs("#btnRestore").onclick = async ()=>{
        const res = await Swal.fire({
          title:"Restaurar sistema",
          html:`<div style="text-align:left;display:grid;gap:8px">
            <div class="muted">Esto sobrescribe archivos y BD. Solo úsalo como “restaurar sistema”.</div>
            <div>Escribe exactamente: <b>RESTORE ${esc(id)}</b></div>
            <input id="conf" class="swal2-input" placeholder="RESTORE ${esc(id)}" />
          </div>`,
          icon:"warning",
          showCancelButton:true,
          confirmButtonText:"Restaurar",
          cancelButtonText:"Cancelar",
          preConfirm:()=>{
            const v = (qs("#conf")?.value||"").trim();
            if (v !== `RESTORE ${id}`) return Swal.showValidationMessage("Confirmación inválida.");
            return v;
          }
        });
        if (!res.isConfirmed) return;
        setStatus("Restaurando… (puede tardar)");
        await api(`/backups/${id}/restore`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ confirm: `RESTORE ${id}` }) });
        await Swal.fire("OK", "Restauración ejecutada. Recarga el CRM.", "success");
        setStatus("Listo");
      };
    }

    async function load(keepSelected=false){
      setStatus("Cargando…");
      const data = await api("/backups");
      CACHE = (data.items || []);
      setStatus(`Listo · ${CACHE.length} backups`);
      if (!keepSelected){
        SELECTED = CACHE[0] || null;
      }else if (SELECTED){
        SELECTED = CACHE.find(x => String(x.id||"") === String(SELECTED.id||"")) || CACHE[0] || null;
      }
      renderList();
      renderDetail();
    }

    qs("#btnReload").onclick = ()=> load(true);
    qs("#btnRun").onclick = async ()=>{
      const res = await Swal.fire({
        title:"Crear punto de restauración",
        html:`<div style="text-align:left;display:grid;gap:10px">
          <div class="muted">Ejemplo: <b>Antes de cambios de Cotizaciones</b></div>
          <input id="lbl" class="swal2-input" placeholder="Descripción (opcional)" />
          <div class="muted">Esto puede tardar 30–180s.</div>
        </div>`,
        icon:"question",
        showCancelButton:true,
        confirmButtonText:"Crear",
        cancelButtonText:"Cancelar",
        preConfirm:()=> (qs("#lbl")?.value||"").trim()
      });
      if (!res.isConfirmed) return;
      setStatus("Creando…");
      try{
        const out = await api("/backups/run_async", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ label: res.value || "" }) });
        JOB_ID = String(out.job_id || out.backup_id || "");
        if (JOB_ID){
          try{ localStorage.setItem("gd_backup_job_id", JOB_ID); }catch(_){}
          renderJob({ job: { status:"running", stage:"QUEUED", percent: 0, job_id: JOB_ID, created_at: new Date().toISOString().slice(0,19) }});
          await pollJob();
          if (!jobTimer) jobTimer = setInterval(pollJob, 2500);
        } else {
          Swal.fire("OK", "Backup solicitado.", "success");
        }
      }catch(e){
        Swal.fire("Error", String(e?.message||e), "error");
        setStatus("Error");
      }
    };

    // Restore selection by query param (?select=ID)
    const URL_SELECT = (()=>{ try{ return new URLSearchParams(location.search).get("select") || ""; }catch(_){ return ""; } })();

    (async ()=>{
      await load(false).catch(e=>setStatus(String(e?.message||e)));
      if (URL_SELECT){
        SELECTED = CACHE.find(x => String(x.id||"") === String(URL_SELECT)) || SELECTED;
        renderList(); renderDetail();
      }
      try{ JOB_ID = localStorage.getItem("gd_backup_job_id") || ""; }catch(_){ JOB_ID = ""; }
      if (JOB_ID){
        await pollJob();
        if (!jobTimer) jobTimer = setInterval(pollJob, 2500);
      }
    })();
  </script>
</body>
</html>
