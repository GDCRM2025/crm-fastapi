<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>RRHH · SGJO · Marcación</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../js/iframe-theme.js"></script>
  <style>
    body{margin:0;padding:14px;background:transparent;color:var(--text);}
    .wrap{max-width:780px;margin:0 auto;}
    .card{
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.32);
      border-radius:18px;
      padding:14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 22px 70px rgba(0,0,0,.18);
    }
    :root.light .card{ background: rgba(255,255,255,.86); border-color: rgba(0,0,0,.10); }
    .ttl{font-weight:1100; letter-spacing:.12em; text-transform:uppercase; font-size:12px;}
    .big{font-size:22px;font-weight:1200;margin-top:6px;}
    .muted{opacity:.75;font-weight:850;font-size:12px;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.18);
      font-weight:1000;font-size:12px;
    }
    .btn{
      height:42px;border-radius:14px;
      border:1px solid rgba(148,163,184,.22);
      background: rgba(2,6,23,.18);
      color:inherit;
      padding:0 14px;
      font-weight:1100;
      cursor:pointer;
      flex:1;
      min-width:220px;
    }
    .btn.primary{background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .sel{
      height:42px;border-radius:14px;
      border:1px solid rgba(148,163,184,.22);
      background: rgba(2,6,23,.18);
      color:inherit;
      padding:0 12px;
      font-weight:1100;
      flex:1;
      min-width:220px;
      outline:none;
    }
    pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.35;margin:10px 0 0 0;opacity:.85}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="ttl">RRHH · SGJO</div>
      <div class="big">Marcación</div>
      <div class="muted">QR fijo + geolocalización + dispositivo enrolado + hora servidor.</div>

      <div class="row">
        <span class="pill" id="pSede">Sede: —</span>
        <span class="pill" id="pPunto">Punto: —</span>
        <span class="pill" id="pModo">Modo: —</span>
        <span class="pill" id="pPolicy">Método: —</span>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="btnEnroll" type="button">Enrolar dispositivo</button>
        <button class="btn" id="btnLogin" type="button">Iniciar sesión</button>
      </div>
      <div class="row" style="margin-top:8px">
        <select class="sel" id="selMethod" title="Método de marcación">
          <option value="QR">QR</option>
          <option value="GEO">GPS</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="btnMark" type="button" disabled>Marcar</button>
      </div>

      <pre id="log">—</pre>
    </div>
  </div>

  <script>
    const API_BASE = (()=> {
      try{
        const h = String(location.hostname||"").toLowerCase();
        const isLocal = (h==="localhost" || h==="127.0.0.1");
        if (isLocal) return "";
        const p = String(location.pathname||"");
        return (p.startsWith("/crm/") || p === "/crm") ? "/crm" : "";
      }catch(_){ return ""; }
    })();
    const qs = (s, el=document)=> el.querySelector(s);
    // Mostrar errores JS en pantalla (Safari/iOS a veces “silencia” y parece que botones no funcionan).
    try{
      window.addEventListener("error", (ev)=>{
        try{
          const msg = (ev && ev.message) ? ev.message : "Error";
          const file = (ev && ev.filename) ? ("\n" + ev.filename + ":" + (ev.lineno || "")) : "";
          log("Error JS: " + msg + file);
        }catch(_){}
      });
      window.addEventListener("unhandledrejection", (ev)=>{
        try{
          const r = ev ? ev.reason : null;
          const msg = (r && r.message) ? r.message : (r != null ? String(r) : "Error");
          log("Promise error: " + msg);
        }catch(_){}
      });
    }catch(_){}

    function getCookie(name){
      try{
        const m = String(document.cookie||"").match(new RegExp("(^|;\\s*)"+name.replace(/[-[\\]{}()*+?.,\\\\^$|#\\s]/g,"\\\\$&")+"=([^;]*)"));
        return m ? decodeURIComponent(m[2] || "") : "";
      }catch(_){ return ""; }
    }

    function getToken(){
      return (
        localStorage.getItem("token") ||
        localStorage.getItem("gd_token") ||
        sessionStorage.getItem("token") ||
        sessionStorage.getItem("gd_token") ||
        ""
      );
    }

    function goLogin(punto_code){
      try{
        // Si falta punto_code, volvemos a esta misma URL completa.
        const next = punto_code
          ? `${API_BASE}/web/views/rrhh_sgjo_marcacion.html?p=${encodeURIComponent(punto_code)}`
          : (location.pathname + location.search);
        location.href = `${API_BASE}/web/login.html?next=${encodeURIComponent(next)}`;
      }catch(_){}
    }

    function ensureToken(punto_code){
      const t = getToken();
      if (t) return true;
      // Intentar tomar token desde cookie (login.html siempre la setea como gd_token).
      const ck = getCookie("gd_token");
      if (ck){
        try{
          localStorage.setItem("token", ck);
          localStorage.setItem("gd_token", ck);
        }catch(_){}
        return true;
      }
      log("Debes iniciar sesión para marcar/enrolar. Toca “Iniciar sesión”.");
      return false;
    }
    function authHeaders(extra={}){
      const t = getToken();
      return t ? { ...extra, Authorization: "Bearer " + t } : extra;
    }
    function apiURL(path){
      if (String(path||"").startsWith("http")) return path;
      const p = String(path||"");
      return `${API_BASE}${p.startsWith("/") ? "" : "/"}${p}`;
    }
    async function apiJSON(path, opt={}){
      const r = await fetch(apiURL(path), { ...opt, headers: authHeaders(opt.headers||{}) });
      const txt = await r.text();
      let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(_){}
      if (!r.ok){
        const msg = (j && (j.detail||j.error||j.message)) ? (j.detail||j.error||j.message) : (txt || ("HTTP "+r.status));
        throw new Error(msg);
      }
      return j;
    }

    function log(s){
      qs("#log").textContent = String(s||"").trim() || "—";
    }

    function getDeviceId(){
      let id = localStorage.getItem("sgjo_device_id") || "";
      if (!id){
        // Evitar syntax/features que rompen en Safari viejo (optional chaining).
        try{
          if (window.crypto && typeof window.crypto.randomUUID === "function"){
            id = window.crypto.randomUUID();
          } else {
            id = "dev-" + Math.random().toString(16).slice(2) + Date.now();
          }
        }catch(_){
          id = "dev-" + Math.random().toString(16).slice(2) + Date.now();
        }
        localStorage.setItem("sgjo_device_id", id);
      }
      return id;
    }

    function getPuntoCode(){
      const u = new URL(location.href);
      const p = (u.searchParams.get("p") || u.searchParams.get("punto") || "").trim().toUpperCase();
      return p;
    }

    async function getLocation(){
      if (!navigator.geolocation) throw new Error("Geolocalización no disponible.");
      return await new Promise((resolve, reject)=>{
        navigator.geolocation.getCurrentPosition(
          (pos)=>{
            resolve({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy_m: pos.coords.accuracy
            });
          },
          (err)=> {
            try{
              reject(new Error((err && err.message) ? err.message : "No pude obtener ubicación."));
            }catch(_){
              reject(new Error("No pude obtener ubicación."));
            }
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    }

    async function init(){
      const punto_code = getPuntoCode();
      if (!punto_code){
        log("Falta parámetro ?p=… (debes entrar desde el QR). Puedes iniciar sesión igual y luego reintentar desde el QR.");
        return;
      }
      if (!ensureToken(punto_code)) return;
      try{
        const cfg = await apiJSON("/rrhh/sgjo/config");
        const pt = (cfg.puntos||[]).find(x=>String(x.code||"").toUpperCase()===punto_code);
        if (!pt){
          log("Punto no existe: " + punto_code);
          return;
        }
        const sede = (cfg.sedes||[]).find(s=>String(s.id_sede)==String(pt.id_sede));
        qs("#pSede").textContent = "Sede: " + ((sede && sede.nombre) ? sede.nombre : "—");
        qs("#pPunto").textContent = "Punto: " + ((pt && pt.nombre) ? pt.nombre : punto_code);
        const me = await apiJSON("/rrhh/sgjo/me");
        qs("#pModo").textContent = "Modo: " + String((me && me.modality_today) ? me.modality_today : "—");
        const pol = String((me && me.marcacion_method) ? me.marcacion_method : "BOTH").toUpperCase();
        const can = (me && me.puede_marcar === false) ? "NO" : "SÍ";
        qs("#pPolicy").textContent = `Método: ${pol} · Puede marcar: ${can}`;
        if (!(me && me.rut)){
          log("Tu usuario no tiene RUT en el sistema. Enrola el dispositivo y pide a RRHH/Admin que registre tu RUT para poder marcar.");
        }
        // Ajustar selector según política RRHH (si existe)
        try{
          const sel = qs("#selMethod");
          if (sel){
            if (pol === "QR"){
              sel.value = "QR";
              sel.disabled = true;
            } else if (pol === "GPS" || pol === "GEO"){
              sel.value = "GEO";
              sel.disabled = true;
            } else {
              sel.disabled = false;
            }
          }
        }catch(_){}
        qs("#btnMark").disabled = (me && me.puede_marcar === false);
        if (me && me.puede_marcar === false){
          log("No tienes permiso RRHH para marcar (puede_marcar=false). Contacta a RRHH.");
        } else {
          log("Listo. Enrola el dispositivo la primera vez, luego marca (QR o GPS según tu permiso RRHH).");
        }
      }catch(e){
        log("Error: " + ((e && e.message) ? e.message : e));
      }
    }

    qs("#btnLogin").addEventListener("click", ()=>{
      const punto_code = getPuntoCode();
      goLogin(punto_code || "");
    });

    qs("#btnEnroll").addEventListener("click", async ()=>{
      try{
        const punto_code = getPuntoCode();
        if (!ensureToken(punto_code)) return;
        const device_id = getDeviceId();
        // Si falta RUT/teléfono, lo pedimos como "hint" para que RRHH/Admin lo vea al aprobar.
        let rut_hint = "";
        let tel_hint = "";
        try{
          const me = await apiJSON("/rrhh/sgjo/me");
          rut_hint = String((me && me.rut) ? me.rut : "").trim();
          tel_hint = String((me && me.telefono_rrhh) ? me.telefono_rrhh : "").trim();
        }catch(_){}
        if (!rut_hint){
          rut_hint = String(prompt("Ingresa tu RUT (sin puntos, con guion si corresponde):") || "").trim();
        }
        if (!tel_hint){
          tel_hint = String(prompt("Ingresa tu teléfono (ej: +56912345678):") || "").trim();
        }
        const out = await apiJSON("/rrhh/sgjo/device/enroll", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ device_id, rut: rut_hint, telefono: tel_hint }),
        });
        if (out && out.ok){
          log("Dispositivo enrolado OK.");
        } else if (out && out.pending_approval){
          const rid = out.id_request ? `\nID solicitud: ${out.id_request}` : "";
          log("Solicitud enviada. Un admin debe aprobar este dispositivo (RRHH)." + rid + "\nLuego vuelve a intentar marcar.");
        } else {
          log("Solicitud enviada. Espera aprobación y recarga.");
        }
      }catch(e){
        log("No pude enrolar: " + ((e && e.message) ? e.message : e));
      }
    });

    qs("#btnMark").addEventListener("click", async ()=>{
      const punto_code = getPuntoCode();
      try{
        if (!ensureToken(punto_code)) return;
        qs("#btnMark").disabled = true;
        const device_id = getDeviceId();
        const loc = await getLocation();
        const sel = qs("#selMethod");
        const method = String((sel && sel.value) ? sel.value : "QR").toUpperCase();
        const out = await apiJSON("/rrhh/sgjo/marcar", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ punto_code, device_id, method, ...loc }),
        });
        const dist = (out && out.distance_m != null) ? (Number(out.distance_m).toFixed(1) + "m") : "—";
        log(`OK · ${(out && out.tipo) ? out.tipo : "—"} · ${(out && out.sede) ? out.sede : "—"}\nDistancia: ${dist}\nFallback: ${(out && out.used_fallback) ? "sí" : "no"}\nModo: ${(out && out.modality) ? out.modality : "—"}`);
      }catch(e){
        log("Error: " + ((e && e.message) ? e.message : e));
      }finally{
        qs("#btnMark").disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
