<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Operaciones · Carritos / Maquinaria</title>
  <link rel="stylesheet" href="../styles.css?v=20260302-2" />
  <script src="../js/iframe-theme.js"></script>
  <style>
    :root{
      --bg:#07131F;
      --border: rgba(148,163,184,.18);
      --text:#EAF2FF;
      --muted: rgba(226,232,240,.72);
    }
    html,body{height:100%;}
    body{
      margin:0;
      padding:10px;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(25,195,125,.10), transparent 55%),
        radial-gradient(900px 650px at 90% 20%, rgba(59,130,246,.10), transparent 60%),
        var(--bg);
      color: var(--text);
      box-sizing:border-box;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .shell{
      height:calc(100vh - 20px);
      border:1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .top{
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      background: rgba(2,6,23,.30);
      backdrop-filter: blur(12px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .title{ font-weight:1100; letter-spacing:.2px; }
    .muted{ color: var(--muted); font-weight:850; font-size:12px; }
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
    .tab{
      border:1px solid rgba(148,163,184,.22);
      background: rgba(2,6,23,.22);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 1100;
      cursor:pointer;
      white-space:nowrap;
    }
    .tab.active{
      border-color: rgba(25,195,125,.55);
      box-shadow: 0 0 0 3px rgba(25,195,125,.10);
    }
    .main{ flex:1; min-height:0; background: rgba(2,6,23,.18); }
    iframe{ width:100%; height:100%; border:0; display:block; background:#0b1220; }
    @media (max-width: 720px){
      body{ padding:8px; }
      .top{ flex-direction:column; align-items:stretch; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div>
        <div class="title">Operaciones · Carritos / Maquinaria</div>
        <div class="muted">Administra activos por unidad, ficha médica y asignación a eventos (lead).</div>
      </div>
      <div class="tabs">
        <button class="tab active" data-focus="carritos" type="button">Carritos</button>
        <button class="tab" data-focus="maquinaria" type="button">Maquinaria</button>
        <button class="tab" data-focus="camiones" type="button">Camiones</button>
      </div>
    </div>
    <div class="main">
      <iframe id="frame" src="/web/views/assets.html?focus=carritos" title="Activos"></iframe>
    </div>
  </div>

  <script>
    const frame = document.getElementById("frame");
    for (const b of document.querySelectorAll(".tab")){
      b.addEventListener("click", ()=>{
        for (const x of document.querySelectorAll(".tab")) x.classList.remove("active");
        b.classList.add("active");
        const focus = b.getAttribute("data-focus") || "";
        frame.src = "/web/views/assets.html?focus=" + encodeURIComponent(focus) + "&v=" + Date.now();
      });
    }

    // Forward theme/prefs from parent (panel) to the nested iframe (assets.html)
    window.addEventListener("message", (ev) => {
      const d = ev.data || {};
      if (!d) return;
      if (d.type === "theme" || d.type === "prefs" || d.cmd === "apply-theme"){
        try{ frame?.contentWindow?.postMessage(d, "*"); }catch(_){}
      }
    });
  </script>
</body>
</html>
