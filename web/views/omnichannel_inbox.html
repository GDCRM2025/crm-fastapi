<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/web/styles.css"><link rel="stylesheet" href="/web/ui_overrides.css"><title>Inbox omnicanal — Green Diamond</title>
<style>:root{color-scheme:dark;--line:#24465f;--card:#0c263a;--muted:#9db1c1;--green:#39d98a}*{box-sizing:border-box}body{margin:0;padding:20px;background:#071827;color:#eef7fc;font:14px/1.45 system-ui}.wrap{max-width:1500px;margin:auto}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{color:#87ddb3;font-size:11px;font-weight:900;letter-spacing:.12em}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.metric{font-size:26px;font-weight:950}.btn{border:1px solid #37647f;background:#11334b;color:#fff;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.btn.primary{background:#176b4d;border-color:var(--green)}.btn:disabled{opacity:.5}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{border:1px solid #375b74;border-radius:999px;background:transparent;color:#c4d5e1;padding:8px 12px;font-weight:800;cursor:pointer}.chip.active{background:#164a65;color:#fff;border-color:#5ba1c8}.inbox{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);gap:14px}.item{border-bottom:1px solid rgba(255,255,255,.09);padding:13px 4px}.pill{display:inline-flex;border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900}.ok{color:#86efac}.warn{color:#fcd34d}.off{color:#aab7c1}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}dialog{width:min(600px,calc(100vw - 24px));background:#0b2235;color:#fff;border:1px solid #3a6480;border-radius:16px;padding:20px}dialog::backdrop{background:rgba(0,0,0,.7)}label{display:block;margin:10px 0;font-weight:750}input,select{display:block;width:100%;margin-top:5px;padding:10px;background:#071827;color:#fff;border:1px solid #37647f;border-radius:9px}@media(max-width:850px){.inbox{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><header class="head"><div><div class="eyebrow">TOOLS · OMNICANAL</div><h1 style="margin:5px 0">Inbox unificada</h1><div class="muted">WhatsApp, Instagram, Messenger y Email en una sola vista, reutilizando las conversaciones originales.</div></div><button id="reload" class="btn primary">Actualizar</button></header><div id="notice"></div>
<section id="analytics" class="cards"></section><nav id="filters" class="filters"><button class="chip active" data-channel="">Todos</button><button class="chip" data-channel="WHATSAPP">WhatsApp</button><button class="chip" data-channel="INSTAGRAM">Instagram</button><button class="chip" data-channel="MESSENGER">Messenger</button><button class="chip" data-channel="EMAIL">Email</button></nav>
<div class="inbox"><section class="card"><div class="row"><div><h2 style="margin:0">Conversaciones</h2><div class="muted">Se muestran únicamente canales y marcas autorizados para tu rol.</div></div><span id="total" class="pill off">0</span></div><div id="items"></div></section><aside class="card"><h2>Capacidades por canal</h2><div id="capabilities"></div></aside></div>
<dialog id="workDialog"><div class="row"><div><div class="eyebrow">GESTIÓN COMERCIAL</div><h3 id="workTitle">Vincular conversación</h3></div><button class="btn" data-close>Cerrar</button></div><form id="workForm"><input name="channel" type="hidden"><input name="source_ref" type="hidden"><label>Lead ID (opcional)<input name="lead_id" inputmode="numeric" min="1"></label><label>Cotización ID (requiere lead)<input name="quote_id" inputmode="numeric" min="1"></label><label>Asignar a<input name="assigned_user_name" maxlength="180"></label><label>Seguimiento<input name="follow_up_at" type="datetime-local"></label><label>Estado<select name="status"><option>OPEN</option><option>PENDING</option><option>RESOLVED</option></select></label><button class="btn primary">Guardar gestión</button></form></dialog>
</main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const API_BASE=location.pathname.startsWith('/crm/')?'/crm':'';const url=p=>API_BASE+p;const headers=()=>{const GD=window.parent&&window.parent.GD;if(GD&&GD.authHeaders)return {'Content-Type':'application/json',...GD.authHeaders()};const t=localStorage.getItem('token')||sessionStorage.getItem('token')||'';return {'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selectedChannel='',items=[],caps=[];
async function api(path,opts={}){const r=await fetch(url(path),{...opts,headers:{...headers(),...(opts.headers||{})}}),j=await r.json().catch(()=>null);if(!r.ok)throw new Error(typeof j?.detail==='string'?j.detail:'No pudimos completar la acción.');return j}const openRoute=route=>route&&window.parent?.postMessage({type:'openItem',id:'omnichannel_action',url:route},'*');
function renderCaps(){capabilities.innerHTML=caps.map(c=>`<article class="item"><div class="row"><strong>${esc(c.channel)}</strong><span class="pill ${c.state==='AVAILABLE'?'ok':'warn'}">${esc(c.state==='AVAILABLE'?'Disponible':'Sólo recepción')}</span></div><div class="muted">${esc(c.explanation)}</div><div style="margin-top:7px">${[['Responder',c.reply],['Crear lead',c.create_lead],['Vincular',c.link_lead],['Cotizar',c.quote]].map(x=>`<span class="pill ${x[1]?'ok':'off'}" style="margin:2px">${esc(x[0])}</span>`).join('')}</div></article>`).join('')}
function renderItems(){const visible=selectedChannel?items.filter(x=>x.channel===selectedChannel):items;total.textContent=visible.length;$('#items').innerHTML=visible.length?visible.map(x=>`<article class="item"><div class="row"><div><span class="pill ${x.unread_count?'warn':'off'}">${esc(x.channel)}</span> <strong>${esc(x.contact_name||'Contacto')}</strong><div class="muted">${esc(x.preview||'Sin vista previa')}</div></div><div class="muted">${x.unread_count?`${x.unread_count} pendiente(s)`:esc(x.status)}</div></div><div class="row" style="margin-top:9px"><div class="muted">${x.lead_id?`Lead #${esc(x.lead_id)}`:'Sin lead vinculado'}${x.assigned_to?` · ${esc(x.assigned_to)}`:''}</div><div>${x.action_route&&x.capabilities.reply?`<button class="btn primary" data-open="${esc(x.action_route)}">RESPONDER</button>`:''}<button class="btn" data-manage="${esc(x.channel)}" data-ref="${esc(x.source_ref)}">GESTIONAR</button></div></div></article>`).join(''):`<div class="empty">No hay conversaciones reales para este filtro.</div>`;$$('[data-open]').forEach(b=>b.onclick=()=>openRoute(b.dataset.open));$$('[data-manage]').forEach(b=>b.onclick=()=>openWork(b.dataset.manage,b.dataset.ref))}
function renderAnalytics(rows){$('#analytics').innerHTML=rows.map(x=>`<article class="card"><div class="row"><strong>${esc(x.channel)}</strong><span class="pill ${x.data_state==='AVAILABLE'?'ok':'off'}">${esc(x.data_state==='AVAILABLE'?'Con datos':'Sin datos')}</span></div><div class="cards" style="margin-top:10px"><div><div class="muted">Conversaciones</div><div class="metric">${Number(x.conversations||0)}</div></div><div><div class="muted">Leads</div><div class="metric">${Number(x.leads||0)}</div></div><div><div class="muted">Cotizaciones</div><div class="metric">${Number(x.quotes||0)}</div></div><div><div class="muted">Ventas</div><div class="metric">${Number(x.sales||0)}</div></div></div><div class="muted">Revenue: ${Number(x.revenue||0).toLocaleString('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0})}</div></article>`).join('')}
function openWork(channel,ref){const item=items.find(x=>x.channel===channel&&x.source_ref===ref),f=$('#workForm');f.reset();f.channel.value=channel;f.source_ref.value=ref;f.lead_id.value=item?.lead_id||'';f.quote_id.value=item?.quote_id||'';f.assigned_user_name.value=item?.assigned_to||'';f.status.value=item?.status||'OPEN';$('#workTitle').textContent=`Gestionar · ${channel}`;$('#workDialog').showModal()}
async function load(){try{$('#notice').innerHTML='';const [c,i,a]=await Promise.all([api('/api/omnichannel/capabilities'),api('/api/omnichannel/inbox?limit=200'),api('/api/omnichannel/analytics?limit=200')]);caps=c.items||[];items=i.items||[];renderCaps();renderItems();renderAnalytics(a.items||[])}catch(e){$('#notice').innerHTML=`<div class="card"><span class="pill warn">Requiere atención</span> ${esc(e.message)}</div>`}}
$('#workForm').onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget,body={status:f.status.value,lead_id:f.lead_id.value?Number(f.lead_id.value):null,quote_id:f.quote_id.value?Number(f.quote_id.value):null,assigned_user_id:null,assigned_user_name:f.assigned_user_name.value.trim()||null,follow_up_at:f.follow_up_at.value?new Date(f.follow_up_at.value).toISOString():null};try{await api(`/api/omnichannel/items/${encodeURIComponent(f.channel.value)}/${encodeURIComponent(f.source_ref.value)}`,{method:'PATCH',body:JSON.stringify(body)});$('#workDialog').close();await load()}catch(e){$('#notice').innerHTML=`<div class="card"><span class="pill warn">No guardado</span> ${esc(e.message)}</div>`}};$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$$('[data-channel]').forEach(b=>b.onclick=()=>{$$('[data-channel]').forEach(x=>x.classList.toggle('active',x===b));selectedChannel=b.dataset.channel;renderItems()});$('#reload').onclick=load;load();
</script></body></html>
