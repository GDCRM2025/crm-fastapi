<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tools</title>
  <link rel="icon" href="/web/pwa/gd-128.png" />
  <link rel="stylesheet" href="/web/styles.css" />
  <style>
    /* Tools fijo estilo Gmail (NO sigue toggle día/noche del CRM) */
    :root{
      color-scheme: light;
      --bg:#f6f8fc;
      --card:#ffffff;
      --bd:rgba(15,23,42,.12);
      --muted:rgba(15,23,42,.62);
      --shadow:0 18px 44px rgba(15,23,42,.10);
      --shadow2:0 24px 64px rgba(15,23,42,.12);
    }
    html,body{height:100%;}
    body{ margin:0; background:var(--bg); color:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji"; }

    .layout{
      height:100%;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:12px;
      padding:14px;
    }
    .topbar{
      border:1px solid var(--bd);
      border-radius:18px;
      background: var(--card);
      box-shadow: var(--shadow);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .topLeft{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 240px;
    }
    .menuBtn{
      border:1px solid rgba(148,163,184,.18);
      background:#fff;
      color:inherit;
      border-radius:14px;
      padding:10px 12px;
      font-weight:1000;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:10px;
      white-space:nowrap;
    }
    .menuBtn:hover{ background:rgba(15,23,42,.03); }
    .crumb{
      display:flex;
      flex-direction:column;
      gap:2px;
      line-height:1.1;
    }
    .crumb .t{ font-size:14px; font-weight:1100; letter-spacing:.02em; }
    .crumb .s{ font-size:12px; color:var(--muted); font-weight:900; }
    .topRight{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .chipBtn{
      border:1px solid rgba(148,163,184,.18);
      background:#fff;
      color:inherit;
      border-radius:999px;
      padding:8px 12px;
      font-weight:950;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }
    .chipBtn:hover{ background:rgba(15,23,42,.03); }
    .chipBtn.active{ border-color: color-mix(in srgb, var(--accent,#19c37d) 45%, transparent); background: color-mix(in srgb, var(--accent,#19c37d) 14%, transparent); }
    .ico{ width:22px; height:22px; border-radius:9px; display:grid; place-items:center; background:rgba(15,23,42,.04); border:1px solid rgba(148,163,184,.18); font-size:13px; }

    .main{
      border:1px solid var(--bd);
      border-radius:18px;
      overflow:hidden;
      background: var(--card);
      box-shadow: var(--shadow2);
      min-height:0;
      flex:1;
    }
    iframe{ width:100%; height:100%; border:0; background:transparent; }

    .drawer{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.25);
      backdrop-filter: blur(3px);
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:18px;
      z-index: 9999;
    }
    .drawer.show{ display:flex; }
    .drawerCard{
      width:min(720px, calc(100vw - 24px));
      border:1px solid rgba(148,163,184,.18);
      background: var(--card);
      border-radius:18px;
      box-shadow: var(--shadow2);
      padding:12px;
      color:inherit;
    }
    .drawerHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:6px 6px 10px;
      border-bottom:1px solid rgba(148,163,184,.14);
      margin-bottom:10px;
    }
    .drawerHead .h{ font-weight:1100; font-size:14px; }
    .drawerGrid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:10px;
      padding:6px;
    }
    .drawerGrid button{
      width:100%;
      border:1px solid rgba(148,163,184,.18);
      background:#fff;
      color:inherit;
      border-radius:16px;
      padding:12px 12px;
      font-weight:1000;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      text-align:left;
    }
    .drawerGrid button:hover{ background:rgba(15,23,42,.03); }
    .drawerGrid button.active{ border-color: color-mix(in srgb, var(--accent,#19c37d) 45%, transparent); background: color-mix(in srgb, var(--accent,#19c37d) 16%, transparent); }
    @media (max-width: 720px){
      .drawerGrid{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topLeft">
        <button class="menuBtn" id="btnMenu" type="button" title="Abrir herramientas">
          <span class="ico">🧰</span>
          Tools
        </button>
        <div class="crumb">
          <div class="t" id="activeToolTitle">Correo (GIA)</div>
          <div class="s">Menú arriba · módulo a pantalla completa</div>
        </div>
      </div>
      <div class="topRight" id="quickNav"></div>
    </header>

    <section class="main">
      <iframe id="toolFrame" title="Tools"></iframe>
    </section>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawerCard" role="dialog" aria-modal="true" aria-label="Tools">
      <div class="drawerHead">
        <div class="h">Herramientas</div>
        <button class="chipBtn" id="btnCloseDrawer" type="button" title="Cerrar">Cerrar</button>
      </div>
      <div class="drawerGrid" id="drawerNav"></div>
    </div>
  </div>

  <script>
    (() => {
      const qs = (s, el=document) => el.querySelector(s);
      const fr = () => qs("#toolFrame");

      const API_BASE = (() => {
        try{
          const h = String(location.hostname || "").toLowerCase();
          const isLocal = (h === "localhost" || h === "127.0.0.1");
          return isLocal ? "" : "/crm";
        }catch(_){
          return "";
        }
      })();

      // Fijo claro: Tools no sigue el toggle día/noche del CRM.
      let lastThemeMode = "light";
      let lastPrefs = null;

      function postToTool(msg){
        try{
          const w = fr().contentWindow;
          if (!w) return;
          w.postMessage(msg, "*");
        }catch(_){}
      }

      function applyThemeBootstrap(){
        document.documentElement.classList.add("light");
        window.addEventListener("message", (ev) => {
          // Ignora theme del padre: Tools siempre claro.
          if (ev.data?.type === "prefs"){
            const p = ev.data.prefs || {};
            lastPrefs = p;
            if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
            if (p.text) document.documentElement.style.setProperty("--text", p.text);
            if (p.font) document.documentElement.style.setProperty("--font", p.font);
            postToTool({ type:"prefs", prefs:p });
          }
          if (ev.data?.type === "toast" && ev.data?.text){
            // el panel principal ya tiene su propia toast; acá no duplicamos.
            // lo dejamos para compat.
          }
        });
      }

      function getParentMe(){
        try{
          return (window.parent && window.parent.GD && window.parent.GD.me) ? window.parent.GD.me : {};
        }catch(_){
          return {};
        }
      }

      function isAdmin(){
        const me = getParentMe();
        const role = String(me.role || me.rol || "").toUpperCase();
        return role === "ADMIN" || role === "SUPERADMIN";
      }
      function canSeeGIA(){
        const me = getParentMe();
        const role = String(me.role || me.rol || "").toUpperCase();
        // Solo Admin (1) y Ejecutivos (2). MICE NO.
        return (role === "ADMIN" || role === "SUPERADMIN" || role.includes("EJECUTIVO"));
      }
      function canSeeExecOnly(){
        const me = getParentMe();
        const role = String(me.role || me.rol || "").toUpperCase();
        return (role === "ADMIN" || role === "SUPERADMIN" || role.includes("EJECUTIVO"));
      }

      function viewURL(u){
        const s = String(u || "");
        if (!s) return s;
        if (/^https?:\/\//i.test(s)) return s;
        if (s.startsWith(API_BASE + "/")) return s;
        if (API_BASE && s.startsWith("/web/")) return API_BASE + s;
        return s;
      }

      const ITEMS = [
        { id:"correo", label:"Correo (GIA)", ico:"✉️", url:"/web/views/tools_correo.html?v=20260327-gmail-ui2", giaOnly:true },
        { id:"instagram", label:"Instagram (GIA)", ico:"📷", url:"/web/views/tools_instagram.html?v=20260326-gia2", giaOnly:true },
        { id:"whatsapp", label:"WhatsApp", ico:"💬", url:"/web/views/tools_whatsapp.html" },
        { id:"chat", label:"Chat (instalable)", ico:"💬", url:"/web/views/chat.html?v=20260327-1" },
        { id:"calc", label:"Calculadora", ico:"🧮", url:"/web/views/calculadora.html" },
        { id:"ext", label:"Descargar extensión (ventas)", ico:"🧩", url:"/web/downloads/LeadSuiteGD-extension.zip", execOnly:true, external:true },
      ];

      function setActive(id){
        qs("#quickNav").querySelectorAll("button[data-id]").forEach(b=> b.classList.toggle("active", b.getAttribute("data-id")===id));
        qs("#drawerNav").querySelectorAll("button[data-id]").forEach(b=> b.classList.toggle("active", b.getAttribute("data-id")===id));
      }

      function showDrawer(){
        const d = qs("#drawer");
        d.classList.add("show");
        d.setAttribute("aria-hidden", "false");
      }
      function hideDrawer(){
        const d = qs("#drawer");
        d.classList.remove("show");
        d.setAttribute("aria-hidden", "true");
      }

      function openTool(id){
        const it = ITEMS.find(x=>x.id===id) || ITEMS[0];
        if (!it) return;
        if (it.giaOnly && !canSeeGIA()){
          // fallback a un tool permitido
          openTool("whatsapp");
          return;
        }
        if (it.execOnly && !canSeeExecOnly()){
          openTool("whatsapp");
          return;
        }
        if (it.adminOnly && !isAdmin()){
          openTool("correo");
          return;
        }
        if (it.external){
          try{ window.open(viewURL(it.url), "_blank", "noopener"); }catch(_){}
          hideDrawer();
          return;
        }
        fr().src = viewURL(it.url);
        location.hash = "#" + it.id;
        setActive(it.id);
        qs("#activeToolTitle").textContent = it.label;
        hideDrawer();
      }

      function bind(){
        const list = ITEMS.filter(it =>
          (!it.adminOnly || isAdmin()) &&
          (!it.giaOnly || canSeeGIA()) &&
          (!it.execOnly || canSeeExecOnly())
        );
        const quick = qs("#quickNav");
        const drawer = qs("#drawerNav");

        quick.innerHTML = list.map(it => `
          <button class="chipBtn" type="button" data-id="${it.id}" title="${it.label}">
            <span class="ico">${it.ico}</span>
            <span>${it.label}</span>
          </button>
        `).join("");
        drawer.innerHTML = list.map(it => `
          <button type="button" data-id="${it.id}">
            <span class="ico">${it.ico}</span>
            <span>${it.label}</span>
          </button>
        `).join("");

        [...quick.querySelectorAll("button[data-id]"), ...drawer.querySelectorAll("button[data-id]")].forEach(b=>{
          b.addEventListener("click", ()=> openTool(b.getAttribute("data-id")));
        });

        qs("#btnMenu").addEventListener("click", showDrawer);
        qs("#btnCloseDrawer").addEventListener("click", hideDrawer);
        qs("#drawer").addEventListener("click", (ev)=>{ if (ev.target === qs("#drawer")) hideDrawer(); });
        window.addEventListener("keydown", (ev)=>{ if (ev.key === "Escape") hideDrawer(); });

        const initial = String(location.hash || "").replace(/^#/, "") || "correo";
        openTool(initial);
      }

      applyThemeBootstrap();
      fr().addEventListener("load", () => {
        if (lastPrefs) postToTool({ type:"prefs", prefs:lastPrefs });
      });
      bind();
    })();
  </script>
</body>
</html>
