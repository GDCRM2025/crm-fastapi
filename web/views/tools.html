<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tools</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <style>
    :root{ --bd:rgba(148,163,184,.18); --card:rgba(8,18,28,.78); --muted:rgba(148,163,184,.88); }
    html,body{height:100%;}
    body{ margin:0; background:transparent; color:inherit; font-family:inherit; }
    .layout{ height:100%; display:grid; grid-template-columns: 260px 1fr; gap:14px; padding:14px; }
    .side{
      border:1px solid var(--bd);
      border-radius:18px;
      background: linear-gradient(135deg, rgba(8,18,28,.78), rgba(10,16,22,.46));
      box-shadow:0 18px 40px rgba(0,0,0,.18);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
    }
    .side h1{ margin:4px 6px 0; font-size:18px; font-weight:1000; letter-spacing:.02em; }
    .side p{ margin:0 6px; font-size:12px; opacity:.80; line-height:1.4; color:var(--muted); }
    .nav{ display:grid; gap:8px; margin-top:6px; }
    .nav button{
      width:100%;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(255,255,255,.04);
      color:inherit;
      border-radius:14px;
      padding:10px 10px;
      font-weight:950;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      text-align:left;
    }
    .nav button:hover{ background:rgba(255,255,255,.08); }
    .nav button.active{ border-color: color-mix(in srgb, var(--accent,#19c37d) 45%, transparent); background: color-mix(in srgb, var(--accent,#19c37d) 16%, transparent); }
    .ico{ width:26px; height:26px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.06); border:1px solid rgba(148,163,184,.18); font-size:14px; }
    .foot{ margin-top:auto; padding:8px 6px 2px; color:var(--muted); font-size:11px; line-height:1.35; }
    .main{
      border:1px solid var(--bd);
      border-radius:18px;
      overflow:hidden;
      background:rgba(8,18,28,.35);
      box-shadow:0 18px 40px rgba(0,0,0,.12);
      min-height:0;
    }
    iframe{ width:100%; height:100%; border:0; background:transparent; }
    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
      .side{ order:2; }
      .main{ order:1; height:70vh; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <h1>Tools</h1>
      <p>Herramientas embebidas (sin abrir mil pestañas). Extensión eliminada.</p>

      <div class="nav" id="nav"></div>

      <div class="foot">
        Nota: Correo (GIA) aún es placeholder, pero con la UX final (bandeja + respuesta).
      </div>
    </aside>

    <section class="main">
      <iframe id="toolFrame" title="Tools"></iframe>
    </section>
  </div>

  <script>
    (() => {
      const qs = (s, el=document) => el.querySelector(s);
      const fr = () => qs("#toolFrame");

      const API_BASE = (() => {
        try{
          const h = String(location.hostname || "").toLowerCase();
          const isLocal = (h === "localhost" || h === "127.0.0.1");
          return isLocal ? "" : "/crm";
        }catch(_){
          return "";
        }
      })();

      let lastThemeMode = (localStorage.getItem("gd_theme") || "dark");
      let lastPrefs = null;

      function postToTool(msg){
        try{
          const w = fr().contentWindow;
          if (!w) return;
          w.postMessage(msg, "*");
        }catch(_){}
      }

      function applyThemeBootstrap(){
        document.documentElement.classList.toggle("light", lastThemeMode === "light");
        window.addEventListener("message", (ev) => {
          if (ev.data?.type === "theme"){
            lastThemeMode = ev.data.mode || lastThemeMode;
            document.documentElement.classList.toggle("light", lastThemeMode === "light");
            postToTool({ type:"theme", mode:lastThemeMode });
          }
          if (ev.data?.type === "prefs"){
            const p = ev.data.prefs || {};
            lastPrefs = p;
            if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
            if (p.text) document.documentElement.style.setProperty("--text", p.text);
            if (p.font) document.documentElement.style.setProperty("--font", p.font);
            postToTool({ type:"prefs", prefs:p });
          }
        });
      }

      function getParentMe(){
        try{
          return (window.parent && window.parent.GD && window.parent.GD.me) ? window.parent.GD.me : {};
        }catch(_){
          return {};
        }
      }

      function isAdmin(){
        const me = getParentMe();
        const role = String(me.role || me.rol || "").toUpperCase();
        return role === "ADMIN" || role === "SUPERADMIN";
      }

      function viewURL(u){
        const s = String(u || "");
        if (!s) return s;
        if (/^https?:\/\//i.test(s)) return s;
        if (s.startsWith(API_BASE + "/")) return s;
        if (API_BASE && s.startsWith("/web/")) return API_BASE + s;
        return s;
      }

      const ITEMS = [
        { id:"correo", label:"Correo (GIA)", ico:"✉️", url:"/web/views/tools_correo.html?v=20260325-gia2" },
        { id:"instagram", label:"Instagram (GIA)", ico:"📷", url:"/web/views/tools_instagram.html?v=20260324-gia1" },
        { id:"whatsapp", label:"WhatsApp", ico:"💬", url:"/web/views/tools_whatsapp.html" },
        { id:"clima", label:"Clima", ico:"🌤️", url:"/web/views/clima.html?v=20260317-wxpage1" },
        { id:"calc", label:"Calculadora", ico:"🧮", url:"/web/views/calculadora.html" },
      ];

      function setActive(id){
        const nav = qs("#nav");
        nav.querySelectorAll("button[data-id]").forEach(b=> b.classList.toggle("active", b.getAttribute("data-id")===id));
      }

      function openTool(id){
        const it = ITEMS.find(x=>x.id===id) || ITEMS[0];
        if (!it) return;
        if (it.adminOnly && !isAdmin()){
          openTool("correo");
          return;
        }
        fr().src = viewURL(it.url);
        location.hash = "#" + it.id;
        setActive(it.id);
      }

      function bind(){
        const nav = qs("#nav");
        const list = ITEMS.filter(it => !it.adminOnly || isAdmin());
        nav.innerHTML = list.map(it => `
          <button type="button" data-id="${it.id}">
            <span class="ico">${it.ico}</span>
            <span>${it.label}</span>
          </button>
        `).join("");
        nav.querySelectorAll("button[data-id]").forEach(b=>{
          b.addEventListener("click", ()=> openTool(b.getAttribute("data-id")));
        });
        const initial = String(location.hash || "").replace(/^#/, "") || "correo";
        openTool(initial);
      }

      applyThemeBootstrap();
      // Re-envía theme/prefs al tool cuando cambia el src o recarga.
      fr().addEventListener("load", () => {
        postToTool({ type:"theme", mode:lastThemeMode });
        if (lastPrefs) postToTool({ type:"prefs", prefs:lastPrefs });
      });
      bind();
    })();
  </script>
</body>
</html>
