<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tools</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <style>
    body{ margin:0; padding:14px; font-family:inherit; color:inherit; }
    .grid{ display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card{
      border:1px solid var(--border, rgba(255,255,255,.12));
      border-radius:14px; padding:12px;
      background:linear-gradient(135deg, rgba(8,18,28,.7), rgba(10,16,22,.4));
    }
    .ttl{ font-weight:950; font-size:16px; }
    .muted{ opacity:.75; font-size:12px; margin-top:4px; }
    .btn{ border:1px solid var(--border, rgba(255,255,255,.12)); background:rgba(0,0,0,.15); color:inherit; border-radius:10px; padding:10px 12px; cursor:pointer; font-weight:900; width:100%; text-align:left; }
    .btn:hover{ background: rgba(255,255,255,.08); }
    :root.light .btn:hover{ background: rgba(0,0,0,.06); }

    /* calc */
    .calc{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:10px; }
    .disp{ border:1px solid var(--border, rgba(255,255,255,.12)); border-radius:12px; padding:10px; font-weight:950; font-size:22px; text-align:right; }
    .k{ height:44px; border-radius:12px; border:1px solid var(--border, rgba(255,255,255,.12)); background:transparent; color:inherit; font-weight:950; cursor:pointer; }
    .k:hover{ background: rgba(255,255,255,.06); }
    :root.light .k:hover{ background: rgba(0,0,0,.06); }
    .k.wide{ grid-column: span 2; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="ttl">Tools</div>
      <div class="muted">
        Esta sección no muestra descargables. Si necesitas instalar/extender algo, se gestiona por Admin.
      </div>
    </div>
  </div>

  <script>
    const qs = (s, el=document) => el.querySelector(s);

    function applyThemeBootstrap(){
      const mode = (localStorage.getItem("gd_theme") || "dark");
      document.documentElement.classList.toggle("light", mode === "light");
      window.addEventListener("message", (ev) => {
        if (ev.data?.type === "theme"){
          document.documentElement.classList.toggle("light", ev.data.mode === "light");
        }
      });
    }

    applyThemeBootstrap();

  </script>
</body>
</html>
