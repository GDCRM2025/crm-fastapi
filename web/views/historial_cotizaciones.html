<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Historial Cotizaciones</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{
      --app-bg:#07131F; --surface:#0C1B2B; --surface2:#102235; --border:#22384F;
      --text:#EAF2FF; --muted:#A9BBD2; --accent:#19C37D; --shadow:0 12px 30px rgba(0,0,0,.35);
    }
    :root.light{
      --app-bg:#f6f8ff; --surface:#fff; --surface2:#f2f5ff; --border:#d9e2f2;
      --text:#0b1220; --muted:#4b5f7a; --shadow:0 10px 24px rgba(0,0,0,.10);
    }
    *{ box-sizing:border-box; }
    html,body{height:100%;}
    body{ margin:0; background:var(--app-bg); color:var(--text); font-family: ui-sans-serif, system-ui; }
    .wrap{ padding:12px; height:100%; display:flex; flex-direction:column; gap:12px; }
    .bar{
      display:grid; grid-template-columns:minmax(220px,1.5fr) repeat(3,minmax(150px,.7fr)) auto auto; gap:10px; align-items:end;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding: 12px;
    }
    @media(max-width:1100px){ .bar{ grid-template-columns:1fr 1fr 1fr; } }
    @media(max-width:680px){ .bar{ grid-template-columns:1fr; } }
    .filter label{ display:block; margin:0 0 6px; color:var(--muted); font-size:12px; font-weight:900; }
    .filter input,.filter select{
      width:100%; min-height:40px; border:1px solid var(--border); border-radius:12px;
      background:var(--surface2); color:var(--text); padding:8px 10px; outline:0;
    }
    .search{
      flex:1; display:flex; align-items:center; gap:10px;
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:12px;
      padding: 10px 12px;
    }
    .search input{
      width:100%; border:0; outline:0; background:transparent; color:var(--text); font-size:13px;
    }
    .pill{
      font-size:12px; font-weight:900; color:var(--muted);
      border:1px solid var(--border);
      background:var(--surface2);
      padding:6px 10px; border-radius:999px;
      white-space:nowrap;
    }
    .btn{
      border:1px solid rgba(25,195,125,.30);
      background: rgba(25,195,125,.16);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 900;
      cursor:pointer;
      white-space: nowrap;
    }
    .btn.primary{ background:var(--accent); color:#052016; border-color: rgba(0,0,0,.15); }

    .table-wrap{
      flex: 1;
      min-height: 0;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .table-scroll{ height:100%; overflow:auto; }
    table{ width:100%; border-collapse:collapse; }
    thead th{
      background:var(--surface2);
      color:var(--muted);
      font-weight:950;
      font-size:12px;
      text-align:left;
      padding:12px 10px;
      border-bottom:1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tbody td{
      padding:10px 10px;
      border-bottom:1px solid var(--border);
      font-size:13px;
      color:var(--text);
    }
    tbody tr:hover{ background: rgba(255,255,255,.03); }

    .act{ display:flex; gap:8px; }
    .mini{
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color:var(--text);
      padding:6px 10px;
      border-radius:10px;
      font-weight:900;
      cursor:pointer;
    }
    .mini:hover{ filter:brightness(1.10); }
    .mini:disabled{ opacity:.4; cursor:not-allowed; }
    .mini.wa{ border-color:rgba(25,195,125,.42); background:rgba(25,195,125,.12); }
    .mini.tel{ border-color:rgba(96,165,250,.42); background:rgba(96,165,250,.12); }

    .tooltip{
      position: fixed;
      z-index: 9999;
      background: var(--surface);
      border:1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 14px;
      padding: 10px 12px;
      min-width: 260px;
      max-width: 420px;
      display:none;
    }
    .tooltip .t{ font-weight: 950; margin-bottom:6px; }
    .tooltip ul{ margin:0; padding-left:18px; color:var(--muted); font-weight:800; font-size:12px; }
    .tooltip li{ margin:4px 0; }

    .toast{
      position: fixed; bottom:18px; right:18px; z-index:9999;
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; box-shadow: var(--shadow);
      padding:12px 14px; min-width:240px; display:none;
    }
    .toast.show{ display:block; }
    .toast .t{ font-weight:950; }
    .toast .s{ font-size:12px; color:var(--muted); margin-top:4px; }

    .pager{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border-top:1px solid var(--border);
      background:var(--surface2);
    }
    .pager .meta{ color:var(--muted); font-weight:900; font-size:12px; }
    .pager .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="font-weight:1000;font-size:18px;margin:6px 4px 10px;">Historial de Cotizaciones</div>
    <div class="bar">
      <div class="search">
        <span style="opacity:.85">⌕</span>
        <input id="q" placeholder="Buscar por cliente, marca o código..." />
      </div>
      <div class="filter">
        <label for="mes">Mes de cotización</label>
        <input id="mes" type="month" />
      </div>
      <div class="filter">
        <label for="tipoCliente">Tipo de cliente</label>
        <select id="tipoCliente">
          <option value="">Todos</option>
          <option value="EMPRESA">Solo empresas</option>
          <option value="PARTICULAR">Solo particulares</option>
        </select>
      </div>
      <div class="filter">
        <label for="orden">Ordenar por</label>
        <select id="orden">
          <option value="fecha_desc">Fecha: más reciente</option>
          <option value="fecha_asc">Fecha: más antigua</option>
          <option value="total_desc">Monto: mayor a menor</option>
          <option value="total_asc">Monto: menor a mayor</option>
        </select>
      </div>
      <div class="pill" id="cnt">0</div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="btnClear" type="button">Limpiar</button>
        <button class="btn primary" id="btnReload" type="button">Filtrar</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:90px">N°</th>
              <th style="width:170px">Fecha</th>
              <th>Cliente</th>
              <th style="width:120px">Tipo</th>
              <th style="width:160px">Marca</th>
              <th style="width:120px">Neto</th>
              <th style="width:120px">Desc.</th>
              <th style="width:120px">IVA</th>
              <th style="width:120px">Traslado</th>
              <th style="width:140px">Total</th>
              <th style="width:280px">Acciones</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
      <div class="pager">
        <div class="meta" id="pgMeta">—</div>
        <div class="row">
          <label class="meta">Página</label>
          <button class="btn" id="btnPrev" type="button">‹</button>
          <button class="btn" id="btnNext" type="button">›</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tip"></div>
  <div class="toast" id="toast">
    <div class="t" id="tt">OK</div>
    <div class="s" id="ts">—</div>
  </div>

  <script type="module">
    const qs=(s,el=document)=>el.querySelector(s);

    function getToken(){
      const keys=["token","gd_token","access_token","gd_access_token","jwt","crm_token"];
      for(const store of [localStorage,sessionStorage]){
        for(const key of keys){
          try{
            const value=String(store.getItem(key)||"").trim();
            if(value)return value;
          }catch(_){}
        }
      }
      return "";
    }
    function authHeaders(extra={}){ const t=getToken(); return t?{...extra,Authorization:`Bearer ${t}`} : extra; }

    const API_BASE = (() => {
      try{
        const host = String(location.hostname||"").toLowerCase();
        const isLocal = (host==="127.0.0.1" || host==="localhost");
        return isLocal ? "" : "/crm";
      }catch(_){ return ""; }
    })();
	    function apiURL(u){
	      const s = String(u||"");
	      if (!s) return s;
	      if (s.startsWith("/crm/")) return s;
	      if (s.startsWith("/")) return API_BASE + s;
	      return API_BASE + "/" + s;
	    }
	    async function apiJSON(url, init={}){
	      const r = await fetch(apiURL(url), { ...init, headers: authHeaders(init.headers || {}) });
	      const text = await r.text();
	      let j = null;
	      try{ j = text ? JSON.parse(text) : null; }catch(_){}
	      if(!r.ok){
	        const msg = (j && (j.detail || j.error)) ? (j.detail || j.error) : (text || (r.status + ""));
	        throw new Error(String(msg));
	      }
	      return j;
	    }

    window.addEventListener("message",(ev)=>{
      if(ev.data?.type==="theme") document.documentElement.classList.toggle("light", ev.data.mode==="light");
    });

    const Toast = Swal.mixin({
      toast:true,
      position:"top-end",
      showConfirmButton:false,
      timer:2600,
      timerProgressBar:true
    });
    function toast(a,b,icon="info"){
      Toast.fire({title:a||"OK", text:b||"", icon});
    }

    function money(n){
      const v=Number(n||0);
      try{ return v.toLocaleString("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}); }
      catch(_){ return "$"+Math.round(v); }
    }

    const params = new URLSearchParams(location.search);
    const leadId = params.get("id_lead");

    const STATE = { limit: 50, offset: 0, hasMore: false, total: 0 };

    function esc(value){
      return String(value ?? "").replace(/[&<>"']/g, ch=>({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[ch]));
    }

    function monthRange(value){
      const match=String(value||"").match(/^(\d{4})-(\d{2})$/);
      if(!match) return null;
      const year=Number(match[1]);
      const month=Number(match[2]);
      const lastDay=new Date(year, month, 0).getDate();
      return { desde:`${match[1]}-${match[2]}-01`, hasta:`${match[1]}-${match[2]}-${String(lastDay).padStart(2,"0")}` };
    }

	    async function getHistory(){
      const q=(qs("#q").value||"").trim();
      const query=new URLSearchParams({limit:String(STATE.limit),offset:String(STATE.offset)});
      if(leadId) query.set("id_lead",leadId);
      if(q) query.set("q",q);
      const range=monthRange(qs("#mes").value);
      if(range){ query.set("fecha_desde",range.desde); query.set("fecha_hasta",range.hasta); }
      if(qs("#tipoCliente").value) query.set("tipo_cliente",qs("#tipoCliente").value);
      query.set("orden",qs("#orden").value||"fecha_desc");
      const url=apiURL(`/quotes/history?${query.toString()}`);
      const r=await fetch(url,{headers:authHeaders()});
      if(!r.ok) throw new Error(await r.text());
      const j=await r.json();
      const items = Array.isArray(j) ? j : (j.items||[]);
      STATE.total = Array.isArray(j) ? (STATE.offset+items.length) : Number(j.total||0);
      STATE.hasMore = STATE.offset + items.length < STATE.total;
      return items;
	    }

	    function filenameFromDisposition(value, fallback){
	      const source=String(value||"");
	      const utf=source.match(/filename\*=UTF-8''([^;]+)/i);
	      if(utf?.[1]){
	        try{return decodeURIComponent(utf[1].trim().replace(/^"|"$/g,""));}catch(_){}
	      }
	      const plain=source.match(/filename="?([^";]+)"?/i);
	      return plain?.[1]?.trim() || fallback || "cotizacion.pdf";
	    }

	    async function fetchPdf(id, {download=false}={}){
	      const suffix = download ? "?download=1" : "";
	      const url = apiURL(`/quotes/${id}/pdf${suffix}${suffix ? "&" : "?"}v=${Date.now()}`);
	      const r = await fetch(url, { headers: authHeaders() });
	      if (!r.ok){
	        const txt = await r.text();
	        throw new Error(txt || `HTTP ${r.status}`);
	      }
	      const blob = await r.blob();
	      if(!String(blob.type||"").toLowerCase().includes("pdf")){
	        throw new Error("El servidor no devolvió un PDF válido.");
	      }
	      const filename = filenameFromDisposition(
	        r.headers.get("content-disposition"),
	        `cotizacion_${id}.pdf`
	      );
	      return {blob, filename};
	    }

	    async function viewPdf(id){
	      toast("Preparando vista previa…", `Cotización #${id}`, "info");
	      const {blob, filename} = await fetchPdf(id);
	      const href = URL.createObjectURL(new File([blob], filename, {type:"application/pdf"}));
	      const safe = String(filename).replace(/[&<>"']/g,ch=>({
	        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
	      }[ch]));
	      await Swal.fire({
	        title: safe,
	        html: `
	          <div style="display:flex;justify-content:flex-end;margin:0 0 10px">
	            <a class="btn primary" href="${href}" download="${safe}">⬇ Descargar con nombre</a>
	          </div>
	          <iframe title="${safe}" src="${href}" style="width:100%;height:72vh;border:0;border-radius:12px;background:#fff"></iframe>
	        `,
	        width: "min(1100px, 96vw)",
	        showConfirmButton: false,
	        showCloseButton: true,
	        didClose: ()=>{ try{ URL.revokeObjectURL(href); }catch(_){} },
	      });
	    }

	    async function downloadPdf(id){
	      toast("Descargando PDF…", `Cotización #${id}`, "info");
	      const {blob, filename} = await fetchPdf(id, {download:true});

	      const a = document.createElement("a");
	      const href = URL.createObjectURL(blob);
	      a.href = href;
	      a.download = filename;
	      a.rel = "noopener";
	      a.style.display = "none";
	      document.body.appendChild(a);
	      a.click();
	      a.remove();
	      setTimeout(()=>{ try{ URL.revokeObjectURL(href); }catch(_){} }, 60_000);
	      toast("PDF descargado", filename, "success");
	    }

    const cacheItems = new Map();

    async function getItems(id){
      if(cacheItems.has(id)) return cacheItems.get(id);
      const r=await fetch(apiURL(`/quotes/${id}/items`),{headers:authHeaders()});
      if(!r.ok) return [];
      const j=await r.json();
      const items = j.items || [];
      cacheItems.set(id, items);
      return items;
    }

    function registerContact(row, kind, title, text){
      const id=Number(row?.id_lead||0);
      if(!id) return;
      apiJSON(`/leads/${id}/append_note`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({kind,title,text})
      }).catch(()=>{});
    }

    const tip = qs("#tip");
    function showTip(x,y,html){
      tip.innerHTML=html;
      tip.style.left=(x+12)+"px";
      tip.style.top=(y+12)+"px";
      tip.style.display="block";
    }
    function hideTip(){ tip.style.display="none"; }

    function updatePager(count){
      const from = STATE.offset + 1;
      const to = STATE.offset + count;
      const page = Math.floor(STATE.offset / STATE.limit) + 1;
      qs("#pgMeta").textContent = count ? `Mostrando ${from}–${to} de ${STATE.total} · Página ${page}` : `Sin resultados`;
      qs("#btnPrev").disabled = STATE.offset <= 0;
      qs("#btnNext").disabled = !STATE.hasMore;
    }

    async function render(){
      try{
        const rows = await getHistory();
        qs("#cnt").textContent = `${STATE.total} cotizaciones`;
        const tb=qs("#tb");
        tb.innerHTML="";
        updatePager(rows.length);

	      for(const r of rows){
	        const tr=document.createElement("tr");
          const fecha = r.fecha_emision ? String(r.fecha_emision).replace("T"," ").slice(0,16)
            : (r.fecha_evento ? String(r.fecha_evento).slice(0,10) : "—");
          const rev = (r.revision != null) ? Number(r.revision) : Number(r.version || 0);
          const neto = (r.neto != null) ? Number(r.neto) : Number(r.subtotal || 0);
          const descTipo = String(r.descuento_tipo || "").trim();
          const descValor = Number(r.descuento_valor || 0);
          const descAbs = Number(r.descuento_abs || 0);
          const subtotalBruto = (r.subtotal_bruto != null) ? Number(r.subtotal_bruto) : Math.max(0, neto + Math.max(0, descAbs));
          const descCell = (descAbs > 0) ? ("-" + money(descAbs)) : money(0);
	          const canOpenLead = !!(r.id_lead);
              const canContact = !!String(r.telefono||"").trim();
	          tr.innerHTML=`
	            <td>${esc(r.numero || r.id_cotizacion)}${(rev > 0) ? ` (${rev})` : ""}</td>
	            <td>${esc(fecha)}</td>
	            <td>${esc(r.nombre_cliente||"")}</td>
	            <td>${esc(r.tipo_cliente||"—")}</td>
	            <td>${esc(r.marca||"")}</td>
	            <td>${money(neto)}</td>
	            <td>${descCell}</td>
	            <td>${money(r.iva)}</td>
	            <td>${money(r.traslado)}</td>
	            <td>${money(r.total)}</td>
		            <td>
	              <div class="act">
	                <button class="mini" title="Abrir lead" data-act="lead" data-lead="${esc(r.id_lead||"")}" ${canOpenLead ? "" : "disabled"}>Abrir</button>
	                <button class="mini tel" title="Llamar al cliente" data-act="call" ${canContact ? "" : "disabled"}>☎</button>
	                <button class="mini wa" title="Contactar por WhatsApp" data-act="wa" ${canContact ? "" : "disabled"}>WhatsApp</button>
	                <button class="mini" title="Ver PDF" data-act="view" data-id="${esc(r.id_cotizacion)}">👁</button>
	                <button class="mini" title="Descargar PDF" data-act="download" data-id="${esc(r.id_cotizacion)}">⬇</button>
	              </div>
		            </td>
		          `;

          tr.addEventListener("mouseenter", async (ev)=>{
            const id=r.id_cotizacion;
            const items = await getItems(id);
            const li = items.map(it=>`<li>${esc(it.producto)} × ${esc(it.cantidad)}</li>`).join("");
            const descLabel = (descValor > 0 && descTipo === "%") ? `Descuento (${descValor}%)` : "Descuento";
            const html = `
              <div class="t">Productos (${items.length})</div>
              <ul>${li||"<li>Sin items</li>"}</ul>
              <div class="t" style="margin-top:8px">Totales</div>
              <ul>
                <li>Subtotal productos: ${money(subtotalBruto)}</li>
                <li>${descLabel}: ${descAbs > 0 ? ("-" + money(descAbs)) : money(0)}</li>
                <li>Neto: ${money(neto)}</li>
                <li>IVA: ${money(r.iva)}</li>
                <li>Traslado: ${money(r.traslado)}</li>
                <li>Total: ${money(r.total)}</li>
              </ul>
            `;
            showTip(ev.clientX, ev.clientY, html);
          });
          tr.addEventListener("mouseleave", hideTip);

	          async function openLeadEmbed(idLead){
	            const lid = Number(idLead||0);
	            if (!lid) return;
	            // Abrir en embed para no sacar al ejecutivo del historial.
	            const url = apiURL(`/web/views/leads.html?v=20260729-uat1&embed=1&audit_focus=1&stale_ids=${lid}&open_lead=${lid}&from=historial`);
	            await Swal.fire({
	              title: `Lead #${lid}`,
	              html: `<iframe src="${url}" style="width:100%;height:72vh;border:0;border-radius:16px;background:transparent" allow="clipboard-read; clipboard-write"></iframe>`,
	              width: 980,
	              showConfirmButton: false,
	              showCloseButton: true,
	              customClass: { popup: "gdModal" },
	              didOpen: ()=>{
	                try{
	                  // Registrar acción (best-effort)
	                  apiJSON(`/leads/${lid}/append_note`, {
	                    method:"POST",
	                    headers:{ "Content-Type":"application/json" },
	                    body: JSON.stringify({ kind:"ACTION", title:"Lead abierto", text:`Lead abierto desde Historial de cotizaciones (cotización #${r.numero || r.id_cotizacion}).` })
	                  }).catch(()=>{});
	                }catch(_){}
	              }
	            });
	          }

	          tr.addEventListener("click", async (ev)=>{
	            const btn = ev.target?.closest?.("button");
	            if(!btn) return;
	            const act = btn.dataset.act;
	            const id = btn.dataset.id;
	            const lid = btn.dataset.lead;
	            if(act==="lead"){
	              try{ await openLeadEmbed(lid); }catch(_){}
	              return;
	            }
	            if(act==="call"){
	              const phone=String(r.telefono||"").trim();
	              if(phone){
	                registerContact(r,"CALL","Llamada iniciada",`Llamada iniciada desde Historial de cotizaciones por la cotización #${r.numero||r.id_cotizacion}.`);
	                location.href=`tel:${phone}`;
	              }
	              return;
	            }
	            if(act==="wa"){
	              const phone=String(r.telefono||"").replace(/\D/g,"");
	              if(phone){
	                const msg=`Hola ${String(r.nombre_cliente||"").trim()}, te contacto por tu cotización N° ${r.numero||r.id_cotizacion}.`;
	                registerContact(r,"WSP","WhatsApp iniciado",msg);
	                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
	              }
	              return;
	            }
		            if(act==="view"){
		              try{
		                await viewPdf(id);
		              }catch(e){
		                toast("No se pudo previsualizar", String(e?.message||e).slice(0,200), "error");
		              }
	              return;
	            }
		            if(act==="download"){
		              try{
		                await downloadPdf(id);
		              }catch(e){
		                toast("No se pudo descargar", String(e?.message||e).slice(0,200), "error");
		              }
		              return;
		            }
		          });

          tb.appendChild(tr);
        }
      }catch(e){
        toast("Error cargando", "Historial no disponible. Revisa /quotes/history.", "error");
      }
    }

    qs("#btnReload").onclick = () => { STATE.offset = 0; render(); };
    qs("#btnClear").onclick = () => {
      qs("#q").value="";
      qs("#mes").value="";
      qs("#tipoCliente").value="";
      qs("#orden").value="fecha_desc";
      STATE.offset=0;
      render();
    };
    for(const id of ["#mes","#tipoCliente","#orden"]){
      qs(id).addEventListener("change",()=>{ STATE.offset=0; render(); });
    }
    qs("#btnPrev").onclick = () => {
      STATE.offset = Math.max(0, STATE.offset - STATE.limit);
      render();
    };
    qs("#btnNext").onclick = () => {
      if (!STATE.hasMore) return;
      STATE.offset = STATE.offset + STATE.limit;
      render();
    };

    // Buscador (debounced)
    let _t=null;
    qs("#q").addEventListener("input", ()=>{
      clearTimeout(_t);
      _t = setTimeout(()=>{
        STATE.offset = 0;
        render();
      }, 260);
    });
    document.addEventListener("mousemove",(e)=>{
      if(tip.style.display==="block"){
        tip.style.left=(e.clientX+12)+"px";
        tip.style.top=(e.clientY+12)+"px";
      }
    });

    render();
  </script>
</body>
</html>
