<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WhatsApp GIA</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <link rel="stylesheet" href="/web/ui_overrides.css" />
  <style>
    :root{color-scheme:light;--bg:#eef2f7;--card:#fff;--bd:#dbe3ec;--muted:#64748b;--green:#16a34a;--green2:#dcfce7}
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#0f172a}
    button,input,textarea,select{font:inherit}.app{height:100%;display:grid;grid-template-columns:340px minmax(0,1fr) 300px;gap:1px;background:var(--bd)}
    .pane{background:var(--card);min-height:0}.left,.chat,.right{display:flex;flex-direction:column;min-height:0}
    .head{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1,.head h2{margin:0;font-size:16px}
    .toolbar{padding:10px;border-bottom:1px solid var(--bd);display:grid;gap:8px}.search{width:100%;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.filters{display:flex;gap:6px;flex-wrap:wrap}
    .btn{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:700}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:#b91c1c}.btn.active{background:#e2e8f0}
    .list{overflow:auto;min-height:0}.item{padding:13px 14px;border-bottom:1px solid #edf2f7;cursor:pointer}.item:hover,.item.active{background:#f8fafc}.itemTop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.time{font-size:11px;color:var(--muted)}.meta,.preview{font-size:12px;color:var(--muted);margin-top:4px}.badge{background:var(--green);color:#fff;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:800}
    .chatHead{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.chatTitle{font-weight:900}.chatSub{font-size:12px;color:var(--muted);margin-top:2px}.messages{flex:1;overflow:auto;padding:18px;background:#efeae2;display:flex;flex-direction:column;gap:8px}.bubble{max-width:76%;padding:9px 11px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.08)}.in{align-self:flex-start;background:#fff}.out{align-self:flex-end;background:#d9fdd3}.msgMeta{font-size:10px;color:var(--muted);text-align:right;margin-top:4px}
    .composer{border-top:1px solid var(--bd);padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px}.composer textarea{resize:none;border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:44px;max-height:110px}
    .rightBody{padding:14px;overflow:auto}.card{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800}.value{margin-top:4px;font-weight:800;word-break:break-word}.stack{display:grid;gap:8px}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
    @media(max-width:1050px){.app{grid-template-columns:300px minmax(0,1fr)}.right{display:none}} @media(max-width:720px){.app{grid-template-columns:1fr}.left{display:flex}.chat{display:none}.app.chat-open .left{display:none}.app.chat-open .chat{display:flex}}
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="pane left">
    <div class="head"><h1>WhatsApp GIA</h1><button class="btn" id="refresh">Actualizar</button></div>
    <div class="toolbar">
      <input class="search" id="q" placeholder="Buscar nombre, teléfono o mensaje" />
      <div class="filters"><button class="btn active" data-status="open">Abiertas</button><button class="btn" data-status="closed">Cerradas</button><button class="btn" data-status="all">Todas</button></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="pane chat">
    <div id="chatEmpty" class="empty">Selecciona una conversación</div>
    <div id="chatWrap" style="display:none;height:100%;min-height:0;flex-direction:column">
      <div class="chatHead"><div><button class="btn" id="back" style="display:none">←</button><span class="chatTitle" id="chatName"></span><div class="chatSub" id="chatSub"></div></div><div><button class="btn danger" id="closeBtn">Cerrar</button></div></div>
      <div class="messages" id="messages"></div>
      <form class="composer" id="sendForm"><textarea id="message" placeholder="Escribe un mensaje"></textarea><button class="btn primary" type="submit">Enviar</button></form>
    </div>
  </main>
  <aside class="pane right">
    <div class="head"><h2>Ficha</h2></div>
    <div class="rightBody" id="side"><div class="empty">Sin conversación seleccionada</div></div>
  </aside>
</div>
<script>
(() => {
  document.documentElement.classList.add('light');
  const $ = s => document.querySelector(s);
  const API_BASE = (()=>{const h=String(location.hostname||'').toLowerCase();return (h==='localhost'||h==='127.0.0.1')?'':'/crm';})();
  const GD = (()=>{try{return window.parent?.GD||null}catch(_){return null}})();
  const authHeaders = extra => GD?.authHeaders ? GD.authHeaders(extra||{}) : (()=>{const t=localStorage.getItem('token')||sessionStorage.getItem('token');return t?{...(extra||{}),Authorization:'Bearer '+t}:{...(extra||{})}})();
  const api = async (path,opt={}) => {const r=await fetch(API_BASE+path,{...opt,headers:authHeaders({'Content-Type':'application/json',...(opt.headers||{})})});let j={};try{j=await r.json()}catch(_){}if(!r.ok)throw new Error(j.detail||j.error||('HTTP '+r.status));return j};
  const fmt = v => {if(!v)return '';try{return new Intl.DateTimeFormat('es-CL',{dateStyle:'short',timeStyle:'short',timeZone:'America/Santiago'}).format(new Date(v))}catch(_){return v}};
  const esc = v => String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let items=[], current=null, status='open', timer=null;

  async function load(){const q=$('#q').value.trim();const j=await api('/gia/whatsapp/conversations?status='+encodeURIComponent(status)+(q?'&q='+encodeURIComponent(q):''));items=j.items||[];renderList();if(current){const found=items.find(x=>x.id===current.id);if(found)current={...current,...found}}}
  function renderList(){const el=$('#list');if(!items.length){el.innerHTML='<div class="empty">No hay conversaciones</div>';return}el.innerHTML=items.map(x=>`<div class="item ${current?.id===x.id?'active':''}" data-id="${x.id}"><div class="itemTop"><span class="name">${esc(x.profile_name||x.wa_id)}</span><span class="time">${esc(fmt(x.last_message_at))}</span></div><div class="meta">${esc(x.brand_code||'SIN ASIGNAR')} · ${esc(x.executive_name||'Sin ejecutivo')}</div><div class="itemTop"><div class="preview">${x.last_direction==='outbound'?'Tú: ':''}${esc(x.last_message||'')}</div>${x.unread_count?`<span class="badge">${x.unread_count}</span>`:''}</div></div>`).join('');el.querySelectorAll('.item').forEach(n=>n.onclick=()=>openConversation(Number(n.dataset.id)))}
  async function openConversation(id){const j=await api('/gia/whatsapp/conversations/'+id+'/messages');current=j.conversation;$('#app').classList.add('chat-open');$('#chatEmpty').style.display='none';$('#chatWrap').style.display='flex';$('#chatName').textContent=current.profile_name||current.wa_id;$('#chatSub').textContent='+'+current.wa_id+' · '+(current.brand_code||'SIN ASIGNAR');renderMessages(j.items||[]);renderSide();await load()}
  function renderMessages(rows){const el=$('#messages');el.innerHTML=rows.map(m=>`<div class="bubble ${m.direction==='outbound'?'out':'in'}"><div>${esc(m.body||'')}</div><div class="msgMeta">${esc(fmt(m.sent_at))}${m.direction==='outbound'?' · '+esc(m.status||''):''}</div></div>`).join('');el.scrollTop=el.scrollHeight}
  function renderSide(){if(!current)return;const brands=[['CAMALEON','CAMALEÓN · Andrés Landerer'],['DEL_SABOR','DEL SABOR · Walter Canales'],['GOURMET','GOURMET · Constanza Franco'],['EXPRESS','EXPRESS · Daniel Toledo']];$('#side').innerHTML=`<div class="card stack"><div><div class="label">Cliente</div><div class="value">${esc(current.profile_name||'Sin nombre')}</div></div><div><div class="label">Teléfono</div><div class="value">+${esc(current.wa_id)}</div></div><div><div class="label">Marca</div><div class="value">${esc(current.brand_code||'Sin asignar')}</div></div><div><div class="label">Ejecutivo</div><div class="value">${esc(current.executive_name||'Sin asignar')}</div></div></div><div class="card"><div class="label">Asignar marca</div><div class="stack" style="margin-top:8px"><select id="brand" class="search">${brands.map(([v,l])=>`<option value="${v}" ${current.brand_code===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn primary" id="assign">Guardar asignación</button></div></div><div class="card"><button class="btn" id="createLead" style="width:100%">Crear lead desde WhatsApp</button></div>`;$('#assign').onclick=assign;$('#createLead').onclick=createLead}
  async function assign(){const brand_code=$('#brand').value;await api('/gia/whatsapp/conversations/'+current.id+'/assign',{method:'POST',body:JSON.stringify({brand_code})});await openConversation(current.id)}
  function createLead(){const payload={nombre_cliente:current.profile_name||'CLIENTE WHATSAPP',telefono:current.wa_id,plataforma:'WHATSAPP',notas:'Lead creado desde WhatsApp GIA'};try{window.parent?.postMessage({type:'openItem',id:'leads',url:'/web/views/leads.html#open-create',prefill:payload},'*')}catch(_){}alert('Se abrió Leads. Completa marca, comuna y fecha del evento.')}
  $('#sendForm').onsubmit=async e=>{e.preventDefault();const text=$('#message').value.trim();if(!text||!current)return;$('#message').value='';try{await api('/gia/whatsapp/conversations/'+current.id+'/send',{method:'POST',body:JSON.stringify({text})});await openConversation(current.id)}catch(err){alert(err.message)}};
  $('#closeBtn').onclick=async()=>{if(!current)return;await api('/gia/whatsapp/conversations/'+current.id+'/close',{method:'POST',body:'{}'});current=null;$('#chatWrap').style.display='none';$('#chatEmpty').style.display='grid';$('#side').innerHTML='<div class="empty">Sin conversación seleccionada</div>';$('#app').classList.remove('chat-open');await load()};
  $('#back').onclick=()=>$('#app').classList.remove('chat-open');if(innerWidth<=720)$('#back').style.display='inline-block';
  $('#refresh').onclick=load;$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,350)};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-status]').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;load()});
  load().catch(e=>$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>');setInterval(()=>load().catch(()=>{}),15000);
})();
</script>
</body>
</html>
