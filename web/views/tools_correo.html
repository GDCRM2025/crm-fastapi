<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/web/styles.css" />
  <link rel="stylesheet" href="/web/ui_overrides.css" />
  <title>Tools · Correo (GIA)</title>
  <style>
    :root{
      /* look & feel: más "Google" (minimal) */
      --bd: rgba(148,163,184,.16);
      --muted: rgba(148,163,184,.86);
      --pane-bg: rgba(7,12,18,.62);
      --pane-bg2: rgba(7,12,18,.44);
      --row: rgba(255,255,255,.02);
      --rowHover: rgba(255,255,255,.05);
      --chip: rgba(255,255,255,.05);
      --shadow: 0 10px 28px rgba(0,0,0,.18);
    }
    html,body{height:100%;}
    body{ margin:0; padding:12px; background:transparent; color:inherit; font-family:inherit; }

    .app{
      height:100%;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .topbar{
      border:1px solid var(--bd);
      background: linear-gradient(180deg, var(--pane-bg), var(--pane-bg2));
      border-radius:16px;
      box-shadow: var(--shadow);
      padding:9px 12px;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:48px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 240px;
    }
    .title{
      font-weight: 1000;
      letter-spacing: .2px;
      font-size: 14px;
      white-space:nowrap;
    }
    .sub{
      color:var(--muted);
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }
    .search{
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(255,255,255,.025);
      border-radius:14px;
      padding:9px 12px;
      min-width: 240px;
    }
    .search input{
      width:100%;
      border:0;
      background:transparent;
      outline:none;
      color:inherit;
      font-size:13px;
      font-weight:900;
    }
    .search .hint{
      color:var(--muted);
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
      opacity:.85;
    }

    .btn{
      border:1px solid rgba(148,163,184,.18);
      background:rgba(255,255,255,.03);
      color:inherit;
      border-radius:12px;
      padding:8px 11px;
      font-weight:950;
      cursor:pointer;
      font-size:12px;
      white-space:nowrap;
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }
    .btn.primary{
      background:color-mix(in srgb, var(--accent, #19c37d) 16%, transparent);
      border-color:color-mix(in srgb, var(--accent, #19c37d) 40%, transparent);
    }
    .btn.danger{
      background:rgba(220,38,38,.10);
      border-color:rgba(220,38,38,.32);
    }

    .main{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns: 260px 380px 1fr;
      gap:12px;
    }
    .pane{
      border:1px solid var(--bd);
      background: linear-gradient(180deg, var(--pane-bg), var(--pane-bg2));
      border-radius:16px;
      box-shadow: var(--shadow);
      overflow:hidden;
      min-height:0;
      display:flex;
      flex-direction:column;
    }
    .head{
      padding:12px 12px 10px;
      border-bottom:1px solid rgba(148,163,184,.14);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .ttl{ font-weight:1000; font-size:13px; }
    .muted{ color:var(--muted); font-size:12px; line-height:1.35; }
    .scroll{ overflow:auto; min-height:0; }

    .group{ padding:10px 10px 0; }
    .gtitle{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 4px 8px; }
    .badge{
      font-size:11px;
      font-weight:1000;
      color:rgba(226,232,240,.92);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(148,163,184,.18);
      padding:3px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    .folder{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid rgba(148,163,184,.14);
      background:rgba(255,255,255,.02);
      border-radius:14px;
      padding:10px 10px;
      cursor:pointer;
      margin-bottom:8px;
    }
    .folder:hover{ background:var(--rowHover); }
    .folder.active{
      border-color: color-mix(in srgb, var(--accent,#19c37d) 45%, transparent);
      background: color-mix(in srgb, var(--accent,#19c37d) 10%, transparent);
    }
    .fname{ font-weight:1000; font-size:12px; }
    .fmeta{ font-size:11px; color:var(--muted); }

    .rows{ padding:0; display:block; }
    .row{
      border-bottom:1px solid rgba(148,163,184,.12);
      background:transparent;
      border-radius:0;
      padding:10px 12px;
      cursor:pointer;
    }
    .row:hover{ background:var(--rowHover); }
    .row.active{
      background: color-mix(in srgb, var(--accent,#19c37d) 12%, transparent);
      outline: 1px solid color-mix(in srgb, var(--accent,#19c37d) 38%, transparent);
      outline-offset: -1px;
    }
    .r1{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .from{ font-weight:1000; font-size:12px; max-width: 260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .date{ font-size:11px; color:var(--muted); white-space:nowrap; }
    .subj{ margin-top:4px; font-weight:950; font-size:12px; }
    .prev{ margin-top:6px; font-size:12px; color:rgba(226,232,240,.85); opacity:.9; line-height:1.35; }
    .chips{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .chip{
      font-size:10px;
      font-weight:1000;
      background:var(--chip);
      border:1px solid rgba(148,163,184,.16);
      color:rgba(226,232,240,.92);
      padding:3px 8px;
      border-radius:999px;
      white-space:nowrap;
    }
    .chip.ok{ background: color-mix(in srgb, var(--accent,#19c37d) 14%, transparent); border-color: color-mix(in srgb, var(--accent,#19c37d) 40%, transparent); }
    .chip.warn{ background: rgba(234,179,8,.12); border-color: rgba(234,179,8,.35); }

    .viewer{ padding:12px; display:flex; flex-direction:column; gap:10px; min-height:0; }
    .viewer h2{ margin:0; font-size:16px; font-weight:1000; }
    .meta{ display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; font-weight:850; }
    .body{
      border:1px solid rgba(148,163,184,.14);
      background:rgba(255,255,255,.02);
      border-radius:14px;
      padding:12px;
      white-space:pre-wrap;
      line-height:1.4;
      overflow:auto;
      min-height:120px;
      max-height: 42vh;
    }
    details{
      border:1px solid rgba(148,163,184,.14);
      background:rgba(255,255,255,.02);
      border-radius:14px;
      padding:10px 12px;
    }
    summary{ cursor:pointer; font-weight:950; color:rgba(226,232,240,.92); }
    textarea{
      width:100%;
      min-height:140px;
      resize:vertical;
      border-radius:16px;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(15,26,43,.55);
      color:inherit;
      padding:10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size:12px;
      line-height:1.35;
      outline:none;
    }
    .actions{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .leftActions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .rightActions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto; }
    .toggle{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(255,255,255,.03);
      font-weight:950;
      font-size:12px;
      color:rgba(226,232,240,.92);
      user-select:none;
    }
    .toggle input{ width:16px; height:16px; }

    .toast{
      position:fixed;
      right:16px;
      bottom:16px;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(10,16,22,.92);
      color:rgba(226,232,240,.95);
      border-radius:14px;
      padding:10px 12px;
      font-weight:950;
      font-size:12px;
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      opacity:0;
      transform: translateY(8px);
      pointer-events:none;
      transition: all .16s ease;
      z-index:9999;
    }
    .toast.show{ opacity:1; transform: translateY(0); }

    @media (max-width: 1240px){
      .main{ grid-template-columns: 280px 1fr; grid-template-rows: 360px 1fr; }
      .viewerPane{ grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div>
          <div class="title">Correo (GIA)</div>
          <div class="sub" id="syncInfo">Listo</div>
        </div>
      </div>

      <div class="search">
        <input id="q" type="text" placeholder="Buscar (asunto, remitente, contenido)..." autocomplete="off" />
        <div class="hint" id="scopeHint">Ventas · Todas</div>
      </div>

      <button class="btn" id="btnCompose" type="button">Nuevo</button>
      <button class="btn" id="btnReload" type="button">Sincronizar</button>
    </header>

    <main class="main">
      <aside class="pane">
        <div class="head">
          <div>
            <div class="ttl">Inboxes</div>
            <div class="muted">Ventas y Pagos (por marca)</div>
          </div>
        </div>
        <div class="scroll" style="padding-bottom:10px">
          <div class="group">
            <div class="gtitle">
              <div class="ttl">Ventas</div>
              <span class="badge" id="cntSales">0</span>
            </div>
            <div id="foldersSales"></div>
          </div>
          <div class="group">
            <div class="gtitle">
              <div class="ttl">Pagos</div>
              <span class="badge" id="cntPay">0</span>
            </div>
            <div id="foldersPay"></div>
          </div>
        </div>
      </aside>

      <section class="pane">
        <div class="head">
          <div>
            <div class="ttl">Bandeja</div>
            <div class="muted" id="listHint">Selecciona una marca</div>
          </div>
          <button class="btn" id="btnClear" type="button">Limpiar</button>
        </div>
        <div class="scroll">
          <div class="rows" id="msgRows"></div>
        </div>
      </section>

      <section class="pane viewerPane">
        <div class="head">
          <div>
            <div class="ttl">Lectura</div>
            <div class="muted">Draft + envío + aprendizaje</div>
          </div>
          <button class="btn primary" id="btnSend" type="button" disabled>Enviar</button>
        </div>
        <div class="viewer scroll" id="viewer">
          <div class="muted">Selecciona un correo para leerlo y responder.</div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    window.addEventListener("message", (ev) => {
      if (ev.data?.type === "theme"){
        document.documentElement.classList.toggle("light", ev.data.mode === "light");
      }
    });

    const qs = (s, el=document)=> el.querySelector(s);
    function esc(s){
      return String(s ?? "").replace(/[&<>"']/g, (c)=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
      }[c]));
    }
    function toast(msg){
      const t = qs("#toast");
      t.textContent = String(msg||"");
      t.classList.add("show");
      clearTimeout(t._tm);
      t._tm = setTimeout(()=>t.classList.remove("show"), 2200);
    }

    const API_BASE = (() => {
      try{
        const host = String(location.hostname||"").toLowerCase();
        const isLocal = host === "127.0.0.1" || host === "localhost";
        return isLocal ? "" : "/crm";
      }catch(_){ return ""; }
    })();
    function apiURL(u){
      const s = String(u||"");
      if (!s) return s;
      if (s.startsWith("/crm/")) return s;
      if (s.startsWith("/")) return API_BASE + s;
      return API_BASE + "/" + s;
    }
    function getToken(){
      return (
        localStorage.getItem("token") ||
        localStorage.getItem("gd_token") ||
        localStorage.getItem("access_token") ||
        localStorage.getItem("jwt") ||
        sessionStorage.getItem("token") ||
        sessionStorage.getItem("gd_token") ||
        sessionStorage.getItem("access_token") ||
        sessionStorage.getItem("jwt") ||
        ""
      );
    }
    function authHeaders(extra={}){
      const t = getToken();
      return t ? { ...extra, Authorization: `Bearer ${t}` } : extra;
    }
    async function apiJSON(u, opts={}){
      const r = await fetch(apiURL(u), { ...opts, headers: authHeaders(opts.headers || {}) });
      const txt = await r.text();
      let data = null;
      try{ data = txt ? JSON.parse(txt) : null; }catch(_){ data = txt; }
      if (!r.ok){
        throw new Error((data && data.detail) ? String(data.detail) : (`HTTP ${r.status}`));
      }
      return data;
    }

    const KIND_LABEL = {
      "lead":"Lead",
      "purchase":"OC",
      "payment":"Pago",
      "form":"Formulario",
      "other":"Otro",
      "general":"Otro"
    };
    function kindChip(kind){
      const k = String(kind||"other").toLowerCase();
      const label = KIND_LABEL[k] || "Otro";
      const cls = (k==="payment") ? "warn" : ((k==="lead"||k==="purchase") ? "ok" : "");
      return `<span class="chip ${cls}">${esc(label)}</span>`;
    }
    function boolChip(label, ok){
      return `<span class="chip ${ok ? "ok":"warn"}">${esc(label)}</span>`;
    }

    let accounts = [];
    let brands = [];
    let active = { inbox_type: "sales", id_marca: null, marca: "Todas" };
    let items = [];
    let activeMsgId = null;
    let activeMessage = null;
    const INIT = (() => {
      const p = new URLSearchParams(location.search || "");
      const it = String(p.get("inbox_type") || "").trim().toLowerCase();
      const midRaw = String(p.get("id_marca") || "").trim();
      const openRaw = String(p.get("open_msg") || "").trim();
      const mid = (/^\d+$/.test(midRaw)) ? Number(midRaw) : null;
      const openMsg = (/^\d+$/.test(openRaw)) ? Number(openRaw) : null;
      return {
        inbox_type: (it === "payments" || it === "sales") ? it : null,
        id_marca: mid,
        open_msg: openMsg
      };
    })();

    function setScopeHint(){
      const it = active.inbox_type === "payments" ? "Pagos" : "Ventas";
      qs("#scopeHint").textContent = `${it} · ${active.marca || "Todas"}`;
    }

    function renderFolders(){
      const listBrands = Array.isArray(brands) ? brands : [];
      qs("#cntSales").textContent = String(listBrands.length);
      qs("#cntPay").textContent = String(listBrands.length);

      function foldersHTML(list, inboxType){
        const allActive = active.inbox_type===inboxType && !active.id_marca;
        const allRow = `
          <div class="folder ${allActive ? "active":""}" data-it="${esc(inboxType)}" data-mid="">
            <div>
              <div class="fname">Todas</div>
              <div class="fmeta">${inboxType==="payments" ? "Pagos detectados por correo" : "Ver todas las marcas"}</div>
            </div>
          </div>
        `;
        const rows = list.map(a=>{
          const isActive = (active.inbox_type===inboxType && String(active.id_marca||"")===String(a.id_marca||""));
          return `
            <div class="folder ${isActive ? "active":""}" data-it="${esc(inboxType)}" data-mid="${esc(a.id_marca)}" data-marca="${esc(a.marca||"")}">
              <div>
                <div class="fname">${esc(a.marca||"Marca")}</div>
                <div class="fmeta">${esc(a.account_email||"")}</div>
              </div>
            </div>
          `;
        }).join("");
        return allRow + rows;
      }

      qs("#foldersSales").innerHTML = foldersHTML(listBrands, "sales");
      qs("#foldersPay").innerHTML = foldersHTML(listBrands, "payments");

      document.querySelectorAll("[data-it][data-mid]").forEach(el=>{
        el.addEventListener("click", async ()=>{
          active.inbox_type = String(el.getAttribute("data-it")||"sales");
          const mid = String(el.getAttribute("data-mid")||"").trim();
          active.id_marca = mid ? Number(mid) : null;
          active.marca = String(el.getAttribute("data-marca")||"Todas") || "Todas";
          activeMsgId = null;
          activeMessage = null;
          setScopeHint();
          renderFolders();
          await loadInbox({ sync:false });
        });
      });
    }

    function renderList(){
      const host = qs("#msgRows");
      if (!items.length){
        host.innerHTML = `<div class="muted" style="padding:10px">Sin correos (o falta sincronizar).</div>`;
        return;
      }
      host.innerHTML = items.map(it=>{
        const isActive = String(it.id_msg)===String(activeMsgId);
        const dt = it.received_at || it.created_at || "";
        const from = (it.from_name || it.from_email || "—").trim();
        const subj = (it.subject || "(Sin asunto)");
        const kind = it.kind || "other";
        const replied = !!it.reply_sent;
        return `
          <div class="row ${isActive ? "active":""}" data-id="${esc(it.id_msg)}">
            <div class="r1">
              <div class="from">${esc(from)}</div>
              <div class="date">${esc(String(dt).slice(0,16).replace("T"," "))}</div>
            </div>
            <div class="subj">${esc(subj)}</div>
            <div class="prev">${esc(it.preview||"")}</div>
            <div class="chips">
              ${kindChip(kind)}
              ${boolChip(replied ? "Respondido" : "Pendiente", replied)}
            </div>
          </div>
        `;
      }).join("");

      host.querySelectorAll("[data-id]").forEach(el=>{
        el.addEventListener("click", async ()=>{
          activeMsgId = Number(el.getAttribute("data-id")||0) || null;
          renderList();
          await openMessage(activeMsgId);
        });
      });
    }

    function renderViewerEmpty(){
      qs("#btnSend").disabled = true;
      qs("#viewer").innerHTML = `<div class="muted">Selecciona un correo para leerlo y responder.</div>`;
    }

    function composeHTML(){
      const optsBrands = (brands || []).map(b => `<option value="${esc(b.id_marca)}" ${String(active.id_marca||"")===String(b.id_marca) ? "selected":""}>${esc(b.marca||"Marca")}</option>`).join("");
      const it = (active.inbox_type === "payments") ? "payments" : "sales";
      return `
        <div>
          <h2>Nuevo correo</h2>
          <div class="meta">
            <div><b>Modo:</b> Composer</div>
            <div class="muted">Tip: selecciona marca + tipo, redacta y envía. Con “Aprender” se guarda plantilla.</div>
          </div>
        </div>

        <div class="actions" style="margin-top:6px">
          <div class="leftActions">
            <label class="toggle" title="Marca">
              <span style="opacity:.85">Marca</span>
              <select id="cmpMarca" style="margin-left:8px;padding:6px 10px;border-radius:10px;border:1px solid rgba(148,163,184,.18);background:rgba(15,26,43,.45);color:inherit;font-weight:950">
                ${optsBrands}
              </select>
            </label>
            <label class="toggle" title="Tipo de inbox">
              <span style="opacity:.85">Inbox</span>
              <select id="cmpInbox" style="margin-left:8px;padding:6px 10px;border-radius:10px;border:1px solid rgba(148,163,184,.18);background:rgba(15,26,43,.45);color:inherit;font-weight:950">
                <option value="sales" ${it==="sales"?"selected":""}>Ventas</option>
                <option value="payments" ${it==="payments"?"selected":""}>Pagos</option>
              </select>
            </label>
          </div>
          <div class="rightActions">
            <label class="toggle" title="Guardar como plantilla activa para la marca + tipo">
              <input type="checkbox" id="cmpLearn" checked />
              Aprender
            </label>
            <label class="toggle" title="Tipo para aprendizaje">
              <span style="opacity:.85">Tipo</span>
              <select id="cmpKind" style="margin-left:8px;padding:6px 10px;border-radius:10px;border:1px solid rgba(148,163,184,.18);background:rgba(15,26,43,.45);color:inherit;font-weight:950">
                <option value="lead">Lead</option>
                <option value="purchase">OC</option>
                <option value="payment">Pago</option>
                <option value="other" selected>Otro</option>
              </select>
            </label>
          </div>
        </div>

        <div class="body" style="max-height:none">
          <div class="ttl" style="margin-bottom:8px">Para</div>
          <input id="cmpTo" type="email" placeholder="cliente@empresa.com" style="width:100%;padding:10px 12px;border-radius:14px;border:1px solid rgba(148,163,184,.18);background:rgba(15,26,43,.35);color:inherit;font-weight:950;outline:none" />
          <div class="ttl" style="margin:12px 0 8px">Asunto</div>
          <input id="cmpSubj" type="text" placeholder="Asunto..." style="width:100%;padding:10px 12px;border-radius:14px;border:1px solid rgba(148,163,184,.18);background:rgba(15,26,43,.35);color:inherit;font-weight:950;outline:none" />
          <div class="ttl" style="margin:12px 0 8px">Mensaje</div>
          <textarea id="cmpText" placeholder="Escribe el correo..."></textarea>
          <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap">
            <button class="btn" id="cmpCancel" type="button">Cancelar</button>
            <button class="btn primary" id="cmpSend" type="button">Enviar</button>
          </div>
        </div>
      `;
    }

    function openComposer(){
      activeMsgId = null;
      activeMessage = null;
      qs("#btnSend").disabled = true;
      qs("#viewer").innerHTML = composeHTML();

      const btnCancel = qs("#cmpCancel");
      const btnSend = qs("#cmpSend");
      if (btnCancel){
        btnCancel.addEventListener("click", ()=>{
          renderViewerEmpty();
        });
      }
      if (btnSend){
        btnSend.addEventListener("click", async ()=>{
          const idMarca = Number(qs("#cmpMarca")?.value || 0) || null;
          const inboxType = String(qs("#cmpInbox")?.value || "sales");
          const toEmail = String(qs("#cmpTo")?.value || "").trim();
          const subj = String(qs("#cmpSubj")?.value || "").trim();
          const text = String(qs("#cmpText")?.value || "").trim();
          const learn = !!qs("#cmpLearn")?.checked;
          const kind = String(qs("#cmpKind")?.value || "other");

          if (!idMarca){ toast("Selecciona marca"); return; }
          if (!toEmail || !toEmail.includes("@")){ toast("Email destino inválido"); return; }
          if (!subj){ toast("Falta asunto"); return; }
          if (!text){ toast("Falta mensaje"); return; }

          btnSend.disabled = true;
          try{
            await apiJSON(`/gia/email/compose/send`, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body: JSON.stringify({ id_marca: idMarca, inbox_type: inboxType, to_email: toEmail, subject: subj, text, learn, kind })
            });
            toast("Correo enviado");
            renderViewerEmpty();
          }catch(e){
            toast(`Error: ${e.message||e}`);
          }finally{
            btnSend.disabled = false;
          }
        });
      }
    }

    function viewerHTML(msg){
      const subj = msg.subject || "(Sin asunto)";
      const fromName = msg.from_name || "";
      const fromEmail = msg.from_email || "";
      const dt = msg.received_at || msg.created_at || "";
      const kind = String(msg.kind || "other").toLowerCase();
      const kindLbl = KIND_LABEL[kind] || "Otro";
      const body = msg.body_text || "";
      const draft = msg.draft_text || "";
      const replied = !!msg.reply_sent;
      const suggestLead = !!msg.suggest_create_lead;
      const leadId = msg.lead_id || null;

      return `
        <div>
          <h2>${esc(subj)}</h2>
          <div class="meta">
            <div><b>De:</b> ${esc(fromName)} ${fromEmail ? `&lt;${esc(fromEmail)}&gt;` : ""}</div>
            <div><b>Fecha:</b> ${esc(String(dt).slice(0,19).replace("T"," "))}</div>
            <div><b>Tipo:</b> ${esc(kindLbl)}</div>
            <div><b>Inbox:</b> ${esc(msg.inbox_type || active.inbox_type)}</div>
            ${leadId ? `<div><b>Lead:</b> #${esc(leadId)}</div>` : ``}
          </div>
        </div>

        <div class="body">${esc(body)}</div>
        <details>
          <summary>Ver contenido completo (raw)</summary>
          <div class="body" style="max-height:22vh;margin-top:10px">${esc(body)}</div>
        </details>

        <div class="actions">
          <div class="leftActions">
            ${suggestLead ? `<button class="btn" id="btnCreateLead">Crear lead</button>` : ``}
            ${leadId ? `<button class="btn" id="btnOpenLead">Abrir lead</button>` : ``}
            ${replied ? `<span class="badge">Respondido</span>` : `<span class="badge">Pendiente</span>`}
          </div>
          <div class="rightActions">
            <label class="toggle" title="Guardar esta respuesta como plantilla activa para la marca + tipo">
              <input type="checkbox" id="learn" checked />
              Aprender
            </label>
          </div>
        </div>

        <div>
          <div class="ttl" style="margin-bottom:8px">Respuesta (draft)</div>
          <textarea id="draft" placeholder="Escribe la respuesta...">${esc(draft)}</textarea>
          <div class="muted" style="margin-top:6px">Tip: ajusta el draft y presiona “Enviar”. Quedará como plantilla (si está activado “Aprender”).</div>
        </div>
      `;
    }

    async function loadAccounts(){
      qs("#syncInfo").textContent = "Cargando cuentas...";
      try{
        const st = await apiJSON("/gia/email/status");
        accounts = (st.items || []).map(x=>({ ...x, inbox_type: String(x.inbox_type || "sales").toLowerCase() }));
        // brands únicos por id_marca (sirve para mostrar siempre Ventas/Pagos aunque sea la misma casilla)
        const map = new Map();
        accounts.forEach(a=>{
          const mid = a.id_marca;
          if (!mid) return;
          if (!map.has(String(mid))){
            map.set(String(mid), { id_marca: mid, marca: a.marca, account_email: a.account_email });
          }
        });
        brands = [...map.values()];
        qs("#syncInfo").textContent = st.configured ? "Listo" : "No configurado (ver servidor)";
      }catch(e){
        qs("#syncInfo").textContent = "Error";
        accounts = [];
        brands = [];
      }
      renderFolders();
      setScopeHint();
    }

    async function loadInbox({sync=false}={}){
      if (!accounts.length){
        qs("#listHint").textContent = "Configura cuentas en el servidor";
        items = [];
        renderList();
        renderViewerEmpty();
        return;
      }
      setScopeHint();
      qs("#listHint").textContent = "Cargando...";
      const mid = active.id_marca ? `&id_marca=${encodeURIComponent(active.id_marca)}` : "";
      const it = `inbox_type=${encodeURIComponent(active.inbox_type || "sales")}`;
      const q = String(qs("#q").value||"").trim();
      const qParam = q ? `&q=${encodeURIComponent(q)}` : "";

      try{
        if (sync){
          qs("#syncInfo").textContent = "Sincronizando IMAP...";
          // Sync: siempre sincroniza la(s) cuenta(s) del usuario/marca, no depende de inbox_type.
          const rs = await apiJSON(`/gia/email/sync?${mid.replace(/^&/,"")}${mid ? "&" : ""}limit=60`, { method:"POST" });
          const errs = (rs.errors || []).filter(Boolean);
          if (errs.length){
            qs("#syncInfo").textContent = `Sincronizado (errores: ${errs.length})`;
          }else{
            qs("#syncInfo").textContent = "Sincronizado";
          }
        }
      }catch(e){
        qs("#syncInfo").textContent = "Error al sincronizar";
      }

      try{
        const data = await apiJSON(`/gia/email/inbox?${it}${mid}${qParam}&limit=80&offset=0`);
        items = data.items || [];
        qs("#listHint").textContent = `Mostrando ${items.length} correo(s)`;
      }catch(e){
        qs("#listHint").textContent = "Error al cargar bandeja";
        items = [];
      }
      renderList();
      if (activeMsgId){
        const exists = items.some(x => String(x.id_msg)===String(activeMsgId));
        if (!exists){
          activeMsgId = null;
          renderViewerEmpty();
        }
      }
    }

    async function openMessage(id){
      if (!id){
        renderViewerEmpty();
        return;
      }
      qs("#btnSend").disabled = true;
      qs("#viewer").innerHTML = `<div class="muted">Cargando...</div>`;
      try{
        const data = await apiJSON(`/gia/email/inbox/${encodeURIComponent(id)}`);
        activeMessage = data.message || null;
        if (!activeMessage){
          renderViewerEmpty();
          return;
        }
        qs("#viewer").innerHTML = viewerHTML(activeMessage);
        qs("#btnSend").disabled = false;

        const btnCreateLead = qs("#btnCreateLead");
        if (btnCreateLead){
          btnCreateLead.addEventListener("click", async ()=>{
            btnCreateLead.disabled = true;
            try{
              const out = await apiJSON(`/gia/email/inbox/${encodeURIComponent(id)}/create_lead`, { method:"POST" });
              toast(`Lead creado: #${out.id_lead}`);
              await loadInbox({sync:false});
              await openMessage(id);
            }catch(e){
              toast(`No pude crear lead: ${e.message||e}`);
            }finally{
              btnCreateLead.disabled = false;
            }
          });
        }
        const btnOpenLead = qs("#btnOpenLead");
        if (btnOpenLead){
          btnOpenLead.addEventListener("click", ()=>{
            const leadId = activeMessage?.lead_id;
            if (!leadId) return;
            try{
              // panel.js intercepta esto en el iframe principal; acá dejamos la URL para que el usuario copie si necesita.
              window.parent?.postMessage?.({ type:"openLead", id_lead: leadId }, "*");
              toast("Abriendo lead...");
            }catch(_){
              toast("No pude abrir lead desde Tools");
            }
          });
        }
      }catch(e){
        qs("#viewer").innerHTML = `<div class="muted">Error: ${esc(e.message||e)}</div>`;
      }
    }

    async function sendActive(){
      if (!activeMsgId) return;
      const ta = qs("#draft");
      const learn = qs("#learn");
      const txt = ta ? String(ta.value||"").trim() : "";
      if (!txt){
        toast("Escribe la respuesta");
        return;
      }
      qs("#btnSend").disabled = true;
      try{
        await apiJSON(`/gia/email/inbox/${encodeURIComponent(activeMsgId)}/send`, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ text: txt, learn: !!(learn && learn.checked) })
        });
        toast("Correo enviado");
        await loadInbox({sync:false});
        await openMessage(activeMsgId);
      }catch(e){
        toast(`Error al enviar: ${e.message||e}`);
      }finally{
        qs("#btnSend").disabled = false;
      }
    }

    // Events
    qs("#btnCompose").addEventListener("click", openComposer);
    qs("#btnReload").addEventListener("click", ()=> loadInbox({sync:true}));
    qs("#btnClear").addEventListener("click", ()=>{
      qs("#q").value = "";
      loadInbox({sync:false});
    });
    qs("#btnSend").addEventListener("click", sendActive);
    qs("#q").addEventListener("keydown", (ev)=>{
      if (ev.key === "Enter"){
        ev.preventDefault();
        loadInbox({sync:false});
      }
    });

    // Init
    (async ()=>{
      await loadAccounts();
      // apply deep-link (si existe)
      if (INIT.inbox_type) active.inbox_type = INIT.inbox_type;
      if (INIT.id_marca) active.id_marca = INIT.id_marca;
      if (active.id_marca){
        const found = accounts.find(a => String(a.inbox_type||"sales")===String(active.inbox_type) && String(a.id_marca||"")===String(active.id_marca));
        active.marca = found?.marca || active.marca;
      }
      setScopeHint();
      renderFolders();
      renderViewerEmpty();
      // default: ventas + todas
      await loadInbox({sync:false});
      if (INIT.open_msg){
        activeMsgId = INIT.open_msg;
        renderList();
        await openMessage(activeMsgId);
      }
    })();
  </script>
</body>
</html>
