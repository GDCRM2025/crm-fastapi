<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/web/styles.css" />
  <link rel="stylesheet" href="/web/ui_overrides.css" />
  <title>Tools · Correo</title>
  <style>
    :root{
      --bd: rgba(148,163,184,.18);
      --muted: rgba(148,163,184,.88);
      --pane: rgba(8,18,28,.55);
    }
    html,body{height:100%;}
    body{ margin:0; padding:14px; background:transparent; color:inherit; font-family:inherit; }
    .layout{
      height: calc(100% - 0px);
      display:grid;
      grid-template-columns: 220px 320px 1fr;
      gap:12px;
      min-height:0;
    }
    .pane{
      border:1px solid var(--bd);
      background: linear-gradient(135deg, rgba(8,18,28,.78), rgba(10,16,22,.46));
      border-radius:18px;
      box-shadow: 0 18px 40px rgba(0,0,0,.14);
      overflow:hidden;
      min-height:0;
      display:flex;
      flex-direction:column;
    }
    .head{
      padding:12px 12px 10px;
      border-bottom:1px solid rgba(148,163,184,.14);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .ttl{ font-weight:1000; font-size:14px; }
    .muted{ color:var(--muted); font-size:12px; line-height:1.35; }
    .btn{
      border:1px solid rgba(148,163,184,.18);
      background:rgba(255,255,255,.04);
      color:inherit;
      border-radius:12px;
      padding:8px 10px;
      font-weight:950;
      cursor:pointer;
      font-size:12px;
      white-space:nowrap;
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }
    .btn.primary{
      background:color-mix(in srgb, var(--accent, #19c37d) 16%, transparent);
      border-color:color-mix(in srgb, var(--accent, #19c37d) 40%, transparent);
    }
    .list{ padding:10px; display:grid; gap:8px; overflow:auto; }
    .item{
      border:1px solid rgba(148,163,184,.14);
      background:rgba(255,255,255,.03);
      border-radius:14px;
      padding:10px 10px;
      cursor:pointer;
    }
    .item:hover{ background:rgba(255,255,255,.06); }
    .item.active{ border-color: color-mix(in srgb, var(--accent,#19c37d) 45%, transparent); background: color-mix(in srgb, var(--accent,#19c37d) 10%, transparent); }
    .row1{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .from{ font-weight:1000; font-size:12px; }
    .date{ font-size:11px; color:var(--muted); white-space:nowrap; }
    .subj{ margin-top:4px; font-weight:950; font-size:12px; }
    .prev{ margin-top:6px; font-size:12px; color:rgba(226,232,240,.85); opacity:.9; line-height:1.35; }
    .viewer{ padding:12px; overflow:auto; }
    .viewer h2{ margin:0; font-size:16px; font-weight:1000; }
    .meta{ margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12px; font-weight:850; }
    .body{ margin-top:12px; padding:12px; border:1px solid rgba(148,163,184,.14); background:rgba(255,255,255,.03); border-radius:16px; white-space:pre-wrap; line-height:1.4; }
    .reply{ margin-top:12px; display:grid; gap:10px; }
    textarea{
      width:100%;
      min-height:130px;
      resize:vertical;
      border-radius:16px;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(15,26,43,.55);
      color:inherit;
      padding:10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size:12px;
      line-height:1.35;
      outline:none;
    }
    @media (max-width: 1120px){
      .layout{ grid-template-columns: 220px 1fr; grid-template-rows: 280px 1fr; }
      .viewerPane{ grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="pane">
      <div class="head">
        <div>
          <div class="ttl">Marcas</div>
          <div class="muted">Inbox por marca (IMAP)</div>
        </div>
      </div>
      <div class="list" id="folders"></div>
    </aside>

    <section class="pane">
      <div class="head">
        <div>
          <div class="ttl">Bandeja</div>
          <div class="muted">Recarga: sincroniza IMAP + auto-respuesta.</div>
        </div>
        <button class="btn" id="btnReload" type="button">Recargar</button>
      </div>
      <div class="list" id="msgList"></div>
    </section>

    <section class="pane viewerPane">
      <div class="head">
        <div>
          <div class="ttl">Mensaje</div>
          <div class="muted">Lectura + respuesta en el mismo lugar.</div>
        </div>
        <button class="btn primary" id="btnSend" type="button" disabled>Enviar (pronto)</button>
      </div>
      <div class="viewer" id="viewer">
        <div class="muted">Selecciona un mensaje de la lista para ver y responder.</div>
      </div>
    </section>
  </div>

  <script>
    window.addEventListener("message", (ev) => {
      if (ev.data?.type === "theme"){
        document.documentElement.classList.toggle("light", ev.data.mode === "light");
      }
    });

    const qs = (s, el=document)=> el.querySelector(s);
    function esc(s){ return String(s||"").replace(/[&<>\"']/g, (c)=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#39;\"}[c])); }

    const API_BASE = (() => {
      try{
        const host = String(location.hostname||"").toLowerCase();
        const isLocal = host === "127.0.0.1" || host === "localhost";
        return isLocal ? "" : "/crm";
      }catch(_){ return ""; }
    })();
    function apiURL(u){
      const s = String(u||"");
      if (!s) return s;
      if (s.startsWith("/crm/")) return s;
      if (s.startsWith("/")) return API_BASE + s;
      return API_BASE + "/" + s;
    }
    function getToken(){
      return (
        localStorage.getItem("token") ||
        localStorage.getItem("gd_token") ||
        sessionStorage.getItem("token") ||
        sessionStorage.getItem("gd_token") ||
        ""
      );
    }
    function authHeaders(extra={}){
      const t = getToken();
      return t ? { ...extra, Authorization: `Bearer ${t}` } : extra;
    }
    async function apiJSON(u, opts={}){
      const r = await fetch(apiURL(u), { ...opts, headers: authHeaders(opts.headers || {}) });
      const txt = await r.text();
      let data = null;
      try{ data = txt ? JSON.parse(txt) : null; }catch(_){ data = txt; }
      if (!r.ok){
        throw new Error((data && data.detail) ? String(data.detail) : (`HTTP ${r.status}`));
      }
      return data;
    }

    let brands = [];
    let activeMarca = null;
    let activeMsgId = null;
    let inboxItems = [];

	    function renderBrands(){
	      const host = qs("#folders");
	      if (!brands.length){
	        host.innerHTML = `
	          <div class="item active">
	            <div class="subj">Sin cuentas configuradas</div>
	            <div class="prev muted">Configura <b>GIA_EMAIL_ACCOUNTS_JSON</b> en el servidor (<code>~/crm/.env</code>) y reinicia Passenger.</div>
	            <div class="prev muted" style="margin-top:8px">
	              Ejemplo (rellena password):<br>
	              <code style="display:block;white-space:pre-wrap;margin-top:6px;opacity:.9">
GIA_EMAIL_ACCOUNTS_JSON=[{"marca":"GOURMET","from_email":"ventas@...","username":"ventas@...","password":"***","imap_host":"mail...","imap_port":993,"imap_ssl":true,"smtp_host":"mail...","smtp_port":465,"smtp_ssl":true}]
	              </code>
	            </div>
	          </div>
	        `;
	        return;
	      }
      host.innerHTML = brands.map(b => `
        <div class="item ${String(b.id_marca)===String(activeMarca) ? "active":""}" data-mid="${esc(b.id_marca)}">
          <div class="subj">${esc(b.marca || "Marca")}</div>
          <div class="prev muted">${esc(b.account_email || "")}</div>
        </div>
      `).join("");
      host.querySelectorAll("[data-mid]").forEach(el => {
        el.addEventListener("click", async ()=>{
          activeMarca = Number(el.getAttribute("data-mid") || 0) || null;
          activeMsgId = null;
          renderBrands();
          await loadInbox({ sync:false });
        });
      });
    }

    function renderList(){
      const host = qs("#msgList");
      if (!inboxItems.length){
        host.innerHTML = `<div class="muted" style="padding:10px">Sin mensajes.</div>`;
        return;
      }
      host.innerHTML = inboxItems.map(m => `
        <div class="item ${Number(m.id_msg)===Number(activeMsgId) ? "active":""}" data-id="${esc(m.id_msg)}">
          <div class="row1">
            <div class="from">${esc(m.from_name || m.from_email || "—")}</div>
            <div class="date">${esc(String(m.received_at || m.created_at || "").slice(0,16).replace("T"," "))}</div>
          </div>
          <div class="subj">${esc(m.subject || "(sin asunto)")}</div>
          <div class="prev">${esc(m.preview || "")}${(m.ack_sent ? " · ✓ Auto-reply" : "")}</div>
        </div>
      `).join("");
      host.querySelectorAll("[data-id]").forEach(el => {
        el.addEventListener("click", async ()=>{
          activeMsgId = Number(el.getAttribute("data-id") || 0);
          renderList();
          await loadViewer();
        });
      });
    }

    async function loadViewer(){
      const v = qs("#viewer");
      const btn = qs("#btnSend");
      if (!activeMsgId){
        v.innerHTML = `<div class="muted">Selecciona un mensaje de la lista para ver y responder.</div>`;
        btn.disabled = true;
        return;
      }
      btn.disabled = true;
      v.innerHTML = `<div class="muted">Cargando…</div>`;
      try{
        const r = await apiJSON(`/gia/email/inbox/${activeMsgId}`);
        const m = r?.message || {};
        const body = (m.body_text || "").trim() || "(sin cuerpo)";
        v.innerHTML = `
          <h2>${esc(m.subject || "(sin asunto)")}</h2>
          <div class="meta">
            <div>De: ${esc(m.from_name || "")} &lt;${esc(m.from_email || "")}&gt;</div>
            <div>${esc(String(m.received_at || m.created_at || "").slice(0,19).replace("T"," "))}</div>
            <div>${m.ack_sent ? "✓ Auto-reply" : "—"}</div>
          </div>
          <div class="body">${esc(body)}</div>
          <div class="reply">
            <div class="muted">Responder:</div>
            <textarea id="replyBox" placeholder="Escribe tu respuesta..."></textarea>
          </div>
        `;
        btn.disabled = false;
      }catch(err){
        v.innerHTML = `<div class="muted">Error: ${esc(String(err?.message||err))}</div>`;
        btn.disabled = true;
      }
    }

    async function loadStatus(){
      const st = await apiJSON("/gia/email/status");
      brands = Array.isArray(st?.items) ? st.items : [];
      if (!activeMarca && brands.length){
        activeMarca = Number(brands[0].id_marca || 0) || null;
      }
      renderBrands();
    }

    async function loadInbox({ sync }){
      const host = qs("#msgList");
      host.innerHTML = `<div class="muted" style="padding:10px">Cargando…</div>`;
      try{
        if (sync && activeMarca){
          await apiJSON(`/gia/email/sync?id_marca=${encodeURIComponent(String(activeMarca))}`, { method:"POST" });
        }
        const r = await apiJSON(`/gia/email/inbox?id_marca=${encodeURIComponent(String(activeMarca||\"\"))}&limit=60&offset=0`);
        inboxItems = Array.isArray(r?.items) ? r.items : [];
        renderList();
        await loadViewer();
      }catch(err){
        inboxItems = [];
        host.innerHTML = `<div class="muted" style="padding:10px">Error: ${esc(String(err?.message||err))}</div>`;
      }
    }

    qs("#btnReload").addEventListener("click", async ()=>{
      await loadInbox({ sync:true });
    });
    qs("#btnSend").addEventListener("click", async ()=>{
      try{
        const textBody = (qs("#replyBox")?.value || "").trim();
        if (!textBody) return alert("Escribe una respuesta.");
        qs("#btnSend").disabled = true;
        await apiJSON(`/gia/email/inbox/${activeMsgId}/reply`, {
          method:"POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ text: textBody })
        });
        alert("Enviado.");
      }catch(err){
        alert("No pude enviar: " + String(err?.message||err));
      }finally{
        qs("#btnSend").disabled = false;
      }
    });

    (async ()=>{
      try{
        await loadStatus();
        await loadInbox({ sync:false });
      }catch(err){
        qs("#msgList").innerHTML = `<div class="muted" style="padding:10px">Error: ${esc(String(err?.message||err))}</div>`;
      }
    })();
  </script>
</body>
</html>
