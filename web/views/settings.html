<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Settings</title>
  <script src="../js/iframe-theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .swal2-container{ z-index: 20000 !important; }
    :root{
      --bg:#07131F; --surface:#0C1B2B; --surface2:#102235; --border:#22384F;
      --text:#EAF2FF; --muted:#A9BBD2; --accent:#19C37D; --shadow:0 10px 30px rgba(0,0,0,.35);
      --r:16px;
    }
    :root.light{
      --bg:#F6F9FF; --surface:#FFFFFF; --surface2:#F2F6FF; --border:#D5E1F3;
      --text:#0A1B2B; --muted:#56708D; --shadow:0 10px 30px rgba(10,27,43,.10);
    }
    html,body{height:100%; background:transparent; color:var(--text); font-family: ui-sans-serif, system-ui;}
    *{box-sizing:border-box;}
    .wrap{height:100%; padding:16px;}
    .panel{
      height:100%;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--r);
      padding:14px;
      box-shadow:var(--shadow);
      overflow:auto;
    }
    .head{
      display:flex; align-items:center; gap:10px;
      padding-bottom:10px; border-bottom:1px solid var(--border);
    }
    .title{font-weight:1000;}
    .muted{color:var(--muted); font-weight:800;}
    .search{
      margin-left:auto;
      display:flex; align-items:center; gap:8px;
      border:1px solid var(--border);
      background:var(--surface2);
      padding:8px 12px;
      border-radius:999px;
      min-width:260px;
    }
    .search input{flex:1;border:0;outline:none;background:transparent;color:var(--text);font-weight:800;}
    .btn{
      border:1px solid var(--border);
      background:var(--surface2);
      color:var(--text);
      padding:9px 12px;
      border-radius:12px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn.primary{background:rgba(25,195,125,.12); border-color:rgba(25,195,125,.45);}
    table{width:100%; border-collapse:separate; border-spacing:0; font-size:13px; margin-top:12px;}
    thead th{
      position:sticky; top:0;
      background:var(--surface);
      border-bottom:1px solid var(--border);
      color:var(--muted);
      text-align:left;
      padding:10px;
      font-weight:900;
      white-space:nowrap;
    }
    tbody td{
      padding:10px;
      border-bottom:1px solid rgba(34,56,79,.35);
      font-weight:800;
      vertical-align:top;
    }
    tbody tr:hover{background:rgba(25,195,125,.06); cursor:pointer;}
    .actions{white-space:nowrap;}
    .tag{display:inline-flex; border:1px solid var(--border); background:var(--surface2); padding:3px 8px; border-radius:999px; color:var(--muted); font-weight:900; font-size:12px;}
    .gd-pager{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; flex-direction:column; text-align:center; }
    .gd-pages{ display:flex; align-items:center; gap:8px; }
    .gd-page-btn{
      display:flex; align-items:center; justify-content:center;
      width:44px; height:44px; border-radius:12px;
      border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text);
      cursor:pointer; transition:transform .08s ease, background .2s ease, color .2s ease;
    }
    .gd-page-btn:hover{ background:rgba(255,255,255,.12); }
    .gd-page-btn.active{ background:#22c55e; color:#062315; border-color:transparent; }
    .gd-page-btn:disabled{ opacity:.5; cursor:default; }
    .gd-page-select{ padding:8px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.25); color:inherit; }

    /* Modal */
    .mask{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:18px; z-index:9999;}
    .mask.show{display:flex;}
    .modal{width:min(920px,96vw); max-height:92vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:16px;}
    .modalHead{display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--border);}
    .modalTitle{font-weight:1000;}
    .close{margin-left:auto; width:34px;height:34px;border-radius:12px; border:1px solid var(--border); background:var(--surface2); cursor:pointer; font-weight:1000; color:var(--muted);}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
    .gridUsers{
      display:grid;
      grid-template-columns: 1.15fr 1.15fr .9fr;
      gap:10px;
      margin-top:12px;
      align-items:start;
    }
    .field{border:1px solid var(--border); background:var(--surface2); border-radius:14px; padding:10px;}
    .label{font-weight:900; font-size:12px; color:var(--muted); margin-bottom:6px;}
    input,select,textarea{width:100%; border:0; outline:none; background:transparent; color:var(--text); font-weight:800;}
    textarea{min-height:90px; resize:vertical;}
    .rowBtns{display:flex; gap:10px; justify-content:flex-end; margin-top:12px;}
    .hint{color:var(--muted); font-weight:800; font-size:12px; margin-top:6px;}

    /* Toggle */
    .toggleRow{display:flex; align-items:center; gap:10px;}
    .toggle{
      width:48px; height:28px; border-radius:999px;
      border:1px solid var(--border); background:var(--surface);
      position:relative; cursor:pointer;
    }
    .toggle i{
      position:absolute; top:3px; left:3px;
      width:22px;height:22px; border-radius:999px;
      background:var(--muted);
      transition:.18s ease;
    }
    .toggle.on{border-color:rgba(25,195,125,.45); background:rgba(25,195,125,.08);}
    .toggle.on i{left:23px; background:var(--accent);}

    /* Color picker */
    .colorRow{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
    .ink{
      width:32px;height:32px;border-radius:12px;
      border:1px solid var(--border); background:var(--surface);
      display:inline-flex;align-items:center;justify-content:center;
      cursor:pointer;
    }
    .sw{width:22px;height:22px;border-radius:999px;border:1px solid var(--border); cursor:pointer;}
    .sw.sel{outline:3px solid rgba(25,195,125,.35);}
    /* Avatars */
    .avatar-grid{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px;}
    .avatar-item{
      border:1px solid var(--border); background:var(--surface); border-radius:12px;
      padding:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:.12s ease;
    }
    .avatar-item:hover{transform:translateY(-1px); border-color:rgba(25,195,125,.45);}
    .avatar-item.active{outline:3px solid rgba(25,195,125,.35); border-color:rgba(25,195,125,.45);}
    .avatar-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
    .avatar-item{ width:44px; height:44px; border-radius:14px; }
    .avatar-item img{width:30px;height:30px;border-radius:12px; display:block;}
    .avcell{width:28px;height:28px;border-radius:999px; display:block; border:1px solid var(--border);}

    .pill{
      display:inline-flex; align-items:center; gap:6px;
      border:1px solid var(--border); border-radius:999px;
      padding:6px 10px; background:var(--surface); font-weight:900;
      color:var(--text); min-height:34px;
    }
    .cred-box{
      border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(25,195,125,.08), rgba(15,23,42,.0));
      border-radius:14px; padding:10px;
    }
    .cred-box input{
      border:1px solid var(--border);
      background:var(--surface);
      padding:8px 10px;
      border-radius:10px;
    }
    .brand-grid{display:flex; gap:10px; flex-wrap:wrap;}
    .brand-item{
      display:flex; align-items:center; gap:8px;
      border:1px solid var(--border); background:var(--surface);
      padding:6px 10px; border-radius:999px; font-weight:900;
      cursor:pointer;
    }
    .brand-item input{width:auto; margin:0;}
    .truncate{max-width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="head">
      <div class="title" id="title">Settings</div>
      <span class="muted" id="subtitle"></span>

      <div class="search">
        🔎 <input id="q" placeholder="Buscar..." />
      </div>

      <div class="search" style="min-width:260px" title="Ordenar">
        <span style="font-weight:900;opacity:.8">⇅</span>
        <select id="sortCol" style="flex:1;border:0;outline:none;background:transparent;color:var(--text);font-weight:900"></select>
        <button class="btn" id="sortDir" type="button" style="padding:7px 10px;border-radius:999px">↓</button>
      </div>

      <button class="btn primary" id="btnAdd">+ Crear</button>
      <button class="btn" id="btnReload">Recargar</button>
      <button class="btn" id="btnPwdReq" style="display:none;">Solicitudes clave</button>
      <button class="btn" id="btnPwdAdmin" style="display:none;">Cambiar clave (Admin)</button>
      <button class="btn" id="btnMore" style="display:none">Cargar más</button>
    </div>

    <table>
      <thead>
        <tr id="th"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>

    <div id="pager" style="margin-top:12px;"></div>
    <div class="muted" id="empty" style="margin-top:12px; font-weight:900;"></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle" id="mTitle"></div>
      <button class="close" id="mClose">✕</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<script>
  window.addEventListener("message", (ev) => {
    if (ev.data?.type === "theme") {
      document.documentElement.classList.toggle("light", ev.data.mode === "light");
    }
  });

  // El CRM corre bajo /crm (Passenger). En prod hay vistas que pueden abrirse como /web/...
  // Así que NO dependemos de pathname, sino del hostname.
  const API = (() => {
    try{
      const h = String(location.hostname || "").toLowerCase();
      const isLocal = (h === "localhost" || h === "127.0.0.1");
      return isLocal ? "" : "/crm";
    }catch(_){
      return "";
    }
  })();
  let token = "";
  try{
    token = window.parent?.GD?.getToken?.()
      || window.top?.GD?.getToken?.()
      || window.top?.localStorage?.getItem("token")
      || window.top?.sessionStorage?.getItem("token")
      || window.top?.localStorage?.getItem("gd_token")
      || window.top?.sessionStorage?.getItem("gd_token")
      || localStorage.getItem("token")
      || sessionStorage.getItem("token")
      || localStorage.getItem("gd_token")
      || sessionStorage.getItem("gd_token")
      || "";
  }catch(_){
    token = localStorage.getItem("token") || sessionStorage.getItem("token") || "";
  }
  if (!token){
    Swal.fire({
      icon: "warning",
      title: "Sesión requerida",
      text: "Tu sesión expiró. Vuelve a iniciar sesión.",
      confirmButtonText: "Ir a login"
    }).then(() => {
      const loginURL = (API || "") + "/web/login.html";
      try{ window.top.location.href = loginURL; }
      catch(_){ location.href = loginURL; }
    });
  }
  const qs = (s, el=document)=>el.querySelector(s);

  async function copyText(text){
    const t = String(text || "");
    if (!t) return false;
    try{
      await navigator.clipboard.writeText(t);
      return true;
    }catch(_){}
    try{
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return !!ok;
    }catch(_){}
    return false;
  }

  async function api(path, opts={}){
    const r = await fetch(API + path, {
      ...opts,
      headers: {
        "Content-Type":"application/json",
        ...(opts.headers||{}),
        ...(token ? {"Authorization":"Bearer " + token} : {}),
      }
    });
    let data=null;
    try{ data = await r.json(); }catch(e){}
    if(!r.ok){
      const msg = (data && (data.detail || data.message)) ? (data.detail || data.message) : ("HTTP " + r.status);
      throw new Error(msg);
    }
    return data;
  }

  function openModal(title, html){
    qs("#mTitle").textContent = title;
    qs("#mBody").innerHTML = html;
    qs("#mask").classList.add("show");
  }
  function closeModal(){
    qs("#mask").classList.remove("show");
    qs("#mBody").innerHTML = "";
  }
  qs("#mClose").onclick = closeModal;
  qs("#mask").addEventListener("click", (ev)=>{ if(ev.target.id==="mask") closeModal(); });

  const params = new URLSearchParams(location.search);
  const entity = (params.get("entity") || "usuarios").trim();
  let meUser = null;

  const state = {
    meta:null,
    items:[],
    q:"",
    filterMarca:"",
    sortCol:"",
    sortDir:"desc",
    offset:0,
    page:1,
    pageSize:25,
    total:null,
    activeOnly:true
  };

  let cachedMarcas = null;
  // Avatares por rol (más "semánticos") + fallback a set genérico.
  const ROLE_AVATAR = {
    "ADMIN": "/web/images/avatars/role-admin.svg",
    "SUPERADMIN": "/web/images/avatars/role-admin.svg",
    "EJECUTIVO DE VENTAS": "/web/images/avatars/role-ventas.svg",
    "JEFE DE OPERACIONES": "/web/images/avatars/role-ops.svg",
    "OPERACIONES": "/web/images/avatars/role-ops.svg",
    "BODEGUERO": "/web/images/avatars/role-bodega.svg",
    "COMPRAS": "/web/images/avatars/role-compras.svg",
    "CONDUCTOR": "/web/images/avatars/role-conductor.svg",
    "CHOFER": "/web/images/avatars/role-conductor.svg",
    "OPERADOR": "/web/images/avatars/role-operador.svg",
    "MICE": "/web/images/avatars/role-mice.svg",
  };
  const AVATAR_CHOICES_GENERIC = Array.from({length:12}, (_,i)=>`/web/images/avatars/avatar-${String(i+1).padStart(2,"0")}.svg`);
  const AVATAR_CHOICES = [
    ...Object.values(ROLE_AVATAR),
    ...AVATAR_CHOICES_GENERIC,
  ].filter((v,i,a)=>v && a.indexOf(v)===i);

  function prettyLabel(name){
    if (!name) return "";
    const words = name.replace(/_/g, " ").split(" ");
    return words.map(w => w ? (w[0].toUpperCase() + w.slice(1).toLowerCase()) : "").join(" ");
  }
  function colLabel(col){
    return col.label || prettyLabel(col.column_name);
  }

  function orderColumns(cols){
    if (entity !== "usuarios") return cols;
    // ID primero, luego nombre. (Activo se maneja en el formulario, no en la tabla)
    const preferred = ["id_usuario","nombre","avatar_url","email","username","telefono","rol","cargo"];
    const map = new Map(cols.map(c => [c.column_name, c]));
    const out = [];
    for (const p of preferred){
      if (map.has(p)){
        out.push(map.get(p));
        map.delete(p);
      }
    }
    for (const c of cols){
      if (map.has(c.column_name)) out.push(c);
    }
    return out;
  }

  async function getMarcas(){
    if (cachedMarcas) return cachedMarcas;
    try{
      const r = await api("/catalogos");
      cachedMarcas = r.marcas || r.catalogos?.marcas || [];
    }catch(_){
      cachedMarcas = [];
    }
    return cachedMarcas;
  }

  function marcaLabel(m){
    return String(m?.marca || m?.nombre || "").trim();
  }

  function normMarcaKey(s){
    return String(s || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "");
  }

  function isPrivilegedRole(role){
    const r = (role || "").toUpperCase();
    return (
      r.includes("ADMIN") ||
      r.includes("OPERACIONES") ||
      r.includes("JEFE DE OPERACIONES") ||
      r.includes("COMPRAS") ||
      r.includes("BODEGUERO") ||
      r.includes("MICE")
    );
  }

  async function getAllowedMarcasForProductos(){
    // Para productos, la lista de marcas debe ser dinámica (marcas nuevas deben aparecer).
    const marcas = await getMarcas();
    const all = (marcas || []).map(m => marcaLabel(m)).filter(Boolean);
    if (!meUser) return all.map(x=>String(x).toUpperCase());
    if (isPrivilegedRole(meUser.role || meUser.rol)) return all.map(x=>String(x).toUpperCase());

    const ids = Array.isArray(meUser.marcas) ? meUser.marcas.map(Number).filter(n=>Number.isFinite(n)) : [];
    if (!ids.length) return [];
    const idset = new Set(ids);
    return (marcas || [])
      .filter(m => idset.has(Number(m.id_marca)))
      .map(m => String(marcaLabel(m)).toUpperCase())
      .filter(Boolean);
  }

  function roleCode(role){
    const r = (role || "").toUpperCase();
    const map = {
      "ADMIN": "adm",
      "SUPERADMIN": "adm",
      "EJECUTIVO DE VENTAS": "ejv",
      "VENDEDOR": "ven",
      "JEFE DE OPERACIONES": "ops",
      "BODEGUERO": "bod",
      "COMPRAS": "cmp",
      "CONDUCTOR": "cond",
      "OPERADOR": "op",
      "MICE": "mice",
    };
    return map[r] || "usr";
  }

  function slugify(s){
    return (s || "")
      .toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "")
      .toLowerCase();
  }

  let pwdReq = [];

  // Para la tabla (lista) ocultamos columnas que ensucian.
  function isHiddenList(col){
    if (entity === "usuarios" && col === "is_active") return true;
    return false;
  }
  // Para el formulario (crear/editar) podemos seguir mostrando más cosas si hace falta.
  function isHiddenForm(col){
    return false;
  }

  function fmtMoney(v){
    try{
      return new Intl.NumberFormat("es-CL", {style:"currency", currency:"CLP", maximumFractionDigits:0}).format(Number(v||0));
    }catch(e){ return v; }
  }

  function normStr(v){
    return String(v || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function _parseSortVal(raw){
    const s0 = String(raw ?? "").replace(/\u00A0/g," ").trim();
    if (!s0) return { t:"s", v:"" };
    const s = s0.replace(/\s+/g," ").trim();
    // dd/mm/yyyy
    const m1 = s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?$/);
    if (m1){
      const dd=Number(m1[1]), mm=Number(m1[2]), yy=Number(m1[3]);
      const hh=Number(m1[4]||0), mi=Number(m1[5]||0);
      return { t:"n", v: Date.UTC(yy,mm-1,dd,hh,mi,0) };
    }
    // yyyy-mm-dd
    const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/);
    if (m2){
      const yy=Number(m2[1]), mm=Number(m2[2]), dd=Number(m2[3]);
      const hh=Number(m2[4]||0), mi=Number(m2[5]||0);
      return { t:"n", v: Date.UTC(yy,mm-1,dd,hh,mi,0) };
    }
    const sNum = s.replace(/[^\d.,-]/g,"");
    if (sNum && /[\d]/.test(sNum)){
      let n = sNum;
      const lastDot = n.lastIndexOf(".");
      const lastComma = n.lastIndexOf(",");
      if (lastDot >= 0 && lastComma >= 0){
        const dec = Math.max(lastDot, lastComma);
        const intPart = n.slice(0, dec).replace(/[.,]/g, "");
        const decPart = n.slice(dec + 1).replace(/[.,]/g, "");
        n = intPart + "." + decPart;
      } else if (lastComma >= 0 && lastDot < 0){
        n = n.replace(/\./g, "").replace(",", ".");
      } else {
        n = n.replace(/,/g, "");
      }
      const v = Number(n);
      if (Number.isFinite(v)) return { t:"n", v };
    }
    return { t:"s", v: s.toLowerCase() };
  }

  function render(){
    const th = qs("#th");
    const body = qs("#body");
    const q = normStr(state.q || "");
    const cols = orderColumns((state.meta?.columns || []).filter(c=>!isHiddenList(c.column_name)));

    th.innerHTML = cols.map(c=>`<th>${colLabel(c)}</th>`).join("") + `<th>Acciones</th>`;
    body.innerHTML = "";

    let items = q ? state.items.filter(r=>{
      const s = normStr(JSON.stringify(r));
      return s.includes(q);
    }) : state.items;

    // Orden explícito (no depende de click en headers).
    const sc = String(state.sortCol || "").trim();
    const dir = (String(state.sortDir || "desc") === "asc") ? 1 : -1;
    if (sc){
      const pairs = items.map((r, idx)=>({ r, idx, k:_parseSortVal(r?.[sc]) }));
      pairs.sort((a,b)=>{
        if (a.k.t === "n" && b.k.t === "n"){
          if (a.k.v === b.k.v) return a.idx - b.idx;
          return (a.k.v < b.k.v ? -1 : 1) * dir;
        }
        const av = String(a.k.v), bv = String(b.k.v);
        if (av === bv) return a.idx - b.idx;
        return (av < bv ? -1 : 1) * dir;
      });
      items = pairs.map(p=>p.r);
    }

    if (entity === "productos" && state.filterMarca){
      const sel = String(state.filterMarca || "");
      const selNorm = normStr(sel);
      items = items.filter(r => {
        const idm = r.id_marca ?? r.marca_id ?? "";
        if (String(idm) === sel) return true;
        const nm = r.marca || r.nombre_marca || (state.marcasMap ? state.marcasMap.get(String(idm)) : "") || "";
        return normStr(nm).includes(selNorm);
      });
    }

    for(const row of items){
      const tr = document.createElement("tr");
      tr.innerHTML = cols.map(c=>{
        const name = c.column_name;
        let v = row[name];
        let cls = "";
        if(entity==="productos" && (name==="costo" || name==="monto_costo")) v = fmtMoney(v);
        if(entity==="comunas" && (name==="neto" || name==="bruto")) v = fmtMoney(v);
        if(entity==="productos" && name==="descripcion") cls = "class=\"truncate\"";
        if(entity==="usuarios" && name==="avatar_url" && v){
          return `<td><img class="avcell" src="${String(v)}" alt="avatar"></td>`;
        }
        if(entity==="estados_lead" && name==="color" && v){
          return `<td><span class="tag" style="border-color:${v}; color:${v}">${v}</span></td>`;
        }
        return `<td ${cls}>${(v===null||v===undefined) ? "" : String(v)}</td>`;
      }).join("") + `
        <td class="actions">
          <span class="tag" data-act="edit">Editar</span>
          <span class="tag" data-act="del">Eliminar</span>
        </td>
      `;

      tr.addEventListener("click", (ev)=>{
        const act = ev.target.closest("[data-act]")?.dataset?.act;
        if(act==="edit") return openEdit(row);
        if(act==="del") return doDelete(row);
        openEdit(row);
      });

      body.appendChild(tr);
    }

    qs("#empty").textContent = items.length ? "" : "No hay registros.";
    renderPager();
  }

  function renderPager(){
    const holder = qs("#pager");
    if (!holder) return;
    const total = state.total ?? state.items.length;
    const totalPages = Math.max(1, Math.ceil((total || 0) / state.pageSize));
    if (total <= state.pageSize && state.page <= 1){
      holder.innerHTML = "";
      return;
    }
    holder.innerHTML = `
      <div class="gd-pager">
        <div class="muted">Página ${state.page} / ${totalPages}</div>
        <div class="gd-pages">
          <button class="gd-page-btn" id="prevPage">‹</button>
          <button class="gd-page-btn" id="nextPage">›</button>
          <select id="pageSize" class="gd-page-select">
            ${[10,25,50,100].map(n => `<option value="${n}" ${n===state.pageSize?"selected":""}>${n}</option>`).join("")}
          </select>
        </div>
      </div>
    `;
    qs("#prevPage")?.addEventListener("click", () => {
      if (state.page > 1){ state.page--; load(false); }
    });
    qs("#nextPage")?.addEventListener("click", () => {
      if (state.page < totalPages){ state.page++; load(false); }
    });
    qs("#pageSize")?.addEventListener("change", (e) => {
      state.pageSize = Number(e.target.value || 25);
      state.page = 1;
      load(false);
    });
  }

  function _normText(s){
    return (s || "")
      .toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
  }

  async function fetchAll({ limit, qParam }){
    const all = [];
    let offset = 0;
    const maxItems = 5000;
    while (true){
      const res = await api(`/settings/${entity}?limit=${limit}&offset=${offset}&active_only=${state.activeOnly ? "true":"false"}${qParam}`);
      const items = res.items || [];
      all.push(...items);
      if (items.length < limit) break;
      offset += limit;
      if (offset >= maxItems) break;
    }
    return all;
  }

  async function load(reset=true){
    state.meta = await api(`/settings/meta/${entity}`);
    qs("#title").textContent = `Settings · ${entity}`;
    qs("#subtitle").textContent = `Tabla: ${state.meta.table}`;

    // Setup sort UI
    try{
      const cols = orderColumns((state.meta?.columns || []).filter(c=>!isHiddenList(c.column_name)));
      const sel = qs("#sortCol");
      if (sel){
        const prev = String(state.sortCol || "");
        sel.innerHTML = `<option value="">(sin ordenar)</option>` + cols.map(c=>`<option value="${c.column_name}">${colLabel(c)}</option>`).join("");
        // default para usuarios: push_ok
        if (entity === "usuarios" && !prev){
          const hasPushOk = cols.some(c=>c.column_name==="push_ok");
          state.sortCol = hasPushOk ? "push_ok" : "";
          state.sortDir = "desc";
        }
        sel.value = String(state.sortCol || "");
      }
      const btnDir = qs("#sortDir");
      if (btnDir){
        btnDir.textContent = (String(state.sortDir || "desc") === "asc") ? "↑" : "↓";
      }
    }catch(_){}

    const hasActive = (state.meta?.columns || []).some(c=>c.column_name==="is_active");
    state.activeOnly = hasActive ? true : false;

    if (reset){
      state.items = [];
      state.offset = 0;
      state.page = 1;
    }
    const isSearch = !!(state.q && state.q.trim());
    const isFilterMarca = !!(state.filterMarca && String(state.filterMarca).trim());
    const limit = 200;
    state.offset = (state.page - 1) * state.pageSize;
    const qParam = isSearch ? `&q=${encodeURIComponent(state.q.trim())}` : "";
    let items = [];
    if (isSearch || isFilterMarca){
      // En Usuarios, al buscar queremos incluir inactivos para evitar choques "duplicate email" invisibles.
      if (entity === "usuarios") state.activeOnly = false;
      items = await fetchAll({ limit, qParam });
      if (entity === "usuarios") state.activeOnly = true;
    } else {
      const res = await api(`/settings/${entity}?limit=${Math.min(limit, state.pageSize || 25)}&offset=${state.offset}&active_only=${state.activeOnly ? "true":"false"}`);
      items = res.items || [];
      state.total = res.total ?? state.total;
    }
    if (entity === "productos" && isFilterMarca){
      const fmName = String(state.filterMarca || "").trim();
      const fmNorm = _normText(fmName);
      items = items.filter(it => {
        const nm = it.marca || it.nombre_marca || it.brand || "";
        return _normText(nm).includes(fmNorm);
      });
    }
    state.items = items;
    if (isSearch || isFilterMarca){
      state.total = items.length;
      state.page = 1;
    }
    render();
    const more = qs("#btnMore");
    if (more) more.style.display = "none";

    if (entity === "usuarios"){
      try{
        const r = await api(`/auth/password-requests`);
        pwdReq = r.items || [];
        const btn = qs("#btnPwdReq");
        if (btn){
          btn.style.display = "";
          btn.textContent = `Solicitudes clave (${pwdReq.length})`;
        }
        const btnAdmin = qs("#btnPwdAdmin");
        if (btnAdmin){
          btnAdmin.style.display = "";
        }
      }catch(_){}
    }
  }

  // wire sort ui (idempotente)
  try{
    qs("#sortCol")?.addEventListener("change", (ev)=>{
      state.sortCol = String(ev?.target?.value || "");
      render();
    });
    qs("#sortDir")?.addEventListener("click", ()=>{
      state.sortDir = (String(state.sortDir||"desc") === "asc") ? "desc" : "asc";
      const btnDir = qs("#sortDir");
      if (btnDir) btnDir.textContent = (state.sortDir === "asc") ? "↑" : "↓";
      render();
    });
  }catch(_){}

  function buildField(col, row, mode){
    const name = col.column_name;
    const type = col.data_type;
    const ui = col.ui || {};
    const palette = ui.palette || ["#3b82f6","#06b6d4","#a855f7","#22c55e","#ef4444","#f59e0b","#64748b","#0f172a"];
    const label = col.label || prettyLabel(name);

    const val = (row && row[name] !== undefined && row[name] !== null) ? row[name] : "";

    if (entity === "usuarios" && name === "cargo"){
      return `
        <div class="field">
          <div class="label">${label}</div>
          <div class="pill" id="cargo_display">—</div>
          <input type="hidden" id="f_${name}" value="${String(val).replaceAll('"','&quot;')}" />
        </div>
      `;
    }

    if (entity === "usuarios" && name === "avatar_url"){
      const current = String(val || "");
      return `
        <div class="field" style="grid-column:3/4">
          <div class="label">Avatar</div>
          <div class="avatar-grid" id="avatarGrid"></div>
          <input type="hidden" id="f_avatar_url" value="${current.replaceAll('"','&quot;')}" />
          <div class="hint">Selecciona un avatar o deja el default por rol.</div>
        </div>
      `;
    }

    // is_active -> toggle (oculta campo)
    if(name === "is_active"){
      const on = (val === true || val === "true" || val === 1 || val === "1");
      return `
        <div class="field">
          <div class="label">${label}</div>
          <div class="toggleRow">
            <div class="toggle ${on?"on":""}" id="t_is_active"><i></i></div>
            <div class="muted">${on ? "Activo" : "Inactivo"}</div>
          </div>
          <input type="hidden" id="f_${name}" value="${on ? "true":"false"}" />
        </div>
      `;
    }

    // color -> picker con tintero + paleta
    if(ui.widget === "color" || name === "color"){
      const current = val || "#22384F";
      const sw = palette.map(c=>`<div class="sw ${c===current?"sel":""}" data-color="${c}" style="background:${c}"></div>`).join("");
      return `
        <div class="field" style="grid-column:1/3">
          <div class="label">Color del estado</div>
          <div class="colorRow">
            <input type="color" id="f_${name}_picker" value="${current}" style="width:48px;height:32px;border:0;background:transparent;cursor:pointer;" />
            <input id="f_${name}_text" value="${current}" style="max-width:160px;border:1px solid var(--border);border-radius:10px;padding:6px 8px;background:var(--surface);" />
            <span class="tag" id="colorPreview" style="border-color:${current}; color:${current}">${current}</span>
          </div>
          <div class="colorRow" style="margin-top:10px">${sw}</div>
          <input type="hidden" id="f_${name}" value="${current}"/>
        </div>
      `;
    }

    // select fields
    if(ui.widget === "select" && ui.source){
      const source = ui.source;
      const choices = (state.meta?.choices || {})[source] || [];
      const labelField = ui.labelField || "nombre";
      const valueField = ui.valueField || "id";
      const opts = choices.map(o=>`<option value="${o[valueField]}">${o[labelField]}</option>`).join("");
      return `
        <div class="field">
          <div class="label">${label}</div>
          <select id="f_${name}" data-field="${name}">
            <option value="">—</option>
            ${opts}
          </select>
        </div>
      `;
    }

    // Productos: marca seleccionable (según usuario)
    if (entity === "productos" && name === "marca"){
      const current = String(val || "");
      // placeholder, luego lo llenamos al abrir modal (async)
      return `
        <div class="field">
          <div class="label">${label}</div>
          <select id="f_${name}" data-field="${name}">
            <option value="">Cargando...</option>
          </select>
          <div class="hint">Marca limitada por tu usuario (Admin ve todas).</div>
          <input type="hidden" id="f_${name}_cur" value="${current.replaceAll('"','&quot;')}"/>
        </div>
      `;
    }

    // textarea for big text
    if(entity === "productos" && name === "descripcion"){
      return `
        <div class="field" style="grid-column:1/3">
          <div class="label">${label}</div>
          <textarea id="f_${name}" placeholder="Descripción del producto">${String(val).replaceAll("<","&lt;")}</textarea>
        </div>
      `;
    }

    // Productos: el costo normalmente se calcula desde Recetas, así que no lo forzamos visualmente.
    if (entity === "productos" && (name === "costo" || name === "monto_costo")){
      const show = (String(val) === "0" || String(val) === "0.0") ? "" : String(val || "");
      return `
        <div class="field">
          <div class="label">${label}</div>
          <input id="f_${name}" value="${show.replaceAll('"','&quot;')}" placeholder="(opcional) se calcula por recetas" />
          <div class="hint">Si lo dejas vacío, el sistema lo actualizará cuando exista receta.</div>
        </div>
      `;
    }
    if(type === "text" && String(val).length > 120){
      return `
        <div class="field" style="grid-column:1/3">
          <div class="label">${label}</div>
          <textarea id="f_${name}">${String(val).replaceAll("<","&lt;")}</textarea>
        </div>
      `;
    }

    // default input
    return `
      <div class="field">
        <div class="label">${label}</div>
        <input id="f_${name}" value="${String(val).replaceAll('"','&quot;')}" />
      </div>
    `;
  }

  function collectForm(cols){
    const data = {};
    for(const c of cols){
      const name = c.column_name;
      if(isHiddenForm(name)) continue;
      const el = qs("#f_" + name);
      if(!el) continue;
      let v = el.value;

      // bool
      if(name==="is_active"){
        v = (v==="true");
      }
      // numeric
      if(["integer","numeric","double precision","real","bigint","smallint"].includes(c.data_type)){
        if(v === "") v = (name === "orden" ? 0 : null);
        else v = Number(v);
      }
      data[name] = v;
    }
    return data;
  }

  function validateRequired(cols, data){
    const required = cols.filter(c => c.is_nullable === "NO" && !c.column_default && c.column_name !== state.meta.pk);
    for (const c of required){
      const v = data[c.column_name];
      if (v === null || v === undefined || v === ""){
        return c.column_name;
      }
    }
    return null;
  }

  function isExecRole(role){
    const r = (role || "").toUpperCase();
    // cubre "EJECUTIVO", "EJECUTIVA", "EJECUTIVO DE VENTAS", etc.
    if (r.includes("EJECUTIV")) return true;
    if (r.includes("VENTAS") && !r.includes("ADMIN")) return true;
    return false;
  }

  function isBrandScopedRole(role){
    const r = (role || "").toUpperCase().trim();
    // SUPERADMIN ve todo (no requiere marcas).
    if (r.includes("SUPERADMIN") || r.includes("SUPER_ADMIN") || r.includes("SUPER ADMIN")) return false;
    // ADMIN debe seleccionarse por marcas.
    if (r === "ADMIN" || r === "1" || (r.includes("ADMIN") && !r.includes("SUPER"))) return true;
    // Ejecutivos/ventas.
    return isExecRole(r);
  }

  function getSelectedBrands(){
    return Array.from(document.querySelectorAll("#brandsBox input[type='checkbox']:checked"))
      .map(el => Number(el.value))
      .filter(n => Number.isFinite(n));
  }

  function setSelectedBrands(ids){
    const set = new Set((ids || []).map(n => Number(n)));
    document.querySelectorAll("#brandsBox input[type='checkbox']").forEach(el => {
      el.checked = set.has(Number(el.value));
    });
  }

    const roleSel = qs("#f_rol");
    const nameInput = qs("#f_nombre");

    if (userInput && userInput.value){
      userInput.dataset.manual = "1";

      userInput.addEventListener("input", () => {

      if (roleField && roleField.parentElement){
        roleField.parentElement.insertBefore(brandsBox, roleField.nextSibling);
      }else{
        qs("#mBody")?.appendChild(brandsBox);
      }
    }
    const grid = qs("#brandsGrid", brandsBox);
    grid.innerHTML = "";
    for (const m of marcas){
      const mid = m.id_marca || m.id || m.value;
      const label = m.nombre || m.marca || m.label || mid;
      const item = document.createElement("label");
      item.className = "brand-item";
      item.innerHTML = `<input type="checkbox" value="${mid}"><span>${label}</span>`;
      grid.appendChild(item);
    }

    if (mode === "edit" && rowId){
      try{
        const r = await api(`/users/${rowId}/brands`);
        setSelectedBrands(r.marcas || []);
      }catch(e){
        // No rompemos el formulario, pero avisamos (si falla, el ejecutivo puede quedar sin leads).
        if (window.Swal) Swal.fire("Aviso", "No pude cargar las marcas asignadas de este usuario. " + (e?.message||""), "warning");

    }

    // Avatar selector
    const gridAvatar = qs("#avatarGrid");
    if (gridAvatar && avatarInput){
      gridAvatar.innerHTML = "";
      const selectAvatar = (url) => {
        avatarInput.value = url || "";
        Array.from(gridAvatar.querySelectorAll(".avatar-item")).forEach(btn => {
          btn.classList.toggle("active", btn.dataset.avatar === url);
        });
      };
      AVATAR_CHOICES.forEach(url => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "avatar-item";
        btn.dataset.avatar = url;
        btn.innerHTML = `<img src="${url}" alt="avatar">`;
        btn.addEventListener("click", () => {
          avatarInput.dataset.manual = "1";
          selectAvatar(url);
        });
        gridAvatar.appendChild(btn);
      });
      if (avatarInput.value){
        selectAvatar(avatarInput.value);
      }
    }

    function updateAuto(){
      const roleVal = roleSel?.value || "";
      const nameVal = nameInput?.value || "";
      if (cargoInput) cargoInput.value = roleVal;
      if (cargoDisplay) cargoDisplay.textContent = roleVal || "—";

      if (userInput && userInput.dataset.manual !== "1"){
        const base = slugify(nameVal).slice(0, 10) || "user";
        userInput.value = `${roleCode(roleVal)}_${base}`;
      }

      const showBrands = isBrandScopedRole(roleVal);
      if (brandsBox){
        brandsBox.style.display = showBrands ? "" : "none";
      }

      // default avatar by role (if not manual)
      if (avatarInput && avatarInput.dataset.manual !== "1"){
        const key = (roleVal || "").toUpperCase();
        const url = ROLE_AVATAR[key] || AVATAR_CHOICES[0];
        avatarInput.value = url;
        const gridAvatar = qs("#avatarGrid");
        if (gridAvatar){
          Array.from(gridAvatar.querySelectorAll(".avatar-item")).forEach(btn => {
            btn.classList.toggle("active", btn.dataset.avatar === url);
          });
        }
      }
    }

    roleSel?.addEventListener("change", updateAuto);
    nameInput?.addEventListener("input", updateAuto);
    updateAuto();
  }

      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#$%";

    };

        const req = pwdReq[idx];
        const email = (req?.email || "").trim();
        if (!email){
          Swal.fire("Error", "La solicitud no tiene email.", "error");
          return;
        }
        try{
          const users = await findUsuarios(email);
          const u = users.find(x => String(x.email || "").toLowerCase() === email.toLowerCase()) || users[0];
          if (!u){
            Swal.fire("Sin usuario", "No encontré un usuario asociado a ese email.", "info");
            return;
          }
          Swal.close();
          await resetPwdForUserRow(u);
        }catch(e){
          Swal.fire("Error", "No pude procesar: " + (e?.message || e), "error");
        }
      });
    });
  };
  let qTimer = null;
  qs("#q").addEventListener("input", (ev)=>{
    state.q = ev.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(()=>load(true), 250);
  });

  // filtro marca para productos
  async function ensureMarcaFilter(){
    if (entity !== "productos") return;
    const head = qs(".head");
    if (!head || qs("#marcaFilter")) return;
    try{
      // Importante: este filtro debe funcionar para ejecutivos (sin acceso a Settings/Marcas).
      // Usamos /catalogos (público) y luego filtramos por marcas asignadas vía /me.
      const marcasRaw = await getMarcas();
      const allowed = await getAllowedMarcasForProductos();
      const allowedSet = new Set((allowed || []).map(s => String(s||"").toUpperCase()));
      const marcas = (marcasRaw || [])
        .filter(m => allowedSet.size ? allowedSet.has(String(marcaLabel(m)).toUpperCase()) : true);
      state.marcasMap = new Map(
        marcas.map(m => [String(m.nombre || m.marca || ""), (m.nombre || m.marca || "")])
      );
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.alignItems = "center";
      wrap.style.gap = "8px";
      wrap.innerHTML = `
        <select id="marcaFilter" class="gd-page-select" style="min-width:180px">
          <option value="">Todas las marcas</option>
          ${marcas.map(m => {
            const val = (m.nombre || m.marca || "");
            const label = (m.nombre || m.marca || "");
            return `<option value="${val}">${label}</option>`;
          }).join("")}
        </select>
      `;
      head.insertBefore(wrap, head.querySelector(".search"));
      const sel = wrap.querySelector("#marcaFilter");
      sel.addEventListener("change", (e)=>{
        const opt = e.target.selectedOptions?.[0];
        const name = opt?.value || "";
        state.filterMarca = name || "";
        load(true);
      });
    }catch(_){}
  }

  (async ()=>{
    try{ meUser = await api("/me"); }catch(_){ meUser = null; }
    try{
      // Ejecutivos/usuarios no-admin solo deben usar Settings para Productos (venta) de sus marcas.
      const roleUp = String(meUser?.role || meUser?.rol || "").toUpperCase();
      const isAdminLike = roleUp.includes("SUPERADMIN") || roleUp === "ADMIN" || roleUp.includes("ADMIN");
      if (!isAdminLike && entity !== "productos"){
        const sp = new URLSearchParams(location.search || "");
        sp.set("entity", "productos");
        location.search = sp.toString();
        return;
      }
    }catch(_){}
    try{
      await load();
      await ensureMarcaFilter();
    }catch(e){
      if (window.Swal) Swal.fire("Error", "Settings error: " + e.message, "error");
      else alert("Settings error: " + e.message);
    }
  })();
</script>
</body>
</html>
