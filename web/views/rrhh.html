<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="gd-build" content="20260423-rrhh2" />
  <title>RRHH</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <script src="/web/js/iframe-theme.js"></script>
  <style>
    body{margin:0;padding:14px;background:transparent;color:var(--text);}
    .wrap{height:calc(100vh - 28px);display:flex;flex-direction:column;gap:12px;}
    .top{
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.32);
      border-radius:18px;
      padding:12px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 22px 70px rgba(0,0,0,.18);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    :root.light .top{ background: rgba(255,255,255,.86); border-color: rgba(0,0,0,.10); }
    .left{display:flex;flex-direction:column;gap:2px;}
    .ttl{font-weight:1100; letter-spacing:.12em; text-transform:uppercase; font-size:12px;}
    .big{font-size:18px;font-weight:1200;}
    .muted{opacity:.75;font-weight:850;font-size:12px;}
    .tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
    .tab{
      height:34px;border-radius:999px;
      border:1px solid rgba(148,163,184,.22);
      background: rgba(2,6,23,.18);
      color:inherit;
      padding:0 12px;
      font-weight:1100;
      cursor:pointer;
      white-space:nowrap;
    }
    .tab.active{background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent);}
    .btn{
      height:34px;border-radius:999px;
      border:1px solid rgba(148,163,184,.22);
      background: rgba(2,6,23,.18);
      color:inherit;
      padding:0 12px;
      font-weight:1100;
      cursor:pointer;
      white-space:nowrap;
    }
    .main{
      flex:1;
      min-height:0;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.20);
      border-radius:18px;
      overflow:hidden;
      box-shadow: 0 22px 70px rgba(0,0,0,.18);
    }
    iframe{width:100%;height:100%;border:0;background:transparent;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="left">
        <div class="ttl">RRHH</div>
        <div class="big">RRHH + Reloj control</div>
        <div class="muted" id="sub">Cargando perfil…</div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="tabs">
        <button class="btn" id="btnBack" style="display:none;">Volver</button>
        <button class="btn" id="btnReload">Recargar</button>
      </div>
    </div>

    <div class="main">
      <iframe id="frame" title="RRHH"></iframe>
    </div>
  </div>

  <script>
    const qs = (s, el=document) => el.querySelector(s);
    const API_BASE = (() => {
      try{
        const h = String(location.hostname || "").toLowerCase();
        const isLocal = (h === "localhost" || h === "127.0.0.1");
        return isLocal ? "" : "/crm";
      }catch(_){ return ""; }
    })();
    function apiURL(path){
      const p = String(path || "");
      if (!p) return p;
      if (/^https?:\/\//i.test(p)) return p;
      if (!API_BASE) return p;
      return p.startsWith("/") ? (API_BASE + p) : (API_BASE + "/" + p);
    }
    function token(){ return localStorage.getItem("token") || sessionStorage.getItem("token") || ""; }
    function headers(){ return token() ? { Authorization: "Bearer " + token() } : {}; }
    function esc(s){ return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('\"',"&quot;"); }

    const V = "20260423-rrhh2";
	    const URLS = {
	      portal: `/web/views/rrhh_portal.html?v=${V}`,
	      colab: `/web/views/rrhh_colaboradores.html?v=${V}`,
	      turnos: `/web/views/rrhh_horarios.html?v=${V}`,
	      nomina: `/web/views/rrhh_nomina.html?v=${V}`,
	      marc: `/web/views/rrhh_marcaciones.html?v=${V}`,
	      sol: `/web/views/rrhh_solicitudes.html?v=${V}`,
	      desv: `/web/views/rrhh_desvios.html?v=${V}`,
	      push: `/web/views/rrhh_push.html?v=${V}`,
	      sgjo: `/web/views/rrhh_sgjo.html?v=${V}`,
	      puntos: `/web/views/rrhh_puntos.html?v=${V}`,
	    };

    const historyStack = [];
    function setFrame(url, push=true){
      const fr = qs("#frame");
      if (!fr) return;
      const next = apiURL(url);
      try{
        const cur = fr.getAttribute("src") || "";
        if (push && cur && cur !== next) historyStack.push(cur);
      }catch(_){}
      fr.setAttribute("src", next);
      qs("#btnBack").style.display = historyStack.length ? "" : "none";
    }
    qs("#btnBack").addEventListener("click", ()=>{
      const prev = historyStack.pop();
      if (prev) setFrame(prev, false);
      qs("#btnBack").style.display = historyStack.length ? "" : "none";
    });

    function isSuperRole(role){
      const r = String(role||"").toUpperCase();
      return r.includes("SUPERADMIN") || r === "ADMIN" || r.includes("FINAN") || r === "RRHH" || r.includes("RECURSOS HUMANOS");
    }
    function isManagerRole(role){
      const r = String(role||"").toUpperCase();
      return r.includes("JEFE") || r.includes("OPERACIONES") || r.includes("COMPRAS");
    }

    function buildTabs(role){
      const superRRHH = isSuperRole(role);
      const managerRRHH = isManagerRole(role);
      const tabs = [
        { id:"portal", label:"Mi portal", url: URLS.portal },
      ];
	      if (superRRHH){
	        tabs.push(
	          { id:"colab", label:"Colaboradores", url: URLS.colab },
	          { id:"nomina", label:"Nómina", url: URLS.nomina },
	          { id:"turnos", label:"Planificador", url: URLS.turnos },
	          { id:"push", label:"Notificaciones", url: URLS.push },
	          { id:"puntos", label:"Puntos + QR", url: URLS.puntos },
	          { id:"marc", label:"Marcaciones (admin)", url: URLS.marc },
	          { id:"sol", label:"Solicitudes (admin)", url: URLS.sol },
	          { id:"desv", label:"Desvíos (aprobación)", url: URLS.desv },
	        );
	      }else if (managerRRHH){
	        tabs.push(
	          { id:"turnos", label:"Planificador", url: URLS.turnos },
	          { id:"marc", label:"Marcaciones (admin)", url: URLS.marc },
	          { id:"desv", label:"Desvíos (aprobación)", url: URLS.desv },
	        );
	      }
      tabs.push({ id:"sgjo", label:"Marcar", url: URLS.sgjo });
      return tabs;
    }

    let TABS = [];
    let activeId = null;

    function openTab(id){
      const t = TABS.find(x=>x.id===id) || TABS[0];
      if (!t) return;
      activeId = t.id;
      setFrame(t.url, true);
      for (const b of Array.from(qs("#tabs").querySelectorAll("button[data-tab]"))){
        b.classList.toggle("active", b.getAttribute("data-tab") === activeId);
      }
      try{ location.hash = "#" + activeId; }catch(_){}
    }

    async function boot(){
      const r = await fetch(apiURL("/me"), { headers: headers() });
      const me = await r.json().catch(()=>({}));
      const role = me.role || me.rol || "";
      qs("#sub").textContent = `${esc(me.name || me.nombre || me.username || me.email || "Usuario")} · ${esc(String(role||"").toUpperCase() || "—")}`;
      TABS = buildTabs(role);
      qs("#tabs").innerHTML = TABS.map(t => `<button class="tab" data-tab="${esc(t.id)}">${esc(t.label)}</button>`).join("");
      for (const b of Array.from(qs("#tabs").querySelectorAll("button[data-tab]"))){
        b.addEventListener("click", ()=> openTab(b.getAttribute("data-tab")));
      }
      const hash = String(location.hash || "").replace("#","").trim();
      if (hash && TABS.some(t=>t.id===hash)) openTab(hash);
      else openTab("portal");
    }

    qs("#btnReload").addEventListener("click", ()=>{
      const fr = qs("#frame");
      try{ fr.contentWindow?.location?.reload?.(); }catch(_){ fr.src = fr.src; }
    });

    // Navegación embebida desde sub-vistas RRHH
    window.addEventListener("message", (ev)=>{
      const d = ev.data || {};
      if (d.type === "openItem" && d.url){
        setFrame(String(d.url), true);
      }
      if (d.type === "rrhh:navigate" && d.tab){
        const tab = String(d.tab);
        if (URLS[tab]) openTab(tab);
      }
    });

    boot();
  </script>
</body>
</html>
