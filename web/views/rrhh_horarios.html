<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RRHH · Horarios</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <script src="/web/js/iframe-theme.js"></script>
  <style>
    body{ margin:0; padding:18px; color:inherit; }
    .card{ border-radius:18px; padding:14px; border:1px solid rgba(255,255,255,.12); background:rgba(7,12,16,.45); }
    :root.light .card{ background:rgba(255,255,255,.75); border-color:rgba(0,0,0,.1); color:#0f172a; }
    .title{ font-weight:1000; font-size:18px; }
    .muted{ opacity:.7; font-size:12px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .inp{ height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:transparent; color:inherit; padding:0 10px; font-weight:800; min-width:200px; }
    .btn{ height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:transparent; color:inherit; padding:0 12px; cursor:pointer; font-weight:900; }
    .btn:hover{ background: rgba(255,255,255,.06); }
    table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
    th,td{ padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; white-space:nowrap; }
    th{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; }
    .table-wrap{ overflow:auto; max-height:70vh; border:1px solid rgba(255,255,255,.12); border-radius:12px; margin-top:10px; }
    .dow{ display:flex; gap:8px; flex-wrap:wrap; }
    .chk{ display:flex; gap:8px; align-items:center; font-weight:900; font-size:12px; opacity:.9; }
    .pill{ padding:4px 10px; border-radius:999px; border:1px solid rgba(148,163,184,.18); background:rgba(2,6,23,.18); font-weight:950; font-size:12px; }
  </style>
</head>
<body>
  <section class="card">
    <div class="row" style="justify-content:space-between;">
      <div>
        <div class="title">Horarios teóricos</div>
        <div class="muted">Asigna un turno a un colaborador (semanal) para comparar con marcaciones.</div>
      </div>
      <div class="row">
        <button class="btn" id="btnTurnos">Turnos</button>
        <button class="btn" id="btnReload">Actualizar</button>
      </div>
    </div>

    <div class="row" style="margin-top:12px;">
      <select class="inp" id="selStaff"><option value="">Colaborador…</option></select>
      <select class="inp" id="selTurno"><option value="">Turno…</option></select>
      <input class="inp" id="hDesde" type="date" />
      <input class="inp" id="hHasta" type="date" />
      <span class="pill">Días: si no marcas, aplica a todos</span>
    </div>
    <div class="row" style="margin-top:8px;">
      <div class="dow" id="dowBox"></div>
      <button class="btn" id="btnAsignar">Asignar</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Colaborador</th>
            <th>Turno</th>
            <th>Desde</th>
            <th>Hasta</th>
            <th>Días</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td class="muted">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    const qs = (s, el=document) => el.querySelector(s);
    const API_BASE = (() => {
      try{
        const h = String(location.hostname || "").toLowerCase();
        const isLocal = (h === "localhost" || h === "127.0.0.1");
        return isLocal ? "" : "/crm";
      }catch(_){ return ""; }
    })();
    function apiURL(path){
      const p = String(path || "");
      if (!p) return p;
      if (/^https?:\/\//i.test(p)) return p;
      if (!API_BASE) return p;
      return p.startsWith("/") ? (API_BASE + p) : (API_BASE + "/" + p);
    }
    function token(){ return localStorage.getItem("token") || sessionStorage.getItem("token") || ""; }
    function headers(){ return token() ? { Authorization: "Bearer " + token() } : {}; }
    function toast(msg){
      const t = document.createElement("div");
      t.textContent = msg;
      Object.assign(t.style,{position:"fixed",right:"16px",bottom:"16px",background:"rgba(0,0,0,.8)",color:"#fff",padding:"10px 14px",borderRadius:"10px",zIndex:99,fontWeight:"900"});
      document.body.appendChild(t);
      setTimeout(()=> t.remove(), 2400);
    }
    const DOW = [
      {k:0, n:"Lun"},
      {k:1, n:"Mar"},
      {k:2, n:"Mié"},
      {k:3, n:"Jue"},
      {k:4, n:"Vie"},
      {k:5, n:"Sáb"},
      {k:6, n:"Dom"},
    ];
    function renderDow(){
      qs("#dowBox").innerHTML = DOW.map(d => `
        <label class="chk"><input type="checkbox" data-dow="${d.k}" /> ${d.n}</label>
      `).join("");
    }
    function getDowMask(){
      const checks = Array.from(qs("#dowBox").querySelectorAll("input[type=checkbox][data-dow]")||[]);
      const sel = checks.filter(c => c.checked).map(c => Number(c.getAttribute("data-dow")));
      if (!sel.length) return null;
      let m = 0;
      for (const d of sel){ m |= (1<<d); }
      return m;
    }
    function fmtMask(m){
      if (m == null) return "Todos";
      const out = [];
      for (const d of DOW){
        if (m & (1<<d.k)) out.push(d.n);
      }
      return out.join(",");
    }

    async function loadStaff(){
      const r = await fetch(apiURL("/rrhh/staff"), { headers: headers() });
      const data = await r.json().catch(()=>({}));
      const items = data.items || [];
      qs("#selStaff").innerHTML = `<option value="">Colaborador…</option>` + items.map(s=>`<option value="${s.id_staff}">${s.colaborador || ("#"+s.id_staff)}</option>`).join("");
    }
    async function loadTurnos(){
      const r = await fetch(apiURL("/rrhh/turnos"), { headers: headers() });
      const data = await r.json().catch(()=>({}));
      const items = data.items || [];
      qs("#selTurno").innerHTML = `<option value="">Turno…</option>` + items.map(t=>`<option value="${t.id_turno}">${t.nombre} (${t.hora_entrada}-${t.hora_salida})</option>`).join("");
    }
    async function loadHorarios(){
      const r = await fetch(apiURL("/rrhh/horarios"), { headers: headers() });
      const data = await r.json().catch(()=>({}));
      const items = data.items || [];
      const staffMap = {};
      try{
        const st = await fetch(apiURL("/rrhh/staff"), { headers: headers() }).then(x=>x.json());
        (st.items||[]).forEach(s=> staffMap[String(s.id_staff)] = s.colaborador || ("#"+s.id_staff));
      }catch(_){}
      qs("#rows").innerHTML = items.map(h=>`
        <tr>
          <td><strong>${staffMap[String(h.id_staff)] || ("#"+h.id_staff)}</strong></td>
          <td>${h.turno_nombre || "—"} (${h.hora_entrada || ""}-${h.hora_salida || ""})</td>
          <td>${String(h.desde||"").slice(0,10) || "—"}</td>
          <td>${h.hasta ? String(h.hasta).slice(0,10) : "—"}</td>
          <td>${fmtMask(h.dow_mask)}</td>
        </tr>
      `).join("") || `<tr><td class="muted">Sin horarios.</td></tr>`;
    }

    qs("#btnAsignar").addEventListener("click", async ()=>{
      const payload = {
        id_staff: Number(qs("#selStaff").value || 0),
        id_turno: Number(qs("#selTurno").value || 0),
        desde: qs("#hDesde").value,
        hasta: qs("#hHasta").value || null,
        dow_mask: getDowMask(),
      };
      if (!payload.id_staff || !payload.id_turno || !payload.desde){
        toast("Falta colaborador/turno/desde");
        return;
      }
      const r = await fetch(apiURL("/rrhh/horarios"), { method:"POST", headers:{ "Content-Type":"application/json", ...headers() }, body: JSON.stringify(payload) });
      if (!r.ok){
        const t = await r.text().catch(()=> "");
        toast("Error: " + (t || r.status));
        return;
      }
      toast("Horario asignado");
      await loadHorarios();
    });

    qs("#btnReload").addEventListener("click", async ()=>{
      await loadStaff(); await loadTurnos(); await loadHorarios();
    });
    qs("#btnTurnos").addEventListener("click", ()=>{
      const base = API_BASE || "";
      window.location.href = `${base}/web/views/rrhh_turnos.html`;
    });
    renderDow();
    loadStaff(); loadTurnos(); loadHorarios();
  </script>
</body>
</html>
