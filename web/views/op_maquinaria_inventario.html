<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Operaciones · Inventario Maquinaria</title>
  <link rel="stylesheet" href="../styles.css?v=20260305-opinv4" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/iframe-theme.js"></script>
  <style>
    html,body{height:100%;margin:0;}
    body{background:transparent;padding:12px; overflow:auto;}
    .wrap{max-width: 1280px; margin:0 auto; display:flex; flex-direction:column; gap:12px;}
    .card{
      border-radius:18px;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.32);
      backdrop-filter: blur(10px);
      overflow:hidden;
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
      min-height:0;
    }
    :root.light .card{background: rgba(255,255,255,.78); border-color: rgba(0,0,0,.10);}
    .top{
      padding:12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      border-bottom:1px solid rgba(148,163,184,.16);
    }
    .ttl{font-weight:1100; letter-spacing:.12em; text-transform:uppercase; font-size:12px;}
    .sub{opacity:.72; font-weight:850; font-size:12px; margin-top:4px; max-width: 760px;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .inp, .sel{
      height:36px;border-radius:999px;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.18);
      color: var(--text);
      padding:0 12px;
      font-weight:900;
      outline:none;
    }
    .sel{ padding-right: 34px; }
    :root.light .inp, :root.light .sel{background: rgba(255,255,255,.65); color: rgba(0,0,0,.85);}
    .btn{
      height:36px;border-radius:999px;
      border:1px solid rgba(148,163,184,.20);
      background: rgba(2,6,23,.18);
      color: var(--text);
      padding:0 14px;
      font-weight:1000;
      cursor:pointer;
    }
    .btn.primary{background: color-mix(in srgb, var(--accent) 24%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent);}
    .btn.danger{border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08);}
    .btn:hover{filter:brightness(1.06);}

    .tblWrap{overflow:auto; max-height: calc(100vh - 210px); -webkit-overflow-scrolling:touch;}
    table{width:100%; border-collapse:separate; border-spacing:0; font-size:13px; min-width: 980px;}
    th{
      text-align:left;
      padding:10px 12px;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:.72;
      border-bottom:1px solid rgba(148,163,184,.16);
      position:sticky; top:0;
      background: linear-gradient(180deg, rgba(2,6,23,.70), rgba(2,6,23,.40));
      backdrop-filter: blur(10px);
      z-index:2;
      white-space:nowrap;
    }
    :root.light th{background: rgba(255,255,255,.88);}
    td{padding:10px 12px;border-bottom:1px solid rgba(148,163,184,.10); vertical-align:middle;}
    .muted{opacity:.72;font-weight:850;}
    .right{text-align:right;}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:3px 10px;border-radius:999px;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.16);
      font-weight:1000;
      font-size:12px;
      white-space:nowrap;
    }
    :root.light .pill{background: rgba(255,255,255,.65);}
    .dot{width:10px;height:10px;border-radius:999px;background:rgba(148,163,184,.55);}
    .act{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
    .mini{height:30px; padding:0 12px; border-radius:999px; font-size:12px;}

    @media (max-width: 820px){
      .inp{min-width: 180px;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="top">
        <div>
          <div class="ttl">Inventario Maquinaria (por unidad)</div>
          <div class="sub">
            Acá ves cada máquina por separado (<b>SKU automático</b> por categoría: <b>CarCla01</b>, <b>MaqPop02</b>, etc).
            Para crear muchas unidades de una categoría, usa <b>Crear unidades</b>.
          </div>
        </div>
        <div class="row">
          <input id="q" class="inp" placeholder="Buscar por nombre o SKU…" />
          <select id="cat" class="sel">
            <option value="">Todas las categorías</option>
          </select>
          <select id="st" class="sel">
            <option value="">Todos los estados</option>
            <option value="OK">OK</option>
            <option value="TALLER">TALLER</option>
            <option value="BAJA">BAJA</option>
          </select>
          <button id="btnReload" class="btn" type="button">Recargar</button>
          <button id="btnBulk" class="btn primary" type="button">Crear unidades</button>
          <button id="btnNew" class="btn" type="button">+ Nuevo</button>
        </div>
      </div>

      <div class="tblWrap">
        <table>
          <thead>
            <tr>
              <th style="width:110px">SKU</th>
              <th>Nombre</th>
              <th style="width:220px">Categoría</th>
              <th style="width:120px">Estado</th>
              <th style="width:160px">Ubicación</th>
              <th style="width:190px">Actualizado</th>
              <th style="width:160px; text-align:right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const qs = (s, el=document) => el.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[m] || m));
    const norm = (s) => (s || "").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

    const SwalX = (() => {
      try{ return window.parent?.Swal || window.Swal || null; }catch(_){ return window.Swal || null; }
    })();

    const API_BASE = (() => {
      try{
        const h = String(location.hostname || "").toLowerCase();
        const isLocal = (h === "localhost" || h === "127.0.0.1");
        return isLocal ? "" : "/crm";
      }catch(_){ return ""; }
    })();
    const apiURL = (u) => {
      const s = String(u || "");
      if (!s) return s;
      if (!API_BASE) return s.startsWith("/crm/") ? s.slice(4) : s;
      if (s.startsWith("/crm/")) return s;
      return s.startsWith("/") ? (API_BASE + s) : (API_BASE + "/" + s);
    };
    const token = () => localStorage.getItem("token") || localStorage.getItem("gd_token") || sessionStorage.getItem("token") || sessionStorage.getItem("gd_token") || "";
    const authHeaders = (h={}) => token() ? ({...h, Authorization:"Bearer " + token()}) : h;

    async function jget(url){
      const r = await fetch(apiURL(url), { headers: authHeaders() });
      const txt = await r.text();
      if (!r.ok) throw new Error(txt || ("HTTP " + r.status));
      return txt ? JSON.parse(txt) : {};
    }
    async function jpost(url, body){
      const r = await fetch(apiURL(url), { method:"POST", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify(body || {}) });
      const txt = await r.text();
      if (!r.ok) throw new Error(txt || ("HTTP " + r.status));
      return txt ? JSON.parse(txt) : {};
    }
    async function jput(url, body){
      const r = await fetch(apiURL(url), { method:"PUT", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify(body || {}) });
      const txt = await r.text();
      if (!r.ok) throw new Error(txt || ("HTTP " + r.status));
      return txt ? JSON.parse(txt) : {};
    }
    async function jdel(url){
      const r = await fetch(apiURL(url), { method:"DELETE", headers: authHeaders() });
      const txt = await r.text();
      if (!r.ok) throw new Error(txt || ("HTTP " + r.status));
      return txt ? JSON.parse(txt) : {};
    }

    const dotFor = (st) => {
      const s = String(st || "").toUpperCase();
      if (s === "OK") return "#22c55e";
      if (s === "TALLER") return "#f59e0b";
      if (s === "BAJA") return "#ef4444";
      return "rgba(148,163,184,.55)";
    };

    let CATS = [];
    let ASSETS = [];

    function buildCatSelect(){
      const sel = qs("#cat");
      const cur = String(sel.value || "");
      const opts = [`<option value="">Todas las categorías</option>`].concat(
        (CATS || []).filter(c => c?.tipo === "MAQUINARIA" || !c?.tipo).map(c => {
          const id = String(c.id_category || "");
          const label = `${String(c.code_prefix || "").trim() ? (String(c.code_prefix).trim() + " · ") : ""}${String(c.nombre || "")}`;
          return `<option value="${esc(id)}">${esc(label)}</option>`;
        })
      ).join("");
      sel.innerHTML = opts;
      if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
    }

    function render(){
      const q = norm(qs("#q")?.value || "");
      const idCat = String(qs("#cat")?.value || "");
      const st = String(qs("#st")?.value || "").toUpperCase();

      const tb = qs("#tb");
      const catMap = {};
      (CATS || []).forEach(c => { catMap[String(c.id_category)] = c; });

      const items = (ASSETS || []).filter(a => {
        if (idCat && String(a.id_category || "") !== idCat) return false;
        if (st && String(a.status || "").toUpperCase() !== st) return false;
        if (q){
          const hay = `${norm(a.nombre)} ${norm(a.code)} ${norm(a.categoria)}`;
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      tb.innerHTML = items.length ? items.map(a => {
        const code = String(a.code || "").trim() || "—";
        const stx = String(a.status || "").toUpperCase() || "OK";
        const cat = catMap[String(a.id_category || "")] || null;
        const catLabel = (cat && cat.code_prefix) ? `${cat.code_prefix} · ${cat.nombre}` : (a.categoria || "—");
        const ub = String(a.ubicacion || "").trim() || "—";
        const up = String(a.updated_at || "").replace("T"," ").replace("Z","") || "—";
        return `
          <tr>
            <td><span class="pill"><span class="dot" style="background:${dotFor(stx)}"></span>${esc(code)}</span></td>
            <td><b>${esc(a.nombre || "")}</b></td>
            <td class="muted">${esc(catLabel)}</td>
            <td><span class="pill"><span class="dot" style="background:${dotFor(stx)}"></span>${esc(stx)}</span></td>
            <td class="muted">${esc(ub)}</td>
            <td class="muted">${esc(up)}</td>
            <td style="text-align:right">
              <div class="act">
                <button class="btn mini" data-ficha="${esc(a.id_asset)}" type="button">Ficha</button>
                <button class="btn mini" data-edit="${esc(a.id_asset)}" type="button">Editar</button>
                <button class="btn mini danger" data-baja="${esc(a.id_asset)}" type="button">Baja</button>
              </div>
            </td>
          </tr>
        `;
      }).join("") : `<tr><td colspan="7" class="muted">Sin resultados.</td></tr>`;

      tb.querySelectorAll("[data-ficha]").forEach(b => b.addEventListener("click", () => {
        const id = Number(b.dataset.ficha || 0);
        if (!id) return;
        location.href = apiURL(`/web/views/op_maquinaria_ficha.html?id=${encodeURIComponent(id)}&v=20260305-opinv4`);
      }));
      tb.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => editAsset(Number(b.dataset.edit || 0))));
      tb.querySelectorAll("[data-baja]").forEach(b => b.addEventListener("click", () => bajaAsset(Number(b.dataset.baja || 0))));
    }

    async function loadAll(){
      const [cats, assets] = await Promise.all([
        jget("/assets/categories?tipo=MAQUINARIA&all=1"),
        jget("/assets?tipo=MAQUINARIA"),
      ]);
      CATS = Array.isArray(cats.items) ? cats.items : [];
      ASSETS = Array.isArray(assets.items) ? assets.items : [];
      // orden por SKU para lectura rápida
      ASSETS.sort((a,b) => String(a.code||"").localeCompare(String(b.code||""), "es"));
      buildCatSelect();
      render();
    }

    async function bulkModal(){
      if (!SwalX?.fire){
        alert("SweetAlert no disponible");
        return;
      }
      const catOpts = (CATS || []).filter(c => (c?.is_active ?? true)).map(c => {
        const id = String(c.id_category || "");
        const label = `${String(c.code_prefix||"").trim() ? (String(c.code_prefix).trim() + " · ") : ""}${String(c.nombre||"")}`;
        return `<option value="${esc(id)}">${esc(label)}</option>`;
      }).join("");
      const res = await SwalX.fire({
        title: "Crear unidades (SKUs automáticos)",
        customClass: { popup: "gd-swal gd-swal--form gd-swal--wide gd-swal--noicon" },
        width: 920,
        html: `
          <div class="gd-swal-form">
            <div class="gd-swal-lede">Crea N unidades en una categoría. Se generarán códigos secuenciales tipo <b>POP01</b>, <b>POP02</b>…</div>
            <div class="gd-swal-grid">
              <div class="gd-swal-field gd-span-2">
                <div class="gd-swal-label">Categoría</div>
                <select id="bCat" class="swal2-select">${catOpts}</select>
              </div>
              <div class="gd-swal-field">
                <div class="gd-swal-label">Cantidad</div>
                <input id="bQty" class="swal2-input" type="number" value="1" min="1" max="200" />
              </div>
              <div class="gd-swal-field">
                <div class="gd-swal-label">Nombre base</div>
                <input id="bBase" class="swal2-input" placeholder="Ej: Carrito Clásico" />
              </div>
            </div>
          </div>
        `,
        showCancelButton:true,
        confirmButtonText:"Crear",
        cancelButtonText:"Cancelar",
        didOpen: () => {
          const sel = SwalX.getPopup().querySelector("#bCat");
          const base = SwalX.getPopup().querySelector("#bBase");
          const sync = () => {
            const id = String(sel.value || "");
            const c = (CATS || []).find(x => String(x.id_category||"") === id);
            if (c && base && !base.value) base.value = String(c.nombre || "");
          };
          sel.addEventListener("change", sync);
          sync();
        },
        preConfirm: () => {
          const popup = SwalX.getPopup();
          const id_category = Number(popup.querySelector("#bCat")?.value || 0);
          const qty = Number(popup.querySelector("#bQty")?.value || 1);
          const base_name = String(popup.querySelector("#bBase")?.value || "").trim();
          if (!id_category) return SwalX.showValidationMessage("Falta categoría");
          if (!qty || qty < 1) return SwalX.showValidationMessage("Cantidad inválida");
          if (!base_name) return SwalX.showValidationMessage("Falta nombre base");
          return { id_category, qty, base_name };
        }
      });
      if (!res.isConfirmed) return;
      const out = await jpost("/assets/bulk_create", res.value);
      const n = (out.created || []).length || 0;
      await SwalX.fire("OK", `Se crearon ${n} unidades.`, "success");
      await loadAll();
    }

    async function newAssetModal(){
      if (!SwalX?.fire){
        alert("SweetAlert no disponible");
        return;
      }
      const catOpts = [`<option value="">(sin categoría)</option>`].concat(
        (CATS || []).filter(c => (c?.is_active ?? true)).map(c => {
          const id = String(c.id_category || "");
          const label = `${String(c.code_prefix||"").trim() ? (String(c.code_prefix).trim() + " · ") : ""}${String(c.nombre||"")}`;
          return `<option value="${esc(id)}">${esc(label)}</option>`;
        })
      ).join("");
      const res = await SwalX.fire({
        title: "Nuevo activo (unidad)",
        customClass: { popup: "gd-swal gd-swal--form gd-swal--wide gd-swal--noicon" },
        width: 920,
        html: `
          <div class="gd-swal-form">
            <div class="gd-swal-grid">
              <div class="gd-swal-field gd-span-2">
                <div class="gd-swal-label">Nombre</div>
                <input id="nNombre" class="swal2-input" placeholder="Ej: Carrito Clásico 31" />
              </div>
              <div class="gd-swal-field gd-span-2">
                <div class="gd-swal-label">Categoría</div>
                <select id="nCat" class="swal2-select">${catOpts}</select>
              </div>
              <div class="gd-swal-field">
                <div class="gd-swal-label">SKU (opcional)</div>
                <input id="nCode" class="swal2-input" placeholder="(vacío = auto por COD_TIPO)" />
              </div>
              <div class="gd-swal-field">
                <div class="gd-swal-label">Ubicación (opcional)</div>
                <input id="nUb" class="swal2-input" placeholder="Bodega / Taller / ..." />
              </div>
            </div>
          </div>
        `,
        showCancelButton:true,
        confirmButtonText:"Crear",
        cancelButtonText:"Cancelar",
        preConfirm: () => {
          const popup = SwalX.getPopup();
          const nombre = String(popup.querySelector("#nNombre")?.value || "").trim();
          const id_category = Number(popup.querySelector("#nCat")?.value || 0) || null;
          const code = String(popup.querySelector("#nCode")?.value || "").trim() || null;
          const ubicacion = String(popup.querySelector("#nUb")?.value || "").trim() || null;
          if (!nombre) return SwalX.showValidationMessage("Nombre requerido");
          return { nombre, id_category, code, ubicacion };
        }
      });
      if (!res.isConfirmed) return;
      await jpost("/assets", res.value);
      await loadAll();
    }

    async function editAsset(id_asset){
      const a = (ASSETS || []).find(x => Number(x.id_asset) === Number(id_asset));
      if (!a || !SwalX?.fire) return;
      const catOpts = [`<option value="">(sin categoría)</option>`].concat(
        (CATS || []).map(c => {
          const id = String(c.id_category || "");
          const label = `${String(c.code_prefix||"").trim() ? (String(c.code_prefix).trim() + " · ") : ""}${String(c.nombre||"")}`;
          const sel = (String(a.id_category||"") === id) ? "selected" : "";
          return `<option value="${esc(id)}" ${sel}>${esc(label)}</option>`;
        })
      ).join("");
      const res = await SwalX.fire({
        title: "Editar unidad",
        customClass: { popup: "gd-swal gd-swal--form gd-swal--wide gd-swal--noicon" },
        width: 980,
        html: `
          <div class="gd-swal-form">
            <div class="gd-swal-grid">
              <div class="gd-swal-field gd-span-2">
                <div class="gd-swal-label">Nombre</div>
                <input id="eNombre" class="swal2-input" value="${esc(a.nombre||"")}" />
              </div>
              <div class="gd-swal-field gd-span-2">
                <div class="gd-swal-label">Categoría</div>
                <select id="eCat" class="swal2-select">${catOpts}</select>
              </div>
              <div class="gd-swal-field">
                <div class="gd-swal-label">SKU</div>
                <input id="eCode" class="swal2-input" value="${esc(a.code||"")}" placeholder="(vacío = auto)" />
              </div>
              <div class="gd-swal-field">
                <div class="gd-swal-label">Status</div>
                <select id="eSt" class="swal2-select">
                  ${["OK","TALLER","BAJA"].map(s => `<option value="${s}" ${(String(a.status||"").toUpperCase()===s)?"selected":""}>${s}</option>`).join("")}
                </select>
              </div>
              <div class="gd-swal-field gd-span-2">
                <div class="gd-swal-label">Ubicación</div>
                <input id="eUb" class="swal2-input" value="${esc(a.ubicacion||"")}" />
              </div>
              <div class="gd-swal-field gd-span-2">
                <div class="gd-swal-label">Notas</div>
                <textarea id="eNo" style="width:100%;min-height:90px;border-radius:14px;padding:10px;font-weight:900">${esc(a.notas||"")}</textarea>
              </div>
            </div>
          </div>
        `,
        showCancelButton:true,
        confirmButtonText:"Guardar",
        cancelButtonText:"Cancelar",
        preConfirm: () => {
          const popup = SwalX.getPopup();
          const nombre = String(popup.querySelector("#eNombre")?.value || "").trim();
          if (!nombre) return SwalX.showValidationMessage("Nombre requerido");
          return {
            nombre,
            id_category: popup.querySelector("#eCat")?.value || null,
            code: String(popup.querySelector("#eCode")?.value || "").trim() || null,
            status: String(popup.querySelector("#eSt")?.value || "OK").trim(),
            ubicacion: String(popup.querySelector("#eUb")?.value || "").trim() || null,
            notas: String(popup.querySelector("#eNo")?.value || "").trim() || null,
          };
        }
      });
      if (!res.isConfirmed) return;
      await jput(`/assets/${encodeURIComponent(id_asset)}`, res.value);
      await loadAll();
    }

    async function bajaAsset(id_asset){
      if (!id_asset || !SwalX?.fire) return;
      const r = await SwalX.fire({
        title: "Dar de baja",
        text: "Esto marca la unidad como BAJA (no borra historial).",
        icon: "warning",
        showCancelButton:true,
        confirmButtonText:"Sí, BAJA",
        cancelButtonText:"Cancelar",
      });
      if (!r.isConfirmed) return;
      await jdel(`/assets/${encodeURIComponent(id_asset)}`); // soft delete => BAJA
      await loadAll();
    }

    qs("#btnReload")?.addEventListener("click", () => loadAll().catch(e => SwalX?.fire ? SwalX.fire("Error", String(e).slice(0,300), "error") : alert(String(e).slice(0,300))));
    qs("#btnBulk")?.addEventListener("click", () => bulkModal().catch(e => SwalX?.fire ? SwalX.fire("Error", String(e).slice(0,300), "error") : alert(String(e).slice(0,300))));
    qs("#btnNew")?.addEventListener("click", () => newAssetModal().catch(e => SwalX?.fire ? SwalX.fire("Error", String(e).slice(0,300), "error") : alert(String(e).slice(0,300))));
    qs("#q")?.addEventListener("input", render);
    qs("#cat")?.addEventListener("change", render);
    qs("#st")?.addEventListener("change", render);

    loadAll().catch(e => {
      console.error(e);
      const tb = qs("#tb");
      if (tb) tb.innerHTML = `<tr><td colspan="7" class="muted">Error cargando inventario.</td></tr>`;
    });
  </script>
</body>
</html>
