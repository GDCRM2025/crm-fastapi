<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clima</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <link rel="stylesheet" href="/web/panel.css" />
  <style>
    html,body{ height:100%; }
    body{
      margin:0;
      background:
        radial-gradient(1100px 520px at 30% 10%, rgba(25,195,125,.12), transparent 58%),
        radial-gradient(900px 520px at 75% 90%, rgba(96,165,250,.10), transparent 58%),
        #0b1220;
      color: var(--text);
      font-family: inherit;
    }
    .wrap{ padding: 18px; max-width: 980px; margin: 0 auto; }
    .head{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .pill{
      display:flex; align-items:center; gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.20);
      background: rgba(2,6,23,.35);
      font-weight: 950;
    }
    .pill .wx-ico{ font-size: 16px; }
    .pill .wx-temp{ font-weight: 1000; }
    .pill .wx-city{ color: var(--muted); font-weight: 850; }
    .note{ color: var(--muted); font-weight: 750; font-size: 12px; }
    /* Reutiliza estilos de .wx-card, pero como página (sin overlay). */
    .wx-card{ position: relative; inset:auto; margin: 0; max-height:none; overflow: visible; }
    .wx-close{ display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="pill" id="wxPill" title="Clima">
        <span class="wx-ico" id="wxIco">☀️</span>
        <span class="wx-temp" id="wxTemp">—°</span>
        <span class="wx-city" id="wxCity">—</span>
      </div>
      <div class="note">Usa tu ubicación (si das permiso). Fallback: Las Condes.</div>
    </div>

    <section class="wx-card" role="region" aria-label="Clima semanal">
      <header class="wx-head">
        <div class="wx-loc" id="wxModalCity">—</div>
        <div class="wx-main">
          <div class="wx-big-temp" id="wxModalTemp">—°</div>
          <div class="wx-big-ico" id="wxModalIco">☀️</div>
        </div>
        <div class="wx-cond" id="wxModalNow">—</div>
        <div class="wx-sub" id="wxSummary">—</div>
      </header>

      <div class="wx-block">
        <div class="wx-block-title">AHORA</div>
        <div class="wx-hours" id="wxHours"></div>
      </div>

      <div class="wx-block">
        <div class="wx-block-title">PREVISIÓN (7 DÍAS)</div>
        <div class="wx-days" id="wxDays"></div>
      </div>
    </section>
  </div>

  <script type="module" src="/web/js/weather.js?v=20260317-wxpage1"></script>
</body>
</html>
