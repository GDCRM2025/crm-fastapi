<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Operaciones · Ficha Camiones</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/iframe-theme.js"></script>
  <style>
    html,body{height:100%;margin:0;}
    body{background:transparent;padding:12px; overflow-x:hidden;}
    .app{
      height:calc(100vh - 24px);
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:12px;
      min-height:0;
    }
    @media (max-width: 980px){
      .app{grid-template-columns: 1fr;}
    }
    .card{
      border-radius:18px;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.32);
      backdrop-filter: blur(10px);
      overflow:hidden;
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
      min-height:0;
      display:flex;
      flex-direction:column;
    }
    :root.light .card{background: rgba(255,255,255,.78); border-color: rgba(0,0,0,.10);}
    .head{
      padding:12px;
      border-bottom:1px solid rgba(148,163,184,.14);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .ttl{font-weight:1100; letter-spacing:.12em; text-transform:uppercase; font-size:12px;}
    .sub{opacity:.72; font-weight:850; font-size:12px; margin-top:4px;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .inp{
      height:36px;border-radius:999px;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.18);
      color: var(--text);
      padding:0 12px;
      font-weight:900;
      outline:none;
      width:min(320px, 100%);
    }
    :root.light .inp{background: rgba(255,255,255,.65); color: rgba(0,0,0,.85);}
    .btn{
      height:36px;border-radius:999px;
      border:1px solid rgba(148,163,184,.20);
      background: rgba(2,6,23,.18);
      color: var(--text);
      padding:0 14px;
      font-weight:1000;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn.primary{background: color-mix(in srgb, var(--accent) 24%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent);}
    .btn:hover{filter:brightness(1.06);}
    .list{padding:10px;overflow:auto;min-height:0;display:grid;gap:8px;}
    .item{
      border:1px solid rgba(148,163,184,.14);
      background: rgba(2,6,23,.18);
      border-radius: 14px;
      padding:10px;
      cursor:pointer;
    }
    :root.light .item{background: rgba(255,255,255,.62);}
    .item.active{outline:2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset:-2px;}
    .itTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
    .muted{opacity:.72;font-weight:850;font-size:12px;}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:3px 10px;border-radius:999px;
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.12);
      font-weight:1000;
      font-size:12px;
      white-space:nowrap;
    }
    :root.light .pill{background: rgba(255,255,255,.65);}
    .dot{width:10px;height:10px;border-radius:999px;background:rgba(245,158,11,.85);}
    .content{padding:12px;overflow:auto;min-height:0; overflow-x:hidden;}
    .grid{display:grid;grid-template-columns: 1fr 1fr; gap:12px;}
    @media (max-width: 980px){ .grid{grid-template-columns:1fr;} }
    .panel{
      border:1px solid rgba(148,163,184,.14);
      border-radius: 16px;
      background: rgba(2,6,23,.14);
      padding:12px;
    }
    :root.light .panel{background: rgba(255,255,255,.62);}
    .h2{font-weight:1100;margin:0 0 8px;}
    .tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:13px;}
    .tbl th{opacity:.72; font-size:11px; text-transform:uppercase; letter-spacing:.12em; text-align:left; padding:8px 10px; border-bottom:1px solid rgba(148,163,184,.14);}
    .tbl td{padding:8px 10px; border-bottom:1px solid rgba(148,163,184,.10); vertical-align:top;}

    /* Móvil: las tablas anchas se vuelven “tarjetas” (cero scroll lateral). */
    .stack{display:grid; gap:10px;}
    .stackCard{
      border:1px solid rgba(148,163,184,.14);
      border-radius: 14px;
      background: rgba(255,255,255,.03);
      padding:10px;
    }
    :root.light .stackCard{background: rgba(255,255,255,.85);}
    .stackTop{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
    .stackTop b{font-weight:1100;}
    .stackMeta{margin-top:6px; opacity:.82; font-weight:850; font-size:12px; display:flex; gap:10px; flex-wrap:wrap;}
    .k{opacity:.75; font-weight:900;}
    @media (max-width: 980px){
      .app{grid-template-columns: 1fr;}
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="card">
      <div class="head">
        <div>
          <div class="ttl">Ficha Camiones</div>
          <div class="sub">Historial del cami&oacute;n: mantenciones + eventos asignados + checklists (entrega/devoluci&oacute;n).</div>
        </div>
        <div class="row">
          <button class="btn primary" id="btnNew" type="button">+ Nuevo cami&oacute;n</button>
          <button class="btn" id="btnReload" type="button">Recargar</button>
        </div>
      </div>
      <div class="head" style="border-bottom:none;gap:10px">
        <input id="q" class="inp" placeholder="Buscar por nombre o c&oacute;digo…" />
      </div>
      <div class="list" id="list"></div>
    </section>

    <section class="card">
      <div class="head">
        <div>
          <div class="ttl" id="ttl2">Detalle</div>
          <div class="sub" id="sub2">—</div>
        </div>
        <div class="row">
          <button class="btn" id="btnAssign" type="button" disabled>Asignar a evento</button>
          <button class="btn" id="btnEntrega" type="button" disabled>Entrega</button>
          <button class="btn" id="btnDevol" type="button" disabled>Devoluci&oacute;n</button>
        </div>
      </div>
      <div class="content" id="content">
        <div class="muted">Selecciona un cami&oacute;n.</div>
      </div>
    </section>
  </div>

  <script>
    const qs = (s, el=document) => el.querySelector(s);
    const API_BASE = (() => {
      try{
        const h = String(location.hostname || "").toLowerCase();
        const isLocal = (h === "localhost" || h === "127.0.0.1");
        return isLocal ? "" : "/crm";
      }catch(_){
        return "";
      }
    })();
    function getToken(){ return localStorage.getItem("token") || localStorage.getItem("gd_token") || sessionStorage.getItem("token") || ""; }
    function authHeaders(extra={}){ const t=getToken(); return t ? { ...extra, Authorization: "Bearer " + t } : extra; }
    function apiURL(u){
      const s = String(u || "");
      if (!s) return s;
      if (!API_BASE) return s.startsWith("/crm/") ? s.slice(4) : s;
      if (s.startsWith("/crm/")) return s;
      return s.startsWith("/") ? (API_BASE + s) : (API_BASE + "/" + s);
    }
    async function jget(url){
      const r = await fetch(apiURL(url), { headers: authHeaders() });
      const txt = await r.text();
      if (!r.ok) throw new Error(txt);
      return txt ? JSON.parse(txt) : {};
    }
    async function jpost(url, body){
      const r = await fetch(apiURL(url), { method:"POST", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify(body||{}) });
      const txt = await r.text();
      if (!r.ok) throw new Error(txt);
      return txt ? JSON.parse(txt) : {};
    }
    function esc(s){
      return String(s ?? "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[m] || m));
    }

    let ASSETS = [];
    let SELECTED = null;
    let AUTO_OPEN_ID = null;

    try{
      const sp = new URLSearchParams(location.search || "");
      const id = sp.get("id");
      if (id && /^[0-9]+$/.test(id)) AUTO_OPEN_ID = Number(id);
    }catch(_){}

    function renderList(){
      const q = (qs("#q").value || "").trim().toLowerCase();
      const list = qs("#list");
      const items = (ASSETS||[]).filter(a => !q || String(a.nombre||"").toLowerCase().includes(q) || String(a.code||"").toLowerCase().includes(q));
      list.innerHTML = items.length ? items.map(a => {
        const on = SELECTED && Number(SELECTED.id_asset) === Number(a.id_asset) ? "active" : "";
        return `
          <div class="item ${on}" data-id="${esc(a.id_asset)}">
            <div class="itTop">
              <div>
                <div style="font-weight:1100">${esc(a.nombre)}</div>
                <div class="muted"><span class="pill"><span class="dot"></span>CAMION</span> · <strong>${esc(a.code||"—")}</strong></div>
              </div>
              <span class="pill">${esc(a.status||"OK")}</span>
            </div>
          </div>
        `;
      }).join("") : `<div class="muted" style="padding:10px">Sin resultados.</div>`;

      list.querySelectorAll("[data-id]").forEach(el => {
        el.addEventListener("click", async () => openAsset(Number(el.getAttribute("data-id"))));
      });
    }

    async function openAsset(id){
      const a = (ASSETS||[]).find(x => Number(x.id_asset) === Number(id));
      if (!a) return;
      SELECTED = a;
      renderList();
      const hist = await jget(`/assets/${encodeURIComponent(id)}/history`);
      renderDetail(hist);
    }

    async function ensureCamionCategory(){
      // Garantiza al menos una categoría tipo CAMION (para code_prefix auto).
      const cats = await jget("/assets/categories?tipo=CAMION&all=1");
      const items = Array.isArray(cats.items) ? cats.items : [];
      if (items.length) return Number(items[0].id_category || 0) || null;
      await jpost("/assets/categories", { tipo:"CAMION", tipo_maquina:"Camión", cod_tipo:"Cam", grupo:"VEHICULO" });
      const cats2 = await jget("/assets/categories?tipo=CAMION&all=1");
      const it2 = Array.isArray(cats2.items) ? cats2.items : [];
      return it2.length ? (Number(it2[0].id_category || 0) || null) : null;
    }

    function _safeJson(s){
      try{
        if (!s) return null;
        const t = String(s || "").trim();
        if (!t.startsWith("{") && !t.startsWith("[")) return null;
        return JSON.parse(t);
      }catch(_){ return null; }
    }

    function _truckNotesTemplate(){
      return {
        schema: "gd_truck_v1",
        docs: {
          permiso_circulacion: { vence: "", url: "" },
          revision_tecnica: { vence: "", url: "" },
          soap: { vence: "", url: "" },
          seguro: { vence: "", url: "" },
        },
        km: null,
        ultima_mantencion: "",
        notas: ""
      };
    }

    async function truckWizard({ title, defaults }){
      const steps = ["Datos", "Documentos"];
      const base = defaults || {};
      const docs = base.docs || {};

      const q1 = await Swal.fire({
        title: title || "Ficha camión",
        currentProgressStep: 0,
        progressSteps: steps,
        confirmButtonText: "Siguiente",
        showCancelButton: true,
        html: `
          <div style="display:grid;gap:10px;text-align:left">
            <label><b>Nombre</b><br><input id="wNombre" class="swal2-input" placeholder="Ej: Camión 1" value="${esc(base.nombre||"")}" /></label>
            <label><b>Patente</b><br><input id="wPat" class="swal2-input" placeholder="Ej: AB-CD-12 (o vacío = auto)" value="${esc(base.code||"")}" /></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <label><b>Kilómetros</b> <span style="opacity:.7">(opcional)</span><br><input id="wKm" class="swal2-input" inputmode="numeric" placeholder="Ej: 120000" value="${esc(base.km||"")}" /></label>
              <label><b>Última mantención</b> <span style="opacity:.7">(opcional)</span><br><input id="wUlt" class="swal2-input" placeholder="Ej: 2026-03-01" value="${esc(base.ultima_mantencion||"")}" /></label>
            </div>
            <label><b>Notas</b> <span style="opacity:.7">(opcional)</span><br><textarea id="wNotas" style="width:100%;min-height:90px;border-radius:14px;padding:10px;font-weight:900">${esc(base.notas||"")}</textarea></label>
          </div>
        `,
        preConfirm: () => {
          const nombre = (qs("#wNombre", Swal.getHtmlContainer())?.value || "").trim();
          const code = (qs("#wPat", Swal.getHtmlContainer())?.value || "").trim();
          const km = (qs("#wKm", Swal.getHtmlContainer())?.value || "").trim();
          const ultima = (qs("#wUlt", Swal.getHtmlContainer())?.value || "").trim();
          const notas = (qs("#wNotas", Swal.getHtmlContainer())?.value || "").trim();
          if (!nombre) return Swal.showValidationMessage("Nombre requerido");
          return {
            nombre,
            code: code || null,
            km: km ? Number(km) : null,
            ultima_mantencion: ultima || "",
            notas: notas || ""
          };
        }
      });
      if (!q1.isConfirmed) return null;

      const q2 = await Swal.fire({
        title: title || "Ficha camión",
        currentProgressStep: 1,
        progressSteps: steps,
        confirmButtonText: "Guardar",
        showCancelButton: true,
        html: `
          <div style="display:grid;gap:10px;text-align:left">
            <div class="muted" style="margin-bottom:6px">Fechas de vencimiento para alertas (más adelante).</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <label><b>Permiso circulación (vence)</b><br><input id="dPerm" class="swal2-input" type="date" value="${esc(docs?.permiso_circulacion?.vence||"")}" /></label>
              <label><b>Permiso (link)</b> <span style="opacity:.7">(opcional)</span><br><input id="uPerm" class="swal2-input" placeholder="https://..." value="${esc(docs?.permiso_circulacion?.url||"")}" /></label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <label><b>Revisión técnica (vence)</b><br><input id="dRev" class="swal2-input" type="date" value="${esc(docs?.revision_tecnica?.vence||"")}" /></label>
              <label><b>Revisión (link)</b> <span style="opacity:.7">(opcional)</span><br><input id="uRev" class="swal2-input" placeholder="https://..." value="${esc(docs?.revision_tecnica?.url||"")}" /></label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <label><b>SOAP (vence)</b><br><input id="dSoap" class="swal2-input" type="date" value="${esc(docs?.soap?.vence||"")}" /></label>
              <label><b>SOAP (link)</b> <span style="opacity:.7">(opcional)</span><br><input id="uSoap" class="swal2-input" placeholder="https://..." value="${esc(docs?.soap?.url||"")}" /></label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <label><b>Seguro (vence)</b><br><input id="dSeg" class="swal2-input" type="date" value="${esc(docs?.seguro?.vence||"")}" /></label>
              <label><b>Seguro (link)</b> <span style="opacity:.7">(opcional)</span><br><input id="uSeg" class="swal2-input" placeholder="https://..." value="${esc(docs?.seguro?.url||"")}" /></label>
            </div>
          </div>
        `,
        preConfirm: () => {
          const v = (id) => (qs(id, Swal.getHtmlContainer())?.value || "").trim();
          return {
            docs: {
              permiso_circulacion: { vence: v("#dPerm"), url: v("#uPerm") },
              revision_tecnica: { vence: v("#dRev"), url: v("#uRev") },
              soap: { vence: v("#dSoap"), url: v("#uSoap") },
              seguro: { vence: v("#dSeg"), url: v("#uSeg") },
            }
          };
        }
      });
      if (!q2.isConfirmed) return null;

      return { ...q1.value, ...q2.value };
    }

    async function newTruck(){
      const v = await truckWizard({ title: "Nuevo camión", defaults: _truckNotesTemplate() });
      if (!v) return;
      const id_category = await ensureCamionCategory();

      const notes = _truckNotesTemplate();
      notes.docs = v.docs || notes.docs;
      notes.km = v.km || null;
      notes.ultima_mantencion = v.ultima_mantencion || "";
      notes.notas = v.notas || "";

      const created = await jpost("/assets", {
        id_category,
        nombre: v.nombre,
        code: v.code || null,
        notas: JSON.stringify(notes),
      });
      await loadAll();
      if (created && created.id_asset) {
        await openAsset(Number(created.id_asset));
      }
    }

    function renderDetail(hist){
      const a = hist.asset || {};
      const maint = hist.maintenance || [];
      const assigns = hist.assignments || [];
      qs("#ttl2").textContent = a.nombre ? `Camion · ${a.nombre}` : "Detalle";
      qs("#sub2").textContent = (a.code ? `C&oacute;digo: ${a.code}` : "—");
      qs("#btnAssign").disabled = !a.id_asset;
      qs("#btnEntrega").disabled = !a.id_asset;
      qs("#btnDevol").disabled = !a.id_asset;

      const meta = _safeJson(a.notas) || {};
      const docs = meta.docs || {};
      const isNarrow = !!(window.matchMedia && window.matchMedia("(max-width: 980px)").matches);
      const docRow = (label, d) => {
        const vence = (d && d.vence) ? String(d.vence) : "";
        const url = (d && d.url) ? String(d.url) : "";
        const badge = vence ? `<span class="pill">Vence: <b>${esc(vence)}</b></span>` : `<span class="pill" style="opacity:.7">Sin fecha</span>`;
        const link = url ? `<a class="btn" style="height:30px;padding:0 12px;border-radius:999px;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener">Ver</a>` : `<span class="muted">—</span>`;
        return `<tr><td><b>${esc(label)}</b></td><td>${badge}</td><td style="text-align:right">${link}</td></tr>`;
      };

      const docStack = () => {
        const one = (label, d) => {
          const vence = (d && d.vence) ? String(d.vence) : "";
          const url = (d && d.url) ? String(d.url) : "";
          return `
            <div class="stackCard">
              <div class="stackTop">
                <b>${esc(label)}</b>
                ${url ? `<a class="btn" style="height:30px;padding:0 12px;border-radius:999px;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener">Ver</a>` : `<span class="muted">—</span>`}
              </div>
              <div class="stackMeta">
                <span class="pill">${vence ? `Vence: <b>${esc(vence)}</b>` : "Sin fecha"}</span>
              </div>
            </div>
          `;
        };
        return `
          <div class="stack">
            ${one("Permiso circulación", docs.permiso_circulacion)}
            ${one("Revisión técnica", docs.revision_tecnica)}
            ${one("SOAP", docs.soap)}
            ${one("Seguro", docs.seguro)}
          </div>
        `;
      };

      const assignsStack = () => {
        if (!assigns.length) return `<div class="muted">Aún no está asignado a eventos.</div>`;
        return `
          <div class="stack">
            ${assigns.map(x => {
              const when = (x.created_at||"").slice(0,16).replace("T"," ");
              const fe = (x.fecha_evento||"").slice(0,10) || "—";
              return `
                <div class="stackCard">
                  <div class="stackTop">
                    <div>
                      <b>${esc(x.cliente||"—")}</b>
                      <div class="muted">${esc(fe)} · ${esc(x.marca||"—")} · ${esc(x.comuna||"—")}</div>
                    </div>
                    <span class="pill">${esc(x.status||"")}</span>
                  </div>
                  <div class="stackMeta">
                    <span class="pill"><span class="k">Asignado:</span> ${esc(when)}</span>
                    <span class="pill"><span class="k">Conductor:</span> ${esc(x.conductor||"—")}</span>
                    <span class="pill"><span class="k">Ops:</span> ${esc(x.operadores||"—")}</span>
                    ${x.id_lead ? `<button class="btn" style="height:30px;padding:0 12px;border-radius:999px" data-open-lead="${esc(x.id_lead)}" type="button">Lead #${esc(x.id_lead)}</button>` : ``}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      };

      qs("#content").innerHTML = `
        <div class="grid">
          <div class="panel">
            <div class="h2">Ficha</div>
            <table class="tbl">
              <tbody>
                <tr><th style="width:160px">Nombre</th><td>${esc(a.nombre||"—")}</td></tr>
                <tr><th>Patente</th><td>${esc(a.code||"—")}</td></tr>
                <tr><th>Kilómetros</th><td>${meta.km ? esc(meta.km) : "—"}</td></tr>
                <tr><th>Últ. mantención</th><td>${esc(meta.ultima_mantencion||"—")}</td></tr>
              </tbody>
            </table>
            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
              <button class="btn" id="btnEditFicha" type="button">Editar ficha</button>
            </div>
          </div>
          <div class="panel">
            <div class="h2">Mantenciones</div>
            ${maint.length ? `
              <table class="tbl">
                <thead><tr><th>Fecha</th><th>Status</th><th>Detalle</th><th>Por</th></tr></thead>
                <tbody>
                  ${maint.map(m => `
                    <tr>
                      <td>${esc((m.created_at||"").slice(0,16).replace("T"," "))}</td>
                      <td><strong>${esc(m.status||"")}</strong></td>
                      <td>${esc(m.detalle||"")}</td>
                      <td>${esc(m.realizado_por||"")}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            ` : `<div class="muted">Sin mantenciones registradas.</div>`}
          </div>
          <div class="panel">
            <div class="h2">Accesos r&aacute;pidos</div>
            <div class="muted" style="margin-bottom:10px">Los checklists se guardan por evento (Lead).</div>
            <button class="btn" style="width:100%;margin-bottom:8px" id="goEntrega" type="button">Ir a Entrega</button>
            <button class="btn" style="width:100%" id="goDevol" type="button">Ir a Devoluci&oacute;n</button>
          </div>
          <div class="panel" style="grid-column:1/-1">
            <div class="h2">Documentos</div>
            ${isNarrow ? docStack() : `
              <table class="tbl">
                <thead><tr><th>Documento</th><th>Vencimiento</th><th style="text-align:right">Archivo</th></tr></thead>
                <tbody>
                  ${docRow("Permiso circulación", docs.permiso_circulacion)}
                  ${docRow("Revisión técnica", docs.revision_tecnica)}
                  ${docRow("SOAP", docs.soap)}
                  ${docRow("Seguro", docs.seguro)}
                </tbody>
              </table>
            `}
          </div>
          <div class="panel" style="grid-column:1/-1">
            <div class="h2">Eventos asignados</div>
            ${isNarrow ? assignsStack() : (assigns.length ? `
                <table class="tbl">
                  <thead><tr><th>Fecha asign.</th><th>Lead</th><th>Cliente</th><th>Evento</th><th>Conductor</th><th>Operadores</th><th>Marca</th><th>Comuna</th><th>Status</th></tr></thead>
                  <tbody>
                    ${assigns.map(x => `
                      <tr>
                        <td>${esc((x.created_at||"").slice(0,16).replace("T"," "))}</td>
                        <td>${x.id_lead ? `<button class="btn" style="height:30px;padding:0 12px;border-radius:999px" data-open-lead="${esc(x.id_lead)}" type="button">#${esc(x.id_lead)}</button>` : "—"}</td>
                        <td><strong>${esc(x.cliente||"—")}</strong></td>
                        <td>${esc((x.fecha_evento||"").slice(0,10) || "—")}</td>
                        <td>${esc(x.conductor||"—")}</td>
                        <td>${esc(x.operadores||"—")}</td>
                        <td>${esc(x.marca||"—")}</td>
                        <td>${esc(x.comuna||"—")}</td>
                        <td>${esc(x.status||"")}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              ` : `<div class="muted">A&uacute;n no est&aacute; asignado a eventos.</div>`)}
          </div>
        </div>
      `;

      qs("#goEntrega").addEventListener("click", () => window.parent?.postMessage({ type:"openItem", id:"op_ca_ent", url:"/web/views/op_camiones_entrega.html" }, "*"));
      qs("#goDevol").addEventListener("click", () => window.parent?.postMessage({ type:"openItem", id:"op_ca_dev", url:"/web/views/op_camiones_devolucion.html" }, "*"));
      qs("#btnEditFicha")?.addEventListener("click", async () => {
        const base = _truckNotesTemplate();
        const cur = _safeJson(a.notas) || {};
        const merged = { ...base, ...cur, nombre: a.nombre || "", code: a.code || "" };
        const v = await truckWizard({ title: "Editar ficha", defaults: merged });
        if (!v) return;
        const notes = { ...base, ...(cur || {}) };
        notes.docs = v.docs || notes.docs;
        notes.km = v.km || null;
        notes.ultima_mantencion = v.ultima_mantencion || "";
        notes.notas = v.notas || "";
        await jput(`/assets/${encodeURIComponent(a.id_asset)}`, {
          nombre: v.nombre,
          code: v.code || null,
          notas: JSON.stringify(notes),
        });
        await openAsset(Number(a.id_asset));
      });

      qs("#content").querySelectorAll("[data-open-lead]").forEach(b => {
        b.addEventListener("click", () => {
          const id = b.getAttribute("data-open-lead");
          const url = "/web/views/leads.html?open_lead=" + encodeURIComponent(id);
          window.parent?.postMessage({ type:"openItem", id:"leads_ver", url }, "*");
        });
      });
    }

    async function loadAll(){
      const a = await jget("/assets?tipo=CAMION");
      ASSETS = a.items || [];
      SELECTED = null;
      qs("#btnAssign").disabled = true;
      qs("#btnEntrega").disabled = true;
      qs("#btnDevol").disabled = true;
      qs("#content").innerHTML = `<div class="muted">Selecciona un cami&oacute;n.</div>`;
      renderList();

      if (AUTO_OPEN_ID){
        const found = (ASSETS || []).find(x => Number(x.id_asset) === Number(AUTO_OPEN_ID));
        if (found) await openAsset(Number(AUTO_OPEN_ID));
      }
    }

    qs("#btnReload").addEventListener("click", () => loadAll().catch(e => Swal.fire("Error", String(e).slice(0,300), "error")));
    qs("#btnNew")?.addEventListener("click", () => newTruck().catch(e => Swal.fire("Error", String(e).slice(0,300), "error")));
    qs("#q").addEventListener("input", renderList);
    qs("#btnAssign").addEventListener("click", async () => {
      if (!SELECTED) return;
      const res = await Swal.fire({
        title: "Asignar cami\u00f3n a evento (Lead)",
        html: `
          <div style="display:grid;gap:10px;text-align:left">
            <label><b>ID Lead</b><br><input id="lid" class="swal2-input" placeholder="Ej: 9872" /></label>
            <label><b>Conductor</b><br><input id="cond" class="swal2-input" placeholder="Nombre conductor" /></label>
            <label><b>Ayudantes / Operadores</b> <span style="opacity:.7">(opcional)</span><br><input id="ops" class="swal2-input" placeholder="Ej: Juan, Pedro" /></label>
            <label><b>Notas</b><br><textarea id="notes" style="width:100%;min-height:90px;border-radius:14px;padding:10px;font-weight:900"></textarea></label>
          </div>
        `,
        showCancelButton:true,
        confirmButtonText:"Asignar",
        preConfirm: () => {
          const id_lead = (qs("#lid", Swal.getHtmlContainer())?.value || "").trim();
          const conductor = (qs("#cond", Swal.getHtmlContainer())?.value || "").trim();
          const operadores = (qs("#ops", Swal.getHtmlContainer())?.value || "").trim();
          const notes = (qs("#notes", Swal.getHtmlContainer())?.value || "").trim();
          if (!/^[0-9]+$/.test(id_lead)) return Swal.showValidationMessage("ID Lead inv\u00e1lido");
          if (!conductor) return Swal.showValidationMessage("Falta conductor");
          return { id_lead: Number(id_lead), conductor, operadores: operadores || null, notes: notes || null };
        }
      });
      if (!res.isConfirmed) return;
      await jpost(`/assets/${encodeURIComponent(SELECTED.id_asset)}/assign`, res.value);
      await openAsset(Number(SELECTED.id_asset));
    });
    qs("#btnEntrega").addEventListener("click", () => window.parent?.postMessage({ type:"openItem", id:"op_ca_ent", url:"/web/views/op_camiones_entrega.html" }, "*"));
    qs("#btnDevol").addEventListener("click", () => window.parent?.postMessage({ type:"openItem", id:"op_ca_dev", url:"/web/views/op_camiones_devolucion.html" }, "*"));
    loadAll().catch(e => Swal.fire("Error", String(e).slice(0,300), "error"));
  </script>
</body>
</html>
