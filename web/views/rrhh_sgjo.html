<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>RRHH · SGJO</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="/web/rrhh_luna.css" />
  <script src="../js/iframe-theme.js"></script>
  <style>
    body{margin:0;padding:14px;background:transparent;color:var(--text);}
    .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
    .card{
      border:1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.32);
      border-radius:18px;
      padding:14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 22px 70px rgba(0,0,0,.18);
    }
    :root.light .card{ background: rgba(255,255,255,.86); border-color: rgba(0,0,0,.10); }
    .ttl{font-weight:1100; letter-spacing:.12em; text-transform:uppercase; font-size:12px;}
    .big{font-size:22px;font-weight:1200;margin-top:6px;}
    .muted{opacity:.75;font-weight:850;font-size:12px;}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
    .btn{
      height:42px;border-radius:14px;
      border:1px solid rgba(148,163,184,.22);
      background: rgba(2,6,23,.18);
      color:inherit;
      padding:0 14px;
      font-weight:1100;
      cursor:pointer;
      flex:1;
      min-width:240px;
    }
    .btn.primary{background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="ttl">RRHH · SGJO</div>
      <div class="big">Sistema de Gestión de Jornada Operativa</div>
      <div class="muted">Marcación por QR fijo + geolocalización + dispositivo enrolado + hora servidor.</div>
      <div class="row">
        <button class="btn primary" type="button" id="btnRolfis">Abrir Marcación · Rolfis</button>
        <button class="btn primary" type="button" id="btnGD">Abrir Marcación · GreenDiamond</button>
      </div>
      <div class="muted" style="margin-top:10px">
        Tip: en producción se entra normalmente desde el QR (parámetro <code>?p=…</code>).
      </div>
    </div>
  </div>
  <script>
    document.documentElement.classList.add("light");
    document.documentElement.classList.add("rrhh-luna");
    function openInPanel(url){
      try{
        window.parent?.postMessage({ type:"openItem", id:"rrhh_sgjo", url }, "*");
      }catch(_){
        window.open(url, "_blank");
      }
    }
    document.querySelector("#btnRolfis").addEventListener("click", ()=> openInPanel("/web/views/rrhh_sgjo_marcacion.html?p=SGJO-ROLFIS"));
    document.querySelector("#btnGD").addEventListener("click", ()=> openInPanel("/web/views/rrhh_sgjo_marcacion.html?p=SGJO-GREENDIAMOND"));
  </script>
</body>
</html>
